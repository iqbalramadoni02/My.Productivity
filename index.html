  Todos: { text: ['tugas', 'todo', 'text', 'judul'], date: ['tanggal', 'deadline', 'date'], priority: ['prioritas', 'priority'] },
  Journal: { date: ['tanggal', 'date'], title: ['judul', 'title'], content: ['isi', 'jurnal', 'catatan', 'content'], mood: ['mood'] }
};
const IMPORT_TARGETS = {
  Transactions: 'Buku Kas (transaksi)', Assignments: 'Tugas & ujian', Agenda: 'Agenda', Schedule: 'Jadwal mengajar (grid mingguan)', TP: 'Tujuan pembelajaran (TP)', Logbook: 'Logbook mengajar',
  Projects: 'Project', ProjectsLegacy: 'Project (format PROJECT 2026: NAMA, HARGA, DP, PEMBAYARAN)', TutorClasses: 'Kelas tutor', Loans: 'Pinjaman', Recurring: 'Pos rutin', Todos: 'To-do', Journal: 'Jurnal', Backup: 'Cadangan aplikasi (semua kolom sama)'
};

const Excel = {
  lib() { if (typeof XLSX === 'undefined') throw new Error('Library Excel (SheetJS) belum termuat. Periksa koneksi internet lalu muat ulang.'); return XLSX; },

  exportAll() {
    const X = this.lib();
    const wb = X.utils.book_new();
    Object.keys(SCHEMA).forEach((k) => {
      const ws = X.utils.json_to_sheet(Store.all(k).map((r) => { const o = {}; SCHEMA[k].forEach((h) => { o[h] = r[h]; }); return o; }), { header: SCHEMA[k] });
      X.utils.book_append_sheet(wb, ws, k);
    });
    X.writeFile(wb, `MyProductivityHub_backup_${todayISO()}.xlsx`);
    UI.toast('File cadangan diunduh', 'ok');
  },
  exportSheet(sheet) {
    const X = this.lib();
    const wb = X.utils.book_new();
    const rows = Store.all(sheet).map((r) => { const o = {}; SCHEMA[sheet].forEach((h) => { o[h] = r[h]; }); return o; });
    X.utils.book_append_sheet(wb, X.utils.json_to_sheet(rows, { header: SCHEMA[sheet] }), sheet);
    X.writeFile(wb, `${sheet}_${todayISO()}.xlsx`);
  },

  /* --- konversi nilai --- */
  norm(h) { return String(h == null ? '' : h).toLowerCase().replace(/\s+/g, ' ').replace(/[:.]+$/, '').trim(); },
  toDate(v) {
    if (v == null || v === '') return '';
    if (typeof v === 'number' && v > 20000 && v < 80000) { const d = this.lib().SSF.parse_date_code(v); return d ? `${d.y}-${pad(d.m)}-${pad(d.d)}` : ''; }
    if (v instanceof Date && !isNaN(v)) return ymd(v);
    const s = String(v).trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
    m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})$/);
    if (m) { let y = +m[3]; if (y < 100) y += 2000; return `${y}-${pad(m[2])}-${pad(m[1])}`; }
    return '';
  },
  toTime(v) {
    if (typeof v === 'number' && v >= 0 && v < 1) return minToTime(Math.round(v * 1440));
    return normTime(v);
  },
  timeRange(v) {
    if (typeof v === 'number') return [this.toTime(v), ''];
    const parts = String(v || '').split(/\s*[-–]\s*/);
    const first = (p) => { const m = String(p || '').match(/(\d{1,2})[.:](\d{2})/); return m ? `${pad(m[1])}:${m[2]}` : ''; };
    return [first(parts[0]), first(parts[1])];
  },
  money(v) { if (typeof v === 'number') return v; const s = String(v || '').replace(/[^\d,.-]/g, ''); return Number(s.replace(/[.,](?=\d{3}(\D|$))/g, '').replace(',', '.')) || 0; },

  findHeader(rows, target) {
    const al = ALIASES[target] || {};
    let best = { idx: -1, score: 0, map: {} };
    rows.slice(0, 15).forEach((r, idx) => {
      const map = {}; let score = 0;
      (r || []).forEach((cell, ci) => {
        const h = this.norm(cell);
        if (!h) return;
        Object.keys(al).forEach((f) => {
          if (map[f] != null) return;
          if (al[f].includes(h) || al[f].some((a) => a.length > 3 && h.startsWith(a))) { map[f] = ci; score++; }
        });
      });
      if (score > best.score) best = { idx, score, map };
    });
    return best;
  },

  detect(name, rows) {
    const n = name.toLowerCase();
    const r0 = (rows[0] || []).map((x) => this.norm(x));
    if (SCHEMA[name] && r0.includes('id')) return 'Backup';
    if (rows.slice(0, 10).some((r) => (r || []).some((c) => /^(monday|senin)$/i.test(String(c).trim())))) return 'Schedule';
    if (rows.slice(0, 5).some((r) => { const h = (r || []).map((x) => this.norm(x)); return h.includes('nama') && h.includes('harga') && h.includes('dp'); })) return 'ProjectsLegacy';
    if (/^tp\b/.test(n)) return 'TP';
    if (/task/.test(n)) return 'Assignments';
    if (/appointment|agenda|deadline/.test(n)) return 'Agenda';
    if (/logbook|jurnal mengajar/.test(n)) return 'Logbook';
    if (/pinjam|loan|kredit/.test(n)) return 'Loans';
    if (/project/.test(n)) return 'Projects';
    let best = ['Transactions', 0];
    Object.keys(ALIASES).forEach((t) => { const s = this.findHeader(rows, t).score; if (s > best[1]) best = [t, s]; });
    return best[1] >= 3 ? best[0] : 'Transactions';
  },

  statusMap(target, v) {
    const s = String(v || '').toLowerCase().trim();
    if (target === 'Assignments') return /done|selesai|finish/.test(s) ? 'Selesai' : /grad|nilai/.test(s) ? 'Dinilai' : /submit|kumpul/.test(s) ? 'Dikumpulkan' : 'Diberikan';
    if (target === 'Agenda') return /done|selesai/.test(s) ? 'Selesai' : /batal|cancel/.test(s) ? 'Batal' : 'Terjadwal';
    if (target === 'TP') return /selesai|done/.test(s) ? 'Selesai' : /proses|progress/.test(s) ? 'Proses' : 'Belum';
    if (target === 'Projects') return /lunas|selesai|done/.test(s) ? 'Selesai' : /revisi/.test(s) ? 'Revisi' : /batal/.test(s) ? 'Batal' : 'Dikerjakan';
    return v;
  },

  /** Mengubah baris sheet menjadi operasi create */
  build(target, rows, sheetName, opts) {
    const today = todayISO();
    const out = [];
    if (target === 'Backup') {
      const head = rows[0].map((h) => String(h).trim());
      const sheet = SCHEMA[sheetName] ? sheetName : opts.backupSheet;
      rows.slice(1).forEach((r) => {
        const o = {}; head.forEach((h, i) => { if (SCHEMA[sheet].includes(h)) o[h] = r[i] == null ? '' : r[i]; });
        if (!o.id || Store.get(sheet, o.id)) return;
        ['date', 'given', 'deadline', 'startDate', 'dueDate', 'paidDate'].forEach((k) => { if (k in o && o[k] !== '') o[k] = this.toDate(o[k]) || o[k]; });
        ['start', 'end', 'startTime'].forEach((k) => { if (k in o && o[k] !== '') o[k] = this.toTime(o[k]); });
        out.push({ op: 'create', sheet, row: o, noCal: true });
      });
      return out;
    }
    if (target === 'Schedule') {
      const hi = rows.findIndex((r) => (r || []).some((c) => /^(monday|senin)$/i.test(String(c).trim())));
      const dayMap = { monday: 1, senin: 1, tuesday: 2, selasa: 2, wednesday: 3, rabu: 3, thursday: 4, kamis: 4, friday: 5, jumat: 5, "jum'at": 5, saturday: 6, sabtu: 6, sunday: 7, minggu: 7 };
      const cols = {};
      rows[hi].forEach((c, i) => { const d = dayMap[this.norm(c)]; if (d) cols[i] = d; });
      const items = [];
      rows.slice(hi + 1).forEach((r) => {
        const tcell = (r || []).find((c) => /\d{1,2}[.:]\d{2}.*[-–].*\d{1,2}[.:]\d{2}/.test(String(c)));
        if (!tcell) return;
        const [start, end] = this.timeRange(tcell);
        if (!start || !end) return;
        Object.keys(cols).forEach((ci) => {
          const txt = String(r[ci] == null ? '' : r[ci]).trim();
          if (!txt || txt === '-' || /^off$/i.test(txt) || /^\d{1,2}[.:]\d{2}\s*[-–]/.test(txt)) return;
          const prev = items.filter((x) => x.day === cols[ci]).pop();
          if (prev && prev.className === txt && prev.end === start) prev.end = end;
          else items.push({ day: cols[ci], start, end, className: txt, subject: /duty|piket/i.test(txt) ? 'Duty' : '' });
        });
      });
      items.forEach((x) => { if (!Store.all('Schedule').some((s) => Number(s.day) === x.day && s.start === x.start && s.className === x.className)) out.push({ op: 'create', sheet: 'Schedule', row: x }); });
      return out;
    }
    if (target === 'ProjectsLegacy') {
      const hi = rows.findIndex((r) => { const h = (r || []).map((x) => this.norm(x)); return h.includes('nama') && h.includes('harga'); });
      const h = rows[hi].map((x) => this.norm(x));
      const iName = h.indexOf('nama'), iSvc = h.indexOf('jenis project'), iPrice = h.indexOf('harga'), iDp = h.indexOf('dp');
      const dates = h.map((x, i) => x === 'date' ? i : -1).filter((i) => i >= 0);
      const iStart = dates.find((i) => i > iPrice) ?? dates[0], iDpDate = dates.find((i) => i > iDp) ?? iStart;
      const iP1 = h.indexOf('pembayaran 1'), iP2 = h.indexOf('pembayaran 2'), iKet = h.indexOf('keterangan');
      rows.slice(hi + 1).forEach((r) => {
        if (!r) return;
        const name = String(r[iName] == null ? '' : r[iName]).trim();
        const price = this.money(r[iPrice]);
        if (!name || !price) return;
        const svcRaw = r[iSvc];
        const svcIsDate = typeof svcRaw === 'number' && svcRaw > 20000;
        const svc = (svcIsDate ? '' : String(svcRaw || '').trim()) || name;
        const start = this.toDate(r[iStart]) || (svcIsDate ? this.toDate(svcRaw) : '') || '';
        if (Store.all('Projects').some((p) => p.clientName === name && Number(p.price) === price && p.startDate === start)) return;
        const lunas = /^lunas/i.test(String(r[iKet] || '').trim());
        const cat = /tesis|thesis/i.test(svc) ? 'Tesis (S2)' : /skripsi|bab|proposal/i.test(svc + name) ? 'Skripsi (S1)' : 'Jurnal / Translasi / Lainnya';
        const tasks = Project.template(svc).map((t) => Object.assign(t, { d: lunas }));
        const id = uid();
        out.push({ op: 'create', sheet: 'Projects', noCal: true, row: { id, code: Project.nextCode().replace(/\d+$/, (n) => String(Number(n) + out.filter((o) => o.sheet === 'Projects').length).padStart(3, '0')), clientName: name, category: cat, service: svc, speed: 'Normal', price, discount: 0, startDate: start, deadline: '', status: lunas ? 'Selesai' : 'Dikerjakan', tasks: JSON.stringify(tasks), progress: lunas ? 100 : 0, portalToken: token(24), note: 'Diimpor dari ' + sheetName } });
        const payRow = (amt, date, kind) => { if (amt > 0) out.push({ op: 'create', sheet: 'Transactions', row: { date, type: 'income', category: 'Fee Project', amount: amt, description: `${kind} ${name} (${svc})`, source: 'project', refId: id, kind, method: 'Transfer' } }); };
        const payDate = start || today;
        payRow(this.money(r[iDp]), this.toDate(r[iDpDate]) || payDate, 'DP');
        if (iP1 >= 0) payRow(this.money(r[iP1]), payDate, 'Termin');
        if (iP2 >= 0) payRow(this.money(r[iP2]), payDate, 'Pelunasan');
      });
      return out;
    }

    const hd = this.findHeader(rows, target);
    if (hd.idx < 0 || hd.score < 1) return out;
    const map = hd.map;
    let lastUnit = '';
    const prog = opts.program || (sheetName.match(/^tp\s+(.+)$/i) || [])[1] || sheetName;
    rows.slice(hd.idx + 1).forEach((r) => {
      if (!r || r.every((c) => c == null || c === '')) return;
      const g = (f) => (map[f] != null ? r[map[f]] : undefined);
      const str = (f) => { const v = g(f); return v == null ? '' : String(v).trim(); };
      let row = null, noCal = false;
      switch (target) {
        case 'Transactions': {
          const amount = this.money(g('amount'));
          if (!(amount > 0)) return;
          const tv = str('type').toLowerCase();
          const type = /masuk|income|pemasukan|kredit/.test(tv) ? 'income' : /keluar|expense|pengeluaran|debit/.test(tv) ? 'expense' : opts.defType || 'expense';
          const catFromType = tv && !/masuk|keluar|income|expense|pemasukan|pengeluaran|kredit|debit/.test(tv) ? str('type') : '';
          row = { date: this.toDate(g('date')) || today, type, category: str('category') || catFromType || (type === 'income' ? 'Pemasukan Lain' : 'Pengeluaran Lain'), amount, description: str('description'), method: str('method'), source: 'manual' };
          if (Store.all('Transactions').some((t) => t.date === row.date && Number(t.amount) === amount && t.description === row.description)) return;
          break;
        }
        case 'Assignments': {
          const title = str('title'); if (!title || /\(contoh\)/i.test(title)) return;
          row = { title, subject: str('subject'), className: str('className'), given: this.toDate(g('given')), deadline: this.toDate(g('deadline')), status: this.statusMap(target, str('status')), link: /^https?:/.test(str('link')) ? str('link') : '', note: /^https?:/.test(str('link')) ? '' : str('link'), type: str('type') || 'Tugas' };
          if (Store.all('Assignments').some((a) => a.title === title && a.deadline === row.deadline && a.className === row.className)) return;
          noCal = !row.deadline || row.deadline < today || row.status === 'Selesai';
          break;
        }
        case 'Agenda': {
          const title = str('title'); const date = this.toDate(g('date'));
          if (!title || !date) return;
          const [s, e] = this.timeRange(g('start'));
          row = { title, date, start: s, end: e || this.toTime(g('end')), type: str('type'), status: this.statusMap(target, str('status')), location: str('location') };
          if (Store.all('Agenda').some((a) => a.title === title && a.date === date)) return;
          noCal = date < today;
          break;
        }
        case 'TP': {
          const obj = str('objective'); const code = str('code');
          if (!obj || code === '-' || /dinonaktifkan/i.test(obj)) return;
          if (str('unit')) lastUnit = str('unit');
          row = { program: prog, unit: lastUnit, code, objective: obj, skill: str('skill'), status: this.statusMap(target, str('status')), month: str('month'), note: str('note') };
          if (Store.all('TP').some((x) => x.program === prog && x.code === code && x.objective === obj)) return;
          break;
        }
        case 'Logbook': {
          const date = this.toDate(g('date')); if (!date || !str('className')) return;
          row = { date, className: str('className'), subject: str('subject'), topic: str('topic'), present: this.money(g('present')) || '', total: this.money(g('total')) || '', reflection: str('reflection') };
          break;
        }
        case 'Projects': {
          const name = str('clientName'); const price = this.money(g('price')); if (!name) return;
          const svc = str('service') || 'Layanan';
          row = { code: '', clientName: name, service: svc, category: /tesis/i.test(svc) ? 'Tesis (S2)' : /skripsi|bab|proposal/i.test(svc) ? 'Skripsi (S1)' : 'Jurnal / Translasi / Lainnya', speed: 'Normal', price, startDate: this.toDate(g('startDate')) || today, deadline: this.toDate(g('deadline')), status: this.statusMap('Projects', str('status')), campus: str('campus'), clientEmail: str('clientEmail'), clientWa: str('clientWa'), tasks: JSON.stringify(Project.template(svc)), progress: 0, portalToken: token(24) };
          noCal = !row.deadline || row.deadline < today;
          break;
        }
        case 'TutorClasses': {
          const name = str('name'); if (!name) return;
          row = { name, clientName: str('clientName') || name, tutorType: str('tutorType') || 'English', mode: 'Individu', participants: 1, totalSessions: this.money(g('totalSessions')) || 8, rateType: 'sesi', rate: this.money(g('rate')), durationMin: 60, days: '', startDate: today, status: 'Aktif' };
          break;
        }
        case 'Loans': {
          const cr = str('creditor'); const pr = this.money(g('principal')); if (!cr || !pr) return;
          row = { creditor: cr, principal: pr, ratePct: Number(String(g('ratePct') || 0).replace(',', '.')) || 0, interestType: 'flat', tenor: this.money(g('tenor')) || 12, startDate: this.toDate(g('startDate')) || today, installment: 0, disbursed: false, status: 'Aktif', note: 'Diimpor — buka "Ubah" untuk membuat jadwal cicilan' };
          break;
        }
        case 'Recurring': {
          const name = str('name'); const amount = this.money(g('amount')); if (!name || !amount || /^total/i.test(name)) return;
          row = { name, amount, type: opts.defType || 'expense', category: str('category'), dayOfMonth: 1, active: true };
          break;
        }
        case 'Todos': { const text = str('text'); if (!text) return; row = { text, date: this.toDate(g('date')), priority: str('priority') || 'Sedang', done: false }; break; }
        case 'Journal': { const date = this.toDate(g('date')); if (!date) return; row = { date, title: str('title'), content: esc(str('content')), mood: this.money(g('mood')) || 3 }; break; }
        default: return;
      }
      out.push({ op: 'create', sheet: target, row, noCal });
    });
    if (target === 'Projects') {
      let n = 0;
      out.forEach((o) => { if (!o.row.code) { n++; o.row.code = Project.nextCode().replace(/\d+$/, (x) => String(Number(x) + n - 1).padStart(3, '0')); } });
    }
    return out;
  },

  importDialog(preset) {
    let wb = null;
    const m = UI.modal({
      title: 'Impor dari Excel / CSV', size: 'wide',
      body: `<div class="note mb">Mendukung file cadangan aplikasi ini dan Excel lama Anda: sheet <b>Task Management</b>, <b>Appointment</b>, <b>Deadline</b>, <b>Schedule</b> (grid mingguan), <b>TP …</b>, <b>PROJECT 2026 / REKAP PROJECT</b>, serta tabel transaksi dengan kolom Tanggal, Jumlah, Keterangan. Kolom dikenali otomatis; data yang sama tidak diimpor dua kali.</div>
        <div class="form">
          <div class="field full"><label>File (.xlsx, .xls, .csv)</label><input class="input" type="file" id="imp-file" accept=".xlsx,.xls,.csv,.ods" style="padding-top:6px"></div>
          <div class="field"><label>Sheet</label><select class="select" id="imp-sheet" disabled></select></div>
          <div class="field"><label>Impor sebagai</label><select class="select" id="imp-target">${Object.entries(IMPORT_TARGETS).map(([k, l]) => `<option value="${k}" ${k === preset ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
          <div class="field" id="imp-deftype-f"><label>Jenis default (bila kolom jenis kosong)</label><select class="select" id="imp-deftype"><option value="expense">Pengeluaran</option><option value="income">Pemasukan</option></select></div>
          <div class="field" id="imp-bk-f" hidden><label>Tabel tujuan cadangan</label><select class="select" id="imp-bk">${Object.keys(SCHEMA).map((k) => `<option>${k}</option>`).join('')}</select></div>
          <div class="field full"><div id="imp-preview" class="mini muted">Pilih file untuk melihat pratinjau.</div></div>
        </div>`,
      foot: `<button class="btn" data-close>Batal</button><button class="btn primary" id="imp-go" disabled>${ic('upload')}Impor</button>`,
      onMount: (box) => {
        const X = this.lib();
        const fileEl = $('#imp-file', box), sheetEl = $('#imp-sheet', box), targetEl = $('#imp-target', box), prev = $('#imp-preview', box), go = $('#imp-go', box);
        let ops = [];
        const rowsOf = (name) => X.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: '' });
        const refresh = () => {
          if (!wb) return;
          const name = sheetEl.value;
          const rows = rowsOf(name);
          $('#imp-deftype-f', box).hidden = !['Transactions', 'Recurring'].includes(targetEl.value);
          $('#imp-bk-f', box).hidden = !(targetEl.value === 'Backup' && !SCHEMA[name]);
          try {
            ops = this.build(targetEl.value, rows, name, { defType: $('#imp-deftype', box).value, backupSheet: $('#imp-bk', box).value });
          } catch (e) { ops = []; prev.innerHTML = `<span class="neg">Gagal membaca: ${esc(e.message)}</span>`; go.disabled = true; return; }
          const bySheet = groupBy(ops, (o) => o.sheet);
          const sample = ops.filter((o) => o.sheet !== 'Transactions' || targetEl.value === 'Transactions').slice(0, 5).map((o) => o.row);
          prev.innerHTML = ops.length
            ? `<b>${ops.length} baris siap diimpor</b> (${Object.entries(bySheet).map(([k, v]) => `${k}: ${v.length}`).join(', ')}).<div class="table-wrap mt"><table class="tbl"><thead><tr>${Object.keys(sample[0] || {}).filter((k) => !['tasks', 'portalToken', 'id'].includes(k)).slice(0, 7).map((k) => `<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${sample.map((r) => `<tr>${Object.keys(sample[0]).filter((k) => !['tasks', 'portalToken', 'id'].includes(k)).slice(0, 7).map((k) => `<td>${esc(String(r[k] ?? '').slice(0, 60))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
            : '<span class="warn">Tidak ada baris baru yang cocok. Coba pilih jenis impor lain, atau data sudah pernah diimpor.</span>';
          go.disabled = !ops.length;
        };
        fileEl.addEventListener('change', async () => {
          const f = fileEl.files[0];
          if (!f) return;
          try {
            wb = X.read(await f.arrayBuffer(), { type: 'array' });
            sheetEl.innerHTML = wb.SheetNames.map((n) => `<option>${esc(n)}</option>`).join('');
            sheetEl.disabled = false;
            const pick = wb.SheetNames.find((n) => { const d = this.detect(n, rowsOf(n)); return preset ? d === preset || (preset === 'Projects' && d === 'ProjectsLegacy') : d !== 'Transactions'; }) || wb.SheetNames[0];
            sheetEl.value = pick;
            targetEl.value = this.detect(pick, rowsOf(pick));
            refresh();
          } catch (e) { prev.innerHTML = `<span class="neg">File tidak dapat dibaca: ${esc(e.message)}</span>`; }
        });
        sheetEl.addEventListener('change', () => { targetEl.value = this.detect(sheetEl.value, rowsOf(sheetEl.value)); refresh(); });
        [targetEl, $('#imp-deftype', box), $('#imp-bk', box)].forEach((el) => el.addEventListener('change', refresh));
        go.addEventListener('click', async () => {
          go.disabled = true;
          const all = ops.slice();
          m.close();
          UI.toast(`Mengimpor ${all.length} baris…`);
          let failed = false;
          for (let i = 0; i < all.length; i += 250) {
            const r = await Store.commit(all.slice(i, i + 250), { silent: true });
            if (r && r.ok === false) { failed = true; break; }
          }
          if (!failed) UI.toast(`${all.length} baris berhasil diimpor`, 'ok');
        });
      }
    });
  }
};
/** Impor database lengkap (file Database.xlsx / cadangan): semua sheet sekaligus, TIDAK menghapus data yang ada. */
Excel.importFull = function () {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.xlsx,.xls';
  inp.addEventListener('change', async () => {
    const f = inp.files[0];
    if (!f) return;
    try {
      const X = this.lib();
      const wb = X.read(await f.arrayBuffer(), { type: 'array' });
      const ops = [], raw = [];
      const settingsNow = new Set(Store.all('Settings').map((r) => r.id));
      wb.SheetNames.forEach((name) => {
        if (!SCHEMA[name]) {
          const disp = X.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: false, defval: '' });
          if (disp.length) raw.push({ name, rows: disp });
          return;
        }
        const rows = X.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: '' });
        if (!rows.length) return;
        const head = rows[0].map((h) => String(h).trim());
        if (!head.includes('id')) return;
        rows.slice(1).forEach((r) => {
          const o = {};
          head.forEach((h, i) => { if (SCHEMA[name].includes(h)) o[h] = r[i] == null ? '' : r[i]; });
          if (o.id === '' || o.id == null) return;
          o.id = String(o.id);
          ['date', 'given', 'deadline', 'startDate', 'dueDate', 'paidDate'].forEach((k) => { if (k in o && o[k] !== '') o[k] = this.toDate(o[k]) || String(o[k]); });
          ['start', 'end', 'startTime'].forEach((k) => { if (k in o && o[k] !== '') o[k] = this.toTime(o[k]); });
          if (name === 'Settings') { if (!settingsNow.has(o.id)) ops.push({ op: 'upsert', sheet: 'Settings', id: o.id, row: o }); return; }
          if (Store.get(name, o.id)) return;
          ops.push({ op: 'create', sheet: name, row: o, noCal: true });
        });
      });
      const archives = Store.isRemote() ? raw.filter((r) => /^arsip/i.test(r.name)) : [];
      if (!ops.length && !archives.length) { UI.toast('Tidak ada data baru di file ini (semua sudah ada).'); return; }
      const sendArchives = async () => {
        let made = 0;
        for (const a of archives) {
          const values = a.rows.map((row) => row.map((c) => (c == null ? '' : typeof c === 'number' || typeof c === 'boolean' ? c : String(c))));
          const j = await Api.call('rawSheet', { name: a.name, values });
          if (j.created) made++;
        }
        return made;
      };
      if (!ops.length) {
        UI.toast('Memeriksa sheet arsip…', '', 2500);
        const made = await sendArchives();
        UI.toast(made ? `Tidak ada data baru; ${made} sheet arsip ditambahkan.` : 'Tidak ada data baru di file ini (semua sudah ada).', made ? 'ok' : '', 6000);
        return;
      }
      const summary = Object.entries(groupBy(ops, (o) => o.sheet)).map(([k, v]) => `${k}: ${v.length}`).join(', ');
      if (!(await UI.confirm(`Tambahkan <b>${ops.length}</b> baris data${archives.length ? ` dan <b>${archives.length}</b> sheet arsip` : ''} ke database?<br><span class="mini muted">${esc(summary)}</span><br><br>Data yang sudah ada tidak diubah atau dihapus.`, { ok: 'Impor sekarang' }))) return;
      UI.toast(`Mengimpor ${ops.length} baris…`, '', 4000);
      for (let i = 0; i < ops.length; i += 250) {
        const r = await Store.commit(ops.slice(i, i + 250), { silent: true });
        if (r && r.ok === false) return;
      }
      const made = await sendArchives();
      UI.toast(`Impor selesai: ${ops.length} baris${archives.length ? `, ${made} sheet arsip baru` : ''}. Jalankan "Sinkronkan ulang kalender" untuk agenda mendatang.`, 'ok', 8000);
    } catch (e) { UI.toast('Impor gagal: ' + e.message, 'err', 8000); }
  });
  inp.click();
};
ACT.impExcel = (d) => Excel.importDialog(d.target);
ACT.impFull = () => Excel.importFull();
ACT.expSheet = (d) => Excel.exportSheet(d.sheet);

  const prefersDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = Config.data.theme || (prefersDark ? 'dark' : 'light');
  App.shell();
  bindGlobalEvents();
  try {
    await Store.init();
  } catch (e) {
    console.error(e);
    UI.toast('Gagal memuat data: ' + e.message, 'err', 8000);
