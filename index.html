<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rekap Belajarku — SMAIT Al-Ittihad</title>
<meta name="theme-color" content="#4A57B8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rekap Belajarku">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --t1:#4A57B8; --t1-soft:#E9EBF8; --t2:#46756A; --t2-soft:#E4F1EE; --t3:#836A19; --t3-soft:#F7F0DC;
  --ok:#37785F; --ok-soft:#E4F2EC; --warn:#926523; --warn-soft:#F9F0DF; --danger:#BB4047; --danger-soft:#FBE9EA;
  --bg:#F7F8FC; --surface:#fff; --surface-2:#F3F5FB; --ink:#272C45; --ink-2:#434A69; --muted:#5C6482; --line:#E3E6F1;
  --r:16px; --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --t1:#8E9AEA; --t1-soft:#222845; --t2:#7FC9B8; --t2-soft:#15322C; --t3:#E0BE6A; --t3-soft:#38301A;
  --ok:#74CFAE; --ok-soft:#14352C; --warn:#E3B573; --warn-soft:#3A2D17; --danger:#EE9398; --danger-soft:#431F22;
  --bg:#0D101C; --surface:#161A2A; --surface-2:#1D2234; --ink:#E6E9F7; --ink-2:#C0C5DC; --muted:#98A0BC; --line:#29304A;
}}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20% -10% auto -10%;height:60vh;z-index:-1;pointer-events:none;
  background:radial-gradient(56% 44% at 10% 0%,color-mix(in srgb,var(--t1) 18%,transparent),transparent 68%),
             radial-gradient(48% 40% at 90% 4%,color-mix(in srgb,var(--t2) 16%,transparent),transparent 70%),
             radial-gradient(42% 36% at 54% 0%,color-mix(in srgb,var(--t3) 14%,transparent),transparent 72%);filter:blur(16px)}
.wrap{max-width:680px;margin:0 auto;padding:18px 16px 56px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.head h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.head p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.logo{flex:0 0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;
  background-image:linear-gradient(160deg,color-mix(in srgb,var(--t1) 4%,var(--surface)),var(--surface))}
.card h2{margin:0 0 4px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{margin:14px 0 6px;font-size:13.5px;font-weight:800;color:var(--ink-2)}
.mini{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.pos{color:var(--ok)} .neg{color:var(--danger)}
.mt{margin-top:12px}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 16px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--t1)}
.btn.primary{background:var(--t1);border-color:var(--t1);color:#fff}
.btn.xs{min-height:32px;padding:0 11px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.input{width:100%;min-height:44px;padding:10px 13px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);font:inherit}
.input:focus{outline:none;border-color:var(--t1)}
textarea.input{min-height:84px;resize:vertical}
label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin:10px 0 5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.chip{display:grid;gap:3px;padding:14px 12px;text-align:left;border:1.5px solid var(--line);border-radius:15px;
  background:var(--surface);font:inherit;color:inherit;cursor:pointer;
  background-image:linear-gradient(150deg,color-mix(in srgb,var(--t1) 9%,var(--surface)),var(--surface))}
.chip:hover{border-color:var(--t1);transform:translateY(-1px)}
.chip b{font-size:17px}.chip span{font-size:11.5px;color:var(--muted)}
.names{display:grid;gap:7px;max-height:56vh;overflow:auto}
.nm{text-align:left;padding:13px 15px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface);
  color:inherit;font:inherit;font-weight:600;cursor:pointer}
.nm:hover{border-color:var(--t1);color:var(--t1)}
.back{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;
  background:var(--surface-2);color:var(--muted)}
.badge.b1{background:var(--t1-soft);color:var(--t1)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.tone{background:var(--t2-soft);color:var(--t2)}
.id{display:flex;align-items:center;gap:12px}
.id b{font-size:16px;display:block}
.av{flex:0 0 auto;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  background:var(--t1);color:#fff;font-weight:800;font-size:16px}
.abs-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:9px;margin-top:10px}
.ab{min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);
  font:inherit;font-weight:700;font-size:14.5px;color:var(--ink-2);cursor:pointer}
.ab.ok{border-color:color-mix(in srgb,var(--ok) 42%,transparent);color:var(--ok)}
.ab.warn{border-color:color-mix(in srgb,var(--warn) 42%,transparent);color:var(--warn)}
.ab.danger{border-color:color-mix(in srgb,var(--danger) 42%,transparent);color:var(--danger)}
.ab.on{color:#fff}
.ab.ok.on{background:var(--ok);border-color:var(--ok)}
.ab.warn.on{background:var(--warn);border-color:var(--warn)}
.ab.danger.on{background:var(--danger);border-color:var(--danger)}
.ab:disabled{opacity:.6;cursor:progress}
.task{border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:11px;background:var(--surface-2)}
.task .t{font-weight:700;font-size:15px}
.task .s{font-size:12px;color:var(--muted);margin-top:2px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:9px}
.sum>div{background:var(--surface-2);border-radius:11px;padding:9px 11px}
.sum small{display:block;font-size:10.5px;color:var(--muted)}
.sum b{font-size:18px;font-weight:800}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list li{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-radius:11px;background:var(--surface-2)}
.list .grow{flex:1;min-width:0}
.list .t{font-weight:700;font-size:13.5px}
.list .s{font-size:11.5px;color:var(--muted)}
.hist{display:flex;flex-wrap:wrap;gap:5px}
.h{display:inline-grid;place-items:center;min-width:28px;height:24px;padding:0 5px;border-radius:7px;font-size:11px;font-weight:800;
  background:var(--surface-2);color:var(--muted)}
.h.hadir{background:var(--ok-soft);color:var(--ok)}
.h.izin{background:var(--warn-soft);color:var(--warn)}
.h.sakit{background:var(--t3-soft);color:var(--t3)}
.h.alpa{background:var(--danger-soft);color:var(--danger)}
.h.x{background:var(--surface-2);color:var(--muted);font-weight:600;padding:0 8px}
.lk-chips{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0}
.lk-chip{display:inline-flex;align-items:center;gap:5px;max-width:230px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--t1-soft);color:var(--t1);font-size:11.5px;font-weight:700;
  text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.les{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface-2);margin-bottom:10px;
  background-image:linear-gradient(150deg,color-mix(in srgb,var(--t1) 6%,transparent),transparent 62%)}
.les.soon{opacity:.62;border-style:dashed}
.les-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.les-h b{font-size:14px}
.les-t{font-size:13.5px;font-weight:600;line-height:1.45}
.les-m{font-size:12px;color:var(--muted);line-height:1.5;margin-top:2px}
.note{font-size:12.5px;border-radius:11px;padding:10px 12px;background:var(--surface-2);color:var(--muted);margin-bottom:10px}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.err{background:var(--danger-soft);color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:26px 12px;border:1.5px dashed var(--line);border-radius:var(--r);font-size:13px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;max-width:92vw;
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.ok{background:var(--ok);color:#fff}
.toast.warn{background:var(--warn);color:#fff}
.toast.err{background:var(--danger);color:#fff}
footer{text-align:center;font-size:11.5px;color:var(--muted);margin-top:26px}

.id .grade{display:flex;flex-direction:column;align-items:center;min-width:58px;padding:5px 10px;border-radius:12px;background:var(--t1-soft);color:var(--t1)}
.id .grade b{font-size:17px;line-height:1.1;display:block}.id .grade span{font-size:11px;font-weight:700}
.tabs{display:flex;gap:6px;margin:0 0 14px;overflow-x:auto;padding-bottom:2px}
.tab{position:relative;display:flex;align-items:center;gap:6px;flex:0 0 auto;min-height:46px;padding:9px 15px;border-radius:13px;
  border:1px solid var(--line);background:var(--surface);font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{border-color:var(--t1);color:var(--ink)}
.tab.on{background:var(--t1);border-color:var(--t1);color:#fff}
.tab i{display:inline-flex;align-items:center;justify-content:center;font-style:normal;min-width:19px;height:19px;padding:0 5px;
  border-radius:99px;background:var(--danger);color:#fff;font-size:11px;font-weight:800}
.tab.on i{background:#fff;color:var(--t1)}
.lt{display:inline-flex;align-items:center;justify-content:center;min-width:30px;padding:2px 7px;border-radius:8px;
  font-weight:800;font-size:12px;background:var(--t1-soft);color:var(--t1)}
.lt.LA{background:var(--ok-soft);color:var(--ok)}
.lt.LB{background:var(--t2-soft);color:var(--t2)}
.lt.LC{background:var(--t3-soft);color:var(--t3)}
.lt.LD{background:var(--warn-soft);color:var(--warn)}
.lt.LE,.lt.LF{background:var(--danger-soft);color:var(--danger)}
.rapor{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:8px}
.rapor .big{display:flex;align-items:center;gap:11px;padding:14px 20px;border-radius:16px;background:var(--t1-soft)}
.rapor .big b{font-size:36px;line-height:1;color:var(--t1)}
.rapor .big .lt{font-size:16px;min-width:42px;padding:5px 10px}
.rapor .side{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px;flex:1 1 240px}
.rapor .side div{display:flex;flex-direction:column}
.rapor .side small{font-size:11px;color:var(--muted)}.rapor .side b{font-size:15px}
.jenis{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:9px}
.jen{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:var(--surface-2)}
.jen small{font-size:11px;color:var(--muted)}.jen b{font-size:18px;line-height:1.15}
.jen i{font-style:normal;font-size:10.5px;color:var(--muted)}.jen .lt{align-self:flex-start}
.nilai{display:grid;gap:8px}
.nrow{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.nrow .t{font-size:13.5px;font-weight:600}
.nrow .s{font-size:11.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nval{display:flex;align-items:center;gap:7px}.nval b{font-size:17px}
.nval i{font-style:normal;font-size:11px;color:var(--muted)}
.grp-box{margin-top:11px;padding:12px;border-radius:13px;border:1px solid var(--t1);background:var(--t1-soft)}
.grp-box>label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px;margin-top:0}
.mem{display:flex;flex-wrap:wrap;gap:7px;max-height:210px;overflow:auto;padding:2px}
.memb{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:8px 13px;border-radius:99px;
  border:1px solid var(--line);background:var(--surface);font-size:12.5px;cursor:pointer;margin:0;font-weight:400;color:var(--ink)}
.memb input{accent-color:var(--t1);width:16px;height:16px}
.memb.on{border-color:var(--t1);font-weight:700}
.badge.grp{background:var(--t1-soft);color:var(--t1)}
.tps{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}

/* --- v19: rekap siswa --- */
.rp-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.rp-tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
  font-weight:800;padding:6px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
.rp-tbl td{padding:7px;border-bottom:1px solid var(--line)}
.rp-tbl tr:last-child td{border-bottom:0}
.rp-tbl .r{text-align:right;white-space:nowrap}
.rp-tbl .hasil{background:var(--t1-soft)}
.rp-tbl .hasil td{font-weight:800;color:var(--t1)}
.bandbar{display:grid;gap:7px;margin-top:10px}
.bb{display:flex;align-items:center;gap:9px;font-size:12.5px}
.bb .nm2{flex:0 0 96px;color:var(--muted);font-size:11.5px}
.bb .tr{flex:1;height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bb .tr i{display:block;height:100%;border-radius:999px;background:var(--t1)}
.bb.kelas .tr i{background:color-mix(in srgb,var(--muted) 55%,transparent)}
.bb .vl{flex:0 0 42px;text-align:right;font-weight:800}
.tren{display:flex;align-items:flex-end;gap:7px;height:92px;margin-top:10px;padding:0 2px}
.tb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.tb .bar2{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--t1);min-height:4px}
.tb small{font-size:9.5px;color:var(--muted);white-space:nowrap}
.tb b{font-size:11px;font-weight:800}
.todo{display:grid;gap:8px}
.td{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface-2);
  border-left:3px solid var(--t1)}
.td.late{border-left-color:var(--danger);background:var(--danger-soft)}
.td.soon{border-left-color:var(--warn);background:var(--warn-soft)}
.td .t{font-weight:700;font-size:13.5px}
.td .s{font-size:11.5px;color:var(--muted)}
.jd{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;background:var(--surface-2);margin-bottom:7px}
.jd .d{flex:0 0 62px;font-weight:800;font-size:12.5px}
.jd .w{font-size:12.5px;color:var(--muted)}
.jd.next{background:var(--t1-soft);color:var(--t1)}
.jd.next .w{color:var(--t1)}
.tp-list{display:grid;gap:7px}
.tpr{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:11px;background:var(--surface-2)}
.tpr .st{flex:0 0 auto;width:20px;height:20px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:800;
  background:var(--line);color:var(--muted);margin-top:1px}
.tpr.ikut .st{background:var(--ok);color:#fff}
.tpr.ajar .st{background:var(--warn-soft);color:var(--warn)}
.tpr .k{font-weight:800;font-size:12px;color:var(--t1)}
.tpr .o{font-size:12.5px;line-height:1.45}
.tpr .u{font-size:11px;color:var(--muted)}
@media(max-width:620px){.rapor .big{width:100%;justify-content:center}.bb .nm2{flex:0 0 72px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <svg class="logo" width="42" height="42" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <defs><linearGradient id="g" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
        <stop stop-color="#4A57B8"/><stop offset=".5" stop-color="#46756A"/><stop offset="1" stop-color="#D9BC63"/></linearGradient></defs>
      <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#g)"/>
      <rect x="13" y="34" width="9" height="17" rx="4.5" fill="#fff" opacity=".72"/>
      <rect x="27.5" y="25" width="9" height="26" rx="4.5" fill="#fff" opacity=".88"/>
      <rect x="42" y="16" width="9" height="35" rx="4.5" fill="#fff"/>
      <circle cx="46.5" cy="10" r="5.5" fill="#fff"/><circle cx="46.5" cy="10" r="2.4" fill="url(#g)"/>
    </svg>
    <div><h1>Rekap Belajarku</h1>
      <p>SMAIT Al-Ittihad — absen, tugas, nilai, dan materi dalam satu halaman</p></div>
  </div>
  <div id="body"><div class="empty">Memuat…</div></div>
  <footer>My Productivity Hub — portal siswa</footer>
</div>

<script>
/* ===== URL Web App Apps Script milik guru ===== */
const API = 'https://script.google.com/macros/s/AKfycbzWcLKC82ZjHoOFPJSVZ-kAOA4Ry_0A7yyEk6ANBMg-Cn96__N2mwu5d1fMmLtdPHc1/exec';

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const pad = (n) => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const parseISO = (s) => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const fmtFull = (s) => { const d = parseISO(s); return d ? `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}` : '—'; };
const fmtShort = (s) => { const d = parseISO(s); return d ? `${d.getDate()}/${d.getMonth() + 1}` : '—'; };
const fmtDate = (s) => { const d = parseISO(s); return d ? `${d.getDate()} ${BULAN[d.getMonth()].slice(0, 3)} ${d.getFullYear()}` : '—'; };
const fmtBulan = (s) => { const m = String(s || '').match(/^(\d{4})-(\d{2})$/); return m ? `${BULAN[+m[2] - 1].slice(0, 3)} ${m[1].slice(2)}` : '—'; };
const selisihHari = (a, b) => { const x = parseISO(a), y = parseISO(b); return (x && y) ? Math.round((y - x) / 86400000) : null; };
const num = (v) => (v === '' || v == null || isNaN(Number(v)) ? null : Number(v));
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
};

function toast(msg, kind = '', ms = 4500) {
  const old = $('.toast'); if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

/** Permintaan ke Apps Script. Content-Type text/plain agar tidak kena preflight CORS. */
async function call(action, payload = {}, tries = 3) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const ctrl = new AbortController();
      const to = setTimeout(() => ctrl.abort(), 30000);
      const res = await fetch(API, {
        method: 'POST', signal: ctrl.signal,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action }, payload))
      });
      clearTimeout(to);
      const j = await res.json();
      if (!j.ok) { const err = new Error(j.error || 'Permintaan gagal.'); err.final = true; throw err; }
      return j;
    } catch (e) {
      lastErr = e;
      // server sudah menjawab tegas (nama tidak terdaftar, tautan salah, dll):
      // mengulanginya hanya memperlambat dan bisa menggandakan data
      if (e && e.final) break;
      if (i < tries - 1) await new Promise((r) => setTimeout(r, 700 * (i + 1)));
    }
  }
  throw lastErr;
}

/* ----------------------------- bantu ------------------------------- */

function letterOf(n, sc) {
  if (n == null || n === '' || isNaN(Number(n))) return '';
  const list = (sc || []).slice().sort((a, b) => b.min - a.min);
  const v = Number(n);
  for (let i = 0; i < list.length; i++) if (v >= list[i].min) return list[i].l;
  return '';
}
function lclass(l) { return 'L' + String(l || '').replace(/[^A-Za-z]/g, ''); }
function inisial(nm) {
  return String(nm || '').trim().split(/\s+/).slice(0, 2).map((x) => x[0] || '').join('').toUpperCase() || '?';
}
/** Rapor PTS yang sedang dilihat (kalau siswa punya lebih dari satu mapel). */
function rpAktif() {
  const list = (S.recap && S.recap.raporPts) || [];
  if (!list.length) return null;
  return list[Math.min(S_TAB.mapel, list.length - 1)] || list[0];
}
function hitungAbsen(absen) {
  const c = { Hadir: 0, Izin: 0, Sakit: 0, Alpa: 0 };
  (absen || []).forEach((a) => { if (c[a.status] != null) c[a.status]++; });
  return c;
}
/** Tugas yang masih harus dikerjakan, sudah diurut dari yang paling mendesak. */
function tugasBelum(r) {
  const sudah = {};
  (r.tugas || []).forEach((x) => { if (x.submitted) sudah[x.id] = 1; });
  return (S.tasks || []).filter((t) => !sudah[t.id])
    .map((t) => Object.assign({}, t, { sisa: t.dueDate ? selisihHari(todayISO(), t.dueDate) : null }))
    .sort((a, b) => {
      const sa = a.sisa === null ? 9999 : a.sisa, sb = b.sisa === null ? 9999 : b.sisa;
      return sa - sb;
    });
}
/** Hari jadwal berikutnya dari hari ini, dipakai untuk menandai baris jadwal.
 *  Server mengirim dayNo 1–7 (Senin–Minggu); nama hari dipakai sebagai cadangan. */
function jadwalBerikut(jadwal) {
  if (!(jadwal || []).length) return -1;
  const hariIni = new Date().getDay();            // 0 = Minggu
  const idx = (j) => {
    const n = Number(j.dayNo);
    if (isFinite(n) && n >= 1 && n <= 7) return n === 7 ? 0 : n;
    const s = String(j.day || '').trim().toLowerCase();
    const id = HARI.findIndex((h) => h.toLowerCase() === s);
    if (id >= 0) return id;
    return ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'].indexOf(s);
  };
  let best = -1, bestJarak = 99;
  jadwal.forEach((j, i) => {
    const d = idx(j);
    if (d < 0) return;
    const jarak = (d - hariIni + 7) % 7;
    if (jarak < bestJarak) { bestJarak = jarak; best = i; }
  });
  return best;
}

    ${(r.tren || []).length > 1 ? `<div class="card"><h2>Perkembangan nilaiku</h2>
      <p class="mini">Rata-rata seluruh nilai per bulan, pada skala 100.</p>

/* --- 2. ABSEN ------------------------------------------------------- */

function paneAbsen(r) {
  const rk = r.ringkas || {};
  const today = todayISO();
  const ab = (r.absen || []).filter((a) => a.date === today)[0] || null;
  const c = hitungAbsen(r.absen);
  const tp = r.tp || { diikuti: [], semua: [] };
  // rekap per bulan supaya siswa tahu bulan mana kehadirannya turun
  const perBulan = {};
  (r.absen || []).forEach((a) => {
    const b = String(a.date || '').slice(0, 7);
    if (!/^\d{4}-\d{2}$/.test(b)) return;
    perBulan[b] = perBulan[b] || { n: 0, hadir: 0 };
    perBulan[b].n++;
    if (a.status === 'Hadir') perBulan[b].hadir++;
  });
  const bulanList = Object.keys(perBulan).sort().reverse();
  return `
    <div class="card"><h2>Absen hari ini</h2>
      <p class="mini">${fmtFull(today)}</p>
      ${ab ? `<div class="note ok">Sudah absen hari ini: <b>${esc(ab.status)}</b>${ab.at ? ` — pukul ${esc(String(ab.at).slice(11, 16))}` : ''}.<br><span class="mini">Masih bisa diubah bila keliru.</span></div>` : ''}
      <div class="abs-row">${ABSEN.map(([k, cl]) => `<button class="ab ${cl} ${ab && ab.status === k ? 'on' : ''}" data-abs="${k}">${k}</button>`).join('')}</div>
    </div>

    <div class="card"><h2>Rekap kehadiranku</h2>
      <div class="sum">
        <div><small>Hadir</small><b class="pos">${c.Hadir}</b></div>
        <div><small>Izin</small><b>${c.Izin}</b></div>
        <div><small>Sakit</small><b>${c.Sakit}</b></div>
        <div><small>Alpa</small><b class="${c.Alpa ? 'neg' : ''}">${c.Alpa}</b></div>
      </div>
      <div class="sum mt">
        <div><small>Hari tercatat</small><b>${rk.pertemuan || 0}</b></div>
        <div><small>Kehadiran</small><b>${rk.persen == null ? '—' : rk.persen + '%'}</b></div>
        <div><small>Pelajaran berlangsung</small><b>${rk.pelajaran || 0}</b></div>
        <div><small>Kamu hadir</small><b>${rk.hadirDiPelajaran || 0}</b></div>
      </div>
      ${bulanList.length ? `<h3>Per bulan</h3>
        <ul class="list">${bulanList.map((b) => {
          const x = perBulan[b];
          return `<li><div class="grow"><div class="t">${fmtBulan(b)}</div>
            <div class="s">${x.hadir} hadir dari ${x.n} hari tercatat</div></div>
            <span class="badge ${x.hadir === x.n ? 'ok' : (x.hadir / x.n >= 0.8 ? '' : 'warn')}">${Math.round(x.hadir / x.n * 100)}%</span></li>`;
        }).join('')}</ul>` : ''}
      <h3>Riwayat absen</h3>
      ${(r.absen || []).length ? `<div class="hist">${(r.absen || []).slice(0, 60).map((a) => `<span class="h ${String(a.status).toLowerCase()}" title="${fmtFull(a.date)} — ${esc(a.status)}">${fmtShort(a.date)}</span>`).join('')}</div>`
      : '<p class="mini">Belum ada catatan absen.</p>'}
      ${(tp.diikuti || []).length ? `<h3>TP yang sudah kamu ikuti</h3><div class="tps">${tp.diikuti.map((x) => `<span class="badge b1">${esc(x)}</span>`).join(' ')}</div>` : ''}

  const dinilai = sudah.filter((t) => t.score !== '' && t.score != null);
  return `

      <div class="sum">
        <div><small>Semua tugas</small><b>${(r.tugas || []).length}</b></div>
        <div><small>Terkumpul</small><b class="pos">${sudah.length}</b></div>
        <div><small>Sudah dinilai</small><b>${dinilai.length}</b></div>
        <div><small>Belum</small><b class="${open.length ? 'neg' : ''}">${open.length}</b></div>
      </div>
    </div>
    <div class="card"><h2>Belum dikerjakan <span class="badge ${open.length ? 'danger' : 'ok'}">${open.length}</span></h2>
      ${open.length ? open.map((t) => taskCard(t)).join('') : '<div class="empty">Semua tugas sudah dikumpulkan</div>'}</div>
    <div class="card"><h2>Sudah dikumpulkan <span class="badge">${sudah.length}</span></h2>
      ${sudah.length ? `<ul class="list">${sudah.map((t) => `<li>
          <div class="grow"><div class="t">${esc(t.title)}${t.groupName ? ` <span class="badge grp">${esc(t.groupName)}</span>` : ''}</div>
            <div class="s">${esc([t.submittedAt ? 'dikumpulkan ' + fmtDate(String(t.submittedAt).slice(0, 10)) : '', t.late ? 'terlambat' : '', t.members ? 'bersama ' + t.members : '', t.feedback ? 'catatan guru: ' + t.feedback : ''].filter(Boolean).join(' · '))}</div></div>
          ${(t.score !== '' && t.score != null) ? `<span class="badge ok">${esc(String(t.score))}${Number(t.maxScore) && Number(t.maxScore) !== 100 ? '/' + esc(String(t.maxScore)) : ''}${t.letter ? ' · ' + esc(t.letter) : ''}</span>` : '<span class="badge">menunggu nilai</span>'}</li>`).join('')}</ul>`
      : '<p class="mini">Belum ada tugas yang kamu kumpulkan.</p>'}</div>`;
}

function taskCard(t) {
  const grup = String(t.mode || '') === 'kelompok';
  const dipilih = S_TAB.pick[t.id] || [];
  const teman = (S.names || []).filter((n) => n.toLowerCase() !== String(S.name).toLowerCase());
  const ket = t.sisa === null ? '' : (t.sisa < 0 ? `lewat ${-t.sisa} hari` : (t.sisa === 0 ? 'hari ini' : `${t.sisa} hari lagi`));
  return `<div class="task">
    <div class="t">${esc(t.title)}${grup ? ' <span class="badge grp">Tugas kelompok</span>' : ''}
      ${ket ? `<span class="badge ${t.sisa < 0 ? 'danger' : (t.sisa <= 3 ? 'warn' : '')}">${esc(ket)}</span>` : ''}</div>
    <div class="s">${esc([t.subject, t.type, t.tpCode ? 'TP ' + t.tpCode : ''].filter(Boolean).join(' · '))}${t.dueDate ? ` · batas ${fmtDate(t.dueDate)}` : ''}${Number(t.maxScore) ? ` · nilai maksimal ${esc(String(t.maxScore))}` : ''}</div>
    ${t.instruction ? `<p class="mini" style="white-space:pre-wrap">${esc(t.instruction)}</p>` : ''}
    ${t.link ? `<div class="lk-chips"><a class="lk-chip" href="${esc(t.link)}" target="_blank" rel="noopener">Bahan tugas</a></div>` : ''}
    ${grup ? `<div class="grp-box">
        <label>Anggota kelompok <span class="mini">(namamu sudah otomatis ikut)</span></label>
        ${t.groupMin || t.groupMax ? `<p class="mini">Anggota ${t.groupMin ? 'minimal ' + t.groupMin : ''}${t.groupMin && t.groupMax ? ', ' : ''}${t.groupMax ? 'maksimal ' + t.groupMax : ''} orang (termasuk kamu).</p>` : ''}
        <input class="input gname" data-task="${esc(t.id)}" placeholder="Nama kelompok (opsional)">
        <div class="mem mt">${teman.map((n) => `<label class="memb ${dipilih.includes(n) ? 'on' : ''}">
          <input type="checkbox" value="${esc(n)}" data-mem="${esc(t.id)}" ${dipilih.includes(n) ? 'checked' : ''}> ${esc(n)}</label>`).join('')}</div>
        <p class="mini">Terpilih: <b data-count="${esc(t.id)}">${dipilih.length + 1}</b> orang. Satu nilai berlaku untuk seluruh anggota.</p>
      </div>` : ''}
    <label>Tautan pekerjaan (Drive/Docs) — opsional</label>
    <input class="input lnk" data-task="${esc(t.id)}" placeholder="https://…">
    <label>Jawaban / keterangan</label>
    <textarea class="input txt" data-task="${esc(t.id)}" rows="3" placeholder="Tulis jawaban atau keterangan singkat"></textarea>
    <button class="btn primary mt" data-send="${esc(t.id)}">Kumpulkan${grup ? ' untuk kelompok' : ''}</button>
  </div>`;
}

/* --- 4. NILAI ------------------------------------------------------- */

function paneNilai(r) {
  const rp = rpAktif();
  const flat = r.rapor || {};
  const nilai = r.nilai || [];
  const luar = nilai.filter((n) => n.luar).length;
  const SUM = { daftarnilai: 'Daftar nilai', scorelist: 'Score List', tugas: 'Tugas', excel: 'Unggahan guru', ledger: 'Ledger', beku: 'Arsip' };
  // kelompokkan per jenis penilaian supaya mudah dibaca
  const grup = {};
  nilai.forEach((n) => {
    const k = n.assessType || 'Lainnya';
    grup[k] = grup[k] || [];
    grup[k].push(n);
  });
  const jenisUrut = Object.keys(grup).sort();
  return `
    ${rp ? kartuRapor(rp, r, false) : `<div class="card"><h2>Rapor PTS</h2>
      <div class="empty">Belum ada nilai UH, nilai harian, atau PTS untuk kelas ini.</div></div>`}

    <div class="card"><h2>Rata-rata seluruh nilai</h2>
      <p class="mini">Berbeda dari rapor PTS: ini rata-rata sederhana dari <b>semua</b> butir nilaimu pada skala 100,
        termasuk tugas harian yang tidak masuk komponen rapor.</p>
      <div class="rapor">
        <div class="big"><b>${flat.rata == null ? '—' : esc(String(flat.rata))}</b><span class="lt ${lclass(flat.huruf)}">${esc(flat.huruf || '—')}</span></div>
        <div class="side">
          <div><small>Butir nilai</small><b>${flat.butir || 0}</b></div>
          <div><small>KKM</small><b>${esc(String(flat.kkm || 75))}</b></div>
          <div><small>Status</small><b class="${flat.tuntas ? 'pos' : flat.tuntas === false ? 'neg' : ''}">${flat.tuntas == null ? '—' : (flat.tuntas ? 'Tuntas' : 'Belum tuntas')}</b></div>
        </div>
      </div>
      ${(flat.perJenis || []).length ? `<h3>Per jenis penilaian</h3>
        <div class="jenis">${flat.perJenis.map((j) => `<div class="jen"><small>${esc(j.type)}</small><b>${esc(String(j.rata))}</b>
          <span class="lt ${lclass(j.huruf)}">${esc(j.huruf)}</span><i>${j.n} butir</i></div>`).join('')}</div>` : ''}
    </div>

    ${luar ? `<div class="note warn">${luar} nilai tercatat di luar rentang 0–100 dan sudah dibatasi supaya hitungannya tetap masuk akal.
      Kalau terasa keliru, tanyakan ke gurumu.</div>` : ''}

    <div class="card"><h2>Seluruh nilaiku <span class="badge">${nilai.length}</span></h2>
      ${nilai.length ? jenisUrut.map((k) => `<h3>${esc(k)} <span class="badge">${grup[k].length}</span></h3>
        <div class="nilai">${grup[k].map((n) => `<div class="nrow">
          <div class="grow"><div class="t">${esc(n.title || n.component || 'Penilaian')}</div>
            <div class="s">${esc([n.component, n.tpCode ? 'TP ' + n.tpCode : '', n.date ? fmtDate(n.date) : ''].filter(Boolean).join(' · '))}
              <span class="badge">${esc(SUM[n.source] || n.source || '')}</span>${n.luar ? '<span class="badge warn">di luar rentang</span>' : ''}</div></div>
          <div class="nval"><b>${esc(String(n.scale100))}</b><span class="lt ${lclass(n.letter || letterOf(n.scale100, flat.skala))}">${esc(n.letter || letterOf(n.scale100, flat.skala))}</span>
            ${Number(n.maxScore) !== 100 ? `<i>${esc(String(n.score))}/${esc(String(n.maxScore))}</i>` : ''}</div></div>`).join('')}</div>`).join('')
      : '<div class="empty">Nilaimu akan muncul di sini begitu guru memasukkannya.</div>'}</div>`;
}

/* --- 5. MATERI & TP ------------------------------------------------- */

function paneBelajar(r) {
  const list = (r.pelajaran || []).slice().sort((a, b) => {
    const pa = (a.status === 'Terlaksana' || a.lewat) ? 0 : 1;
    const pb = (b.status === 'Terlaksana' || b.lewat) ? 0 : 1;
    return pa - pb || String(b.date).localeCompare(String(a.date));
  });
  const tpr = r.tpRinci || [];
  const ikut = tpr.filter((t) => t.diikuti).length;
  const ajar = tpr.filter((t) => t.diajarkan).length;
  return `
    ${tpr.length ? `<div class="card"><h2>Tujuan pembelajaran <span class="badge">${ikut}/${tpr.length}</span></h2>
      <p class="mini">Centang hijau berarti kamu hadir saat TP itu diajarkan. Kuning berarti sudah diajarkan,
        tetapi kamu tidak tercatat hadir — sebaiknya kejar materinya.</p>
      <div class="sum mt">
        <div><small>Sudah diajarkan</small><b>${ajar}</b></div>
        <div><small>Kamu ikuti</small><b class="pos">${ikut}</b></div>
        <div><small>Terlewat</small><b class="${ajar - ikut ? 'neg' : ''}">${ajar - ikut}</b></div>
        <div><small>Belum diajarkan</small><b>${tpr.length - ajar}</b></div>
      </div>
      <div class="tp-list mt">${tpr.map((t) => `<div class="tpr ${t.diikuti ? 'ikut' : (t.diajarkan ? 'ajar' : '')}">
        <div class="st">${t.diikuti ? '✓' : (t.diajarkan ? '!' : '')}</div>
        <div class="grow"><div class="k">${esc(t.code)}${t.unit ? ` <span class="u">· ${esc(t.unit)}</span>` : ''}</div>
          ${t.objective ? `<div class="o">${esc(t.objective)}</div>` : ''}
          ${t.skill || t.detail ? `<div class="u">${esc([t.skill, t.detail].filter(Boolean).join(' — '))}</div>` : ''}</div></div>`).join('')}</div>
    </div>` : ''}

    <div class="card"><h2>Pembelajaran yang sudah berlangsung
        <span class="badge">${list.filter((m) => m.status === 'Terlaksana').length}</span></h2>
      <p class="mini">Materi, slide, dan catatan tiap pertemuan — beserta kehadiranmu hari itu.</p>
      ${list.length ? list.slice(0, 40).map((m) => {
        const a = m.hadir ? `<span class="h ${String(m.hadir).toLowerCase()}">${esc(m.hadir)}</span>`
          : (m.status === 'Terlaksana' && m.lewat ? '<span class="h x">tidak tercatat</span>' : '');
        return `<div class="les ${m.status === 'Terlaksana' ? '' : 'soon'}">
          <div class="les-h"><b>Pertemuan ${esc(String(m.no || '—'))}</b><span class="mini">${fmtFull(m.date)}${m.start ? ' · ' + esc(m.start) + (m.end ? '–' + esc(m.end) : '') : ''}</span>
            ${m.status === 'Terlaksana' ? a : `<span class="badge">${esc(m.status)}</span>`}</div>
          ${m.tpCodes ? `<div class="tps">${String(m.tpCodes).split(',').map((c) => `<span class="badge b1">${esc(c.trim())}</span>`).join(' ')}</div>` : ''}
          ${m.topic ? `<div class="les-t">${esc(m.topic)}</div>` : ''}
          ${m.material ? `<div class="les-m">${esc(m.material)}</div>` : ''}
          ${(m.links || []).length ? `<div class="lk-chips">${m.links.map((l) => `<a class="lk-chip" href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t || 'Buka materi')}</a>`).join('')}</div>` : ''}
          ${m.taskTitle ? `<div class="mini">Penugasan: ${esc(m.taskTitle)}</div>` : ''}
        </div>`;
      }).join('') : '<div class="empty">Belum ada pembelajaran tercatat</div>'}
    </div>`;
}

/* ---------------------------- interaksi ---------------------------- */

document.addEventListener('click', async (e) => {
  const tb = e.target.closest('[data-tab]');
  if (tb) { S_TAB.cur = tb.dataset.tab; home(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }

  const mp = e.target.closest('[data-mapel]');
  if (mp) { S_TAB.mapel = Number(mp.dataset.mapel) || 0; return home(); }

  const mem = e.target.closest('[data-mem]');
  if (mem) {
    const id = mem.dataset.mem;
    const list = S_TAB.pick[id] || (S_TAB.pick[id] = []);
    const i = list.indexOf(mem.value);
    if (mem.checked) { if (i < 0) list.push(mem.value); } else if (i >= 0) list.splice(i, 1);
    mem.closest('.memb').classList.toggle('on', mem.checked);
    const c = document.querySelector(`[data-count="${id}"]`);
    if (c) c.textContent = String(list.length + 1);
    return;
  }

  const cls = e.target.closest('[data-cls]');
  if (cls) return openClass(cls.dataset.cls, '');
  const nm = e.target.closest('[data-name]');
  if (nm) return openName(nm.dataset.name);
  const bk = e.target.closest('[data-back]');
  if (bk) { S.q = ''; return bk.dataset.back === 'cls' ? pickClass() : pickName(''); }

  const ab = e.target.closest('[data-abs]');
  if (ab) {
    document.querySelectorAll('[data-abs]').forEach((x) => { x.disabled = true; });
    try {
      const j = await call('studentAbsen', { className: S.cls, studentName: S.name, status: ab.dataset.abs });
      toast(j.updated ? `Absen diperbarui: ${ab.dataset.abs}.` : `Absen tercatat: ${ab.dataset.abs}. Terima kasih!`, 'ok');
      await reload();
    } catch (err) {
      toast(err.message, 'err', 7000);
      document.querySelectorAll('[data-abs]').forEach((x) => { x.disabled = false; });
    }
    return;
  }

  const send = e.target.closest('[data-send]');
  if (send) {
    const id = send.dataset.send;
    const link = ($(`.lnk[data-task="${id}"]`) || {}).value || '';
    const text = ($(`.txt[data-task="${id}"]`) || {}).value || '';
    if (!String(text).trim() && !String(link).trim()) return toast('Isi jawaban atau tautan pekerjaanmu dulu.', 'err');
    const members = S_TAB.pick[id] || [];
    const groupName = ($(`.gname[data-task="${id}"]`) || {}).value || '';
    const task = (S.tasks || []).filter((t) => t.id === id)[0] || {};
    if (String(task.mode || '') === 'kelompok') {
      const n = members.length + 1;
      const mn = Number(task.groupMin) || 0, mx = Number(task.groupMax) || 0;
      if (mn && n < mn) return toast(`Kelompok harus berisi minimal ${mn} orang — baru ${n}.`, 'err', 6000);
      if (mx && n > mx) return toast(`Kelompok paling banyak ${mx} orang — sekarang ${n}.`, 'err', 6000);
    }
    const label = send.textContent;
    send.disabled = true; send.textContent = 'Mengirim…';
    try {
      const j = await call('studentSubmit', { taskId: id, studentName: S.name, link, content: text, members, groupName });
      const lepas = (j.released || []);
      toast(j.group ? `Tugas terkumpul untuk ${j.members.length} anggota kelompok. Terima kasih!` : 'Tugas terkumpul. Terima kasih!', 'ok', 6000);
      // bila kelompok dibetulkan, beri tahu siapa yang dikeluarkan supaya tidak ada salah paham
      if (lepas.length) setTimeout(() => toast(`Dikeluarkan dari kelompok: ${lepas.join(', ')}. Mereka perlu mengumpulkan sendiri.`, 'warn', 9000), 6200);
      delete S_TAB.pick[id];
      await reload();
    } catch (err) { toast(err.message, 'err', 7000); send.disabled = false; send.textContent = label; }
  }
});

boot();
</script>
</body>
</html>
