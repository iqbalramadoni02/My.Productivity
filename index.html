const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#888';
function mkChart(id, config) {
  const el = document.getElementById(id);
  if (!el || typeof Chart === 'undefined') {
    if (el && el.parentElement) el.parentElement.innerHTML = '<div class="note">Grafik tidak dapat dimuat (library Chart.js belum tersedia / offline).</div>';
    return null;
  }
  Chart.defaults.font.family = cssVar('--font').replace(/'/g, '') || 'sans-serif';
  Chart.defaults.color = cssVar('--muted');
  Chart.defaults.borderColor = cssVar('--line');
  const c = new Chart(el, Object.assign({ options: {} }, config));
  App.charts.push(c);
  return c;
}
const PALETTE = () => ['--jade', '--violet', '--sky', '--amber', '--coral', '--rose', '--brand', '--slate'].map(cssVar);

function monthCal(mk, events, { dayAct = '', mod = '' } = {}) {
  const [y, m] = mk.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const startOffset = (first.getDay() + 6) % 7; // Senin = 0
  const start = ymd(new Date(y, m - 1, 1 - startOffset));
  const t = todayISO();
  const byDate = groupBy(events, (e) => e.date);
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i);
    if (i >= 35 && monthKey(d) !== mk) break;
    const evs = byDate[d] || [];
    cells += `<div class="dc ${monthKey(d) !== mk ? 'out' : ''} ${d === t ? 'today' : ''}" ${dayAct ? `data-act="${dayAct}" data-date="${d}" data-mod="${mod}"` : ''}>
      <span class="dn">${parseISO(d).getDate()}</span>
      ${evs.slice(0, 3).map((e) => `<span class="ev" style="background:var(--${e.color}-soft);color:var(--${e.color})" data-act="calEv" data-sheet="${e.sheet}" data-id="${e.id}" title="${esc(e.title)}">${e.time ? esc(e.time) + ' ' : ''}${esc(e.title)}</span>`).join('')}
      ${evs.length > 3 ? `<span class="mini muted">+${evs.length - 3} lagi</span>` : ''}</div>`;
  }
  return `<div class="cal">${['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].map((d) => `<div class="dh">${d}</div>`).join('')}${cells}</div>`;
}

ACT.calEv = (d, el, e) => {

  const map = {
    Agenda: () => School.agendaForm(d.id), Assignments: () => School.assignForm(d.id),

    TutorSessions: () => Tutor.sessionForm(d.id),
    LoanInstallments: () => App.open('finance', 'pinjaman')
  };
  (map[d.sheet] || (() => { }))();
};

/* ---- viewer sheet Excel (hanya-baca) ---- */
const SheetView = {
  cache: {},
  render(group, key) {
    const s = App.s(key);
    const sheets = (Store.meta.sheets || []).filter((x) => x.group === group);
    if (!Store.isRemote()) return UI.empty('Perlu koneksi Google Sheets', 'Lembar Excel hanya bisa ditampilkan saat aplikasi terhubung ke spreadsheet.');
    if (!sheets.length) return UI.empty('Tidak ada lembar', 'Sheet dari file Excel belum ditemukan di spreadsheet ini.');
    if (!s.sheet || !sheets.some((x) => x.name === s.sheet)) s.sheet = sheets[0].name;
    const data = this.cache[s.sheet];
    const url = (Store.services.spreadsheetUrl || Store.meta.spreadsheetUrl || '') + '#gid=' + (sheets.find((x) => x.name === s.sheet) || {}).gid;
    return `<div class="toolbar">
        <select class="select" data-chg="svSheet" data-key="${key}">${sheets.map((x) => `<option ${x.name === s.sheet ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
        <a class="btn sm" href="${esc(url)}" target="_blank" rel="noopener">${ic('table')}Buka di Google Sheets</a>
        <span class="mini muted">Tampilan hanya-baca. Semua rumus, format, dan grafik tetap hidup di spreadsheet.</span>
      </div>
      <div id="sv-box">${data ? this.table(data) : '<div class="note">Memuat lembar…</div>'}</div>`;
  },
  table(d) {
    if (!d.values || !d.values.length) return UI.empty('Lembar kosong');
    const head = d.values[0] || [];
    return `<div class="table-wrap" style="max-height:70vh;overflow:auto"><table class="tbl">
      <tbody>${d.values.map((r, i) => `<tr>${r.map((c) => `<${i === 0 ? 'th' : 'td'}>${esc(String(c).slice(0, 200))}</${i === 0 ? 'th' : 'td'}>`).join('')}</tr>`).join('')}</tbody></table></div>
      ${d.truncated ? '<p class="mini muted">Ditampilkan 600 baris pertama.</p>' : ''}`;
  },
  async load(key) {
    const s = App.s(key);
    if (!s.sheet || this.cache[s.sheet] || !Store.isRemote()) return;
    try {
      const j = await Api.call('sheetView', { name: s.sheet });
      this.cache[s.sheet] = j;
      const box = $('#sv-box');
      if (box) box.innerHTML = this.table(j);
    } catch (e) {
      const box = $('#sv-box');
      if (box) box.innerHTML = `<div class="note warn">${esc(e.message)}</div>`;
    }
  }
};
CHG.svSheet = (v, el) => { App.s(el.dataset.key).sheet = v; App.refresh(); };

/** Pricelist aktif: dari sheet "Pricelist" (data dasar), bila kosong pakai bawaan. */
function PL() {
  const rows = Store.all('Pricelist').filter((r) => r.active !== false && r.category && r.name).sort((a, b) => (Number(a.no) || 0) - (Number(b.no) || 0));
  if (!rows.length) return PRICELIST_DEFAULT;
  const out = {};
  rows.forEach((r) => { (out[r.category] = out[r.category] || []).push([r.name, +r.normalMin || 0, +r.normalMax || 0, +r.expressMin || 0, +r.expressMax || 0, +r.daysNormal || 0, +r.daysExpress || 0, r.id]); });
  return out;
}
const TASK_TEMPLATES = {
  proposal: [['Bab 1 Pendahuluan', 30], ['Bab 2 Kajian teori', 35], ['Bab 3 Metode', 25], ['Finalisasi & revisi', 10]],
  hasil: [['Olah data (SPSS/SmartPLS)', 35], ['Bab 4 Hasil & pembahasan', 40], ['Bab 5 Penutup', 15], ['Finalisasi & revisi', 10]],
  full: [['Bab 1', 15], ['Bab 2', 20], ['Bab 3', 15], ['Olah data', 15], ['Bab 4', 20], ['Bab 5', 5], ['Finalisasi & revisi', 10]],
  default: [['Pengerjaan draf', 60], ['Review & perbaikan', 30], ['Kirim file final', 10]]
};
const P_STATUS = ['Antrean', 'Dikerjakan', 'Revisi', 'Selesai', 'Batal'];
const P_STATUS_COLOR = { Antrean: 'slate', Dikerjakan: 'violet', Revisi: 'amber', Selesai: 'jade', Batal: 'coral' };

const Project = {
  tasks(p) { try { const t = JSON.parse(p.tasks || '[]'); return Array.isArray(t) ? t : []; } catch (e) { return []; } },
  calcProgress(tasks) { const tw = sum(tasks, (t) => t.w); return tw ? Math.round(sum(tasks.filter((t) => t.d), (t) => t.w) / tw * 100) : 0; },
  template(service) {
    const s = String(service || '').toLowerCase();
    const k = /proposal|bab 1.?3/.test(s) ? 'proposal' : /hasil|bab 4.?5/.test(s) ? 'hasil' : /full|bab 1.?5/.test(s) ? 'full' : 'default';
    return TASK_TEMPLATES[k].map(([t, w]) => ({ t, w, d: false }));
  },
  nextCode() {
    const y = new Date().getFullYear();
    const n = Store.all('Projects').filter((p) => String(p.code).startsWith(`PRJ-${y}`)).length + 1;
    let code = `PRJ-${y}-${String(n).padStart(3, '0')}`;
    let i = n;
    while (Store.all('Projects').some((p) => p.code === code)) { i++; code = `PRJ-${y}-${String(i).padStart(3, '0')}`; }
    return code;
  },
  estimate(cat, pkgName, speed, level) {
    const pkg = (PL()[cat] || []).find((x) => x[0] === pkgName);
    if (!pkg) return null;
    const ex = speed === 'Express';
    const lo = ex ? pkg[3] : pkg[1], hi = ex ? pkg[4] : pkg[2];
    const price = Math.round((lo + (hi - lo) * clamp(level, 0, 100) / 100) / 10000) * 10000;
    return { price, days: ex ? pkg[6] : pkg[5], lo, hi, dp: (cat.startsWith('Skripsi') || cat.startsWith('Tesis')) ? (ex ? 0.65 : 0.5) : 0.5, warranty: ex ? 45 : 30 };
  },
  portalUrl(p) {
    if (EMBEDDED && BOOT.url) return `${BOOT.url}?portal=${encodeURIComponent(p.portalToken)}`;
    const base = location.origin + location.pathname;
    return `${base}?portal=${encodeURIComponent(p.portalToken)}${Config.data.url ? '&api=' + encodeURIComponent(Config.data.url) : ''}`;
  },

  form(id, preset = {}) {
    const r = id ? Store.get('Projects', id) : null;
    const cats = Object.keys(PL());
    const v0 = r || Object.assign({ code: this.nextCode(), category: cats[0], service: (PL()[cats[0]][2] || PL()[cats[0]][0])[0], speed: 'Normal', startDate: todayISO(), status: 'Antrean', level: 50 }, preset);
    const pkgOpts = (cat) => (PL()[cat] || []).map((x) => x[0]);
    const fields = [
      { t: 'section', l: 'Data klien' },
      { k: 'clientName', l: 'Nama klien', req: 1 },
      { k: 'campus', l: 'Kampus / instansi' },
      { k: 'clientEmail', l: 'Email klien', t: 'email', hint: 'Untuk kirim invoice & kwitansi via Gmail' },
      { k: 'clientWa', l: 'WhatsApp', t: 'tel', ph: '08…' },
      { t: 'section', l: 'Layanan & biaya' },
      { k: 'code', l: 'Kode project', req: 1 },
      { k: 'category', l: 'Kategori', t: 'select', o: cats },
      { k: 'service', l: 'Paket / layanan', t: 'select', o: () => pkgOpts(v0.category).concat(pkgOpts(v0.category).includes(v0.service) || !v0.service ? [] : [v0.service]), full: 1 },
      { k: 'speed', l: 'Kecepatan', t: 'select', o: ['Normal', 'Express'] },
      ...(r ? [] : [{ k: 'level', l: 'Tingkat kesulitan (0–100) untuk hitung harga', t: 'number', min: 0, max: 100 }]),
      { k: 'price', l: 'Harga (Rp)', t: 'money', req: 1 },
      { k: 'discount', l: 'Diskon (Rp)', t: 'money', allowZero: 1 },
      { k: 'startDate', l: 'Tanggal mulai', t: 'date', req: 1 },
      { k: 'deadline', l: 'Deadline', t: 'date', req: 1, hint: 'Otomatis dari estimasi hari kerja; boleh diubah.' },
      { k: 'status', l: 'Status', t: 'select', o: P_STATUS },
      ...(r ? [] : [
        { t: 'section', l: 'Pembayaran awal (opsional)' },
        { k: 'dpAmount', l: 'DP diterima sekarang (Rp)', t: 'money', allowZero: 1, hint: 'Langsung tercatat sebagai pemasukan di Personal Finance.' },
        { k: 'dpMethod', l: 'Metode', t: 'select', o: ['Transfer', 'Tunai', 'E-wallet', 'QRIS'] }
      ]),
      { k: 'note', l: 'Catatan (judul, dosen pembimbing, dll.)', t: 'textarea', rows: 2 }
    ];
    const recalc = (v, box, force) => {
      if (r && !force) return;
      const est = this.estimate(v.category, v.service, v.speed, Number(v.level) || 0);
      const info = box.querySelector('#est-info');
      if (!est) { if (info) info.innerHTML = ''; return; }
      if (est.price) UI.setField(box, 'price', est.price);
      UI.setField(box, 'deadline', addWorkDays(v.startDate || todayISO(), est.days));
      if (info) info.innerHTML = est.lo ? `Rentang ${v.speed}: ${idr(est.lo)} – ${idr(est.hi)} — estimasi ${est.days} hari kerja — DP minimal ${Math.round(est.dp * 100)}% (${idr(est.price * est.dp)}) — garansi revisi minor ${est.warranty} hari.` : 'Layanan kustom: isi harga dan deadline secara manual.';
    };
    UI.form({
      title: r ? `Ubah project ${r.code}` : 'Project baru', size: 'wide', values: v0, fields,
      note: '<span id="est-info"></span>',
      extraFoot: r ? `<button class="btn danger left" data-act="projDel" data-id="${r.id}">${ic('trash')}Hapus</button>` : '',
      onMount: (box) => {
        if (!r) recalc(UI.readForm(box, fields), box);

          const sel = box.querySelector('[name="service"]');
          sel.innerHTML = pkgOpts(e.target.value).map((x) => `<option>${esc(x)}</option>`).join('');
          recalc(UI.readForm(box, fields), box, true);
        });
        ['service', 'speed', 'level', 'startDate'].forEach((k) => { const el = box.querySelector(`[name="${k}"]`); if (el) el.addEventListener('change', () => recalc(UI.readForm(box, fields), box, !r || k !== 'startDate')); });
      },
      onSubmit: async (v) => {
        if (v.clientEmail && !validEmail(v.clientEmail)) { UI.toast('Format email klien tidak valid.', 'err'); return false; }
        if (v.deadline < v.startDate) { UI.toast('Deadline tidak boleh sebelum tanggal mulai.', 'err'); return false; }
        if (Store.all('Projects').some((p) => p.code === v.code && (!r || p.id !== r.id))) { UI.toast('Kode project sudah dipakai.', 'err'); return false; }
        const dp = v.dpAmount || 0, method = v.dpMethod;
        delete v.dpAmount; delete v.dpMethod; delete v.level;
        if (dp > this.priceOf(v)) { UI.toast('DP melebihi total harga.', 'err'); return false; }
        if (r) { await Store.update('Projects', r.id, v); return; }
        const tasks = this.template(v.service);
        const row = Object.assign(v, { id: uid(), tasks: JSON.stringify(tasks), progress: 0, portalToken: token(24) });
        const ops = [{ op: 'create', sheet: 'Projects', row }];
        if (dp > 0) ops.push({ op: 'create', sheet: 'Transactions', row: { date: v.startDate, type: 'income', category: 'Fee Project', amount: dp, description: `DP ${v.code} — ${v.clientName} (${v.service})`, source: 'project', refId: row.id, kind: 'DP', method } });
        await Store.commit(ops);
        UI.toast(dp > 0 ? 'Project dibuat & DP tercatat di Personal Finance' : 'Project dibuat', 'ok');
      }
    });
  },
  priceOf(v) { return Math.max(0, (Number(v.price) || 0) - (Number(v.discount) || 0)); },

  detail(id) {
    const p = Store.get('Projects', id);
    if (!p) return UI.toast('Project tidak ditemukan', 'err');
    const tasks = this.tasks(p);
    const pays = Store.where('Transactions', (t) => t.source === 'project' && t.refId === p.id).sort((a, b) => a.date.localeCompare(b.date));
    const total = Fin.projectTotal(p), paid = Fin.projectPaid(p), rem = Fin.projectRemaining(p);
    const files = Store.where('Files', (f) => f.module === 'project' && f.refId === p.id);

    const body = `
      <div class="grid g2" style="grid-template-columns:1.3fr 1fr">
        <div>
          <div class="flex mb"><span class="badge b-${P_STATUS_COLOR[p.status] || 'slate'}">${esc(p.status)}</span><span class="badge">${esc(p.category)}</span><span class="badge ${p.speed === 'Express' ? 'b-amber' : ''}">${esc(p.speed)}</span>${UI.dueBadge(p.deadline, ['Selesai', 'Batal'].includes(p.status) ? p.status : '')}</div>
          <div class="kv mb">
            <div><small>Klien</small><b>${esc(p.clientName)}</b></div><div><small>Kampus / instansi</small><b>${esc(p.campus || '—')}</b></div>
            <div><small>Email</small><b>${esc(p.clientEmail || '—')}</b></div><div><small>WhatsApp</small><b>${esc(p.clientWa || '—')}</b></div>
            <div><small>Mulai</small><b>${fmtDate(p.startDate)}</b></div><div><small>Deadline</small><b>${fmtDate(p.deadline)}</b></div>

          ${UI.progress(p.progress || 0, 'lg')}
          <div class="tasks mt" id="task-list">${tasks.map((t, i) => `<div class="todo ${t.d ? 'done' : ''}"><input type="checkbox" class="check" data-ti="${i}" ${t.d ? 'checked' : ''} aria-label="Selesai"><span class="tx">${esc(t.t)}</span><span class="badge">${t.w}%</span><button class="btn xs ghost" data-tdel="${i}" aria-label="Hapus">${ic('x')}</button></div>`).join('') || '<p class="muted mini">Belum ada tahapan.</p>'}</div>
          <div class="todo-add mt"><input class="input" id="t-new" placeholder="Tahapan baru (mis. Revisi dosen)"><input class="input w-input" id="t-w" type="number" min="1" max="100" value="10" aria-label="Bobot %"><button class="btn sm" id="t-add">${ic('plus')}Tambah</button></div>

            <div class="btn-row mt"><button class="btn sm mod" data-act="projPay" data-id="${p.id}" ${rem <= 0 ? 'disabled' : ''}>${ic('pay')}Catat pembayaran</button><button class="btn sm" data-act="projInvoice" data-id="${p.id}">${ic('file')}Invoice PDF</button><button class="btn sm" data-act="projInvoice" data-id="${p.id}" data-send="1" ${p.clientEmail ? '' : 'disabled'}>${ic('mail')}Kirim invoice</button></div>

        const save = async (list) => {
          const total = sum(list, (t) => t.w) || 1;

    const rem = Fin.projectRemaining(p), paid = Fin.projectPaid(p);
    const st = Store.settings();
    const est = this.estimate(p.category, p.service, p.speed, 50);
    const dpPct = est ? est.dp : 0.5;
    const defKind = paid === 0 ? 'DP' : 'Pelunasan';
    const defAmt = paid === 0 ? Math.min(rem, Math.round(Fin.projectTotal(p) * dpPct / 1000) * 1000) : rem;
    UI.form({
      title: `Catat pembayaran — ${p.clientName}`,
      values: { date: todayISO(), kind: defKind, amount: defAmt, method: 'Transfer', send: st.autoSendReceipt === 'on' && !!p.clientEmail },
      note: `Total ${idr(Fin.projectTotal(p))} — sudah dibayar ${idr(paid)} — sisa <b>${idr(rem)}</b>. Pembayaran otomatis tercatat sebagai pemasukan di Personal Finance.`,
      fields: [
        { k: 'date', l: 'Tanggal', t: 'date', req: 1 },
        { k: 'kind', l: 'Jenis', t: 'select', o: ['DP', 'Termin', 'Pelunasan', 'Biaya revisi mayor'] },
        { k: 'amount', l: 'Jumlah (Rp)', t: 'money', req: 1 },
        { k: 'method', l: 'Metode', t: 'select', o: ['Transfer', 'Tunai', 'E-wallet', 'QRIS'] },
        { k: 'send', l: p.clientEmail ? `Kirim kwitansi PDF ke ${p.clientEmail}` : 'Kirim kwitansi (email klien belum diisi)', t: 'checkbox', full: 1 }
      ],
      onMount: (box) => box.querySelector('[name="kind"]').addEventListener('change', (e) => { if (e.target.value === 'Pelunasan') UI.setField(box, 'amount', rem); }),
      onSubmit: async (v) => {
        if (v.kind !== 'Biaya revisi mayor' && v.amount > rem) { UI.toast(`Jumlah melebihi sisa tagihan (${idr(rem)}).`, 'err'); return false; }
        const row = { id: uid(), date: v.date, type: 'income', category: 'Fee Project', amount: v.amount, description: `${v.kind} ${p.code} — ${p.clientName} (${p.service})`, source: 'project', refId: p.id, kind: v.kind, method: v.method };
        const ops = [{ op: 'create', sheet: 'Transactions', row }];
        if (v.kind === 'Biaya revisi mayor') ops.push({ op: 'update', sheet: 'Projects', id: p.id, row: { price: (Number(p.price) || 0) + v.amount } });
        UI.closeAll();
        await Store.commit(ops);
        UI.toast('Pembayaran tercatat di Personal Finance', 'ok');

      }
    });
  }
};

const T_STATUS_COLOR = { Aktif: 'jade', Jeda: 'amber', Selesai: 'sky', Batal: 'coral' };

const Tutor = {
  sessions(classId) { return Store.where('TutorSessions', (s) => s.classId === classId).sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start) || a.no - b.no); },

  /** Buat jadwal sesi dari hari rutin, mulai tanggal tertentu */
  buildDates(cls, fromDate, count) {
    const days = String(cls.days || '').split(',').map(Number).filter((d) => d >= 1 && d <= 7);
    const out = [];
    if (!days.length || count <= 0) return out;
    let d = fromDate;
    let guard = 0;
    while (out.length < count && guard < 800) {
      const w = parseISO(d).getDay() || 7;
      if (days.includes(w)) out.push(d);
      d = addDays(d, 1); guard++;
    }
    return out;
  },
  sessionTimes(cls) {
    const s = timeToMin(cls.startTime);
    if (s == null) return { start: '', end: '' };
    return { start: minToTime(s), end: minToTime(s + (Number(cls.durationMin) || 60)) };
  },
  genOps(cls, fromNo, fromDate, count) {
    const times = this.sessionTimes(cls);
    return this.buildDates(cls, fromDate, count).map((date, i) => ({ op: 'create', sheet: 'TutorSessions', row: { classId: cls.id, no: fromNo + i, date, start: times.start, end: times.end, status: 'Terjadwal', paid: false } }));
  },

  stats(cls) {
    const ss = this.sessions(cls.id);
    const done = ss.filter((s) => s.status === 'Selesai');
    const live = ss.filter((s) => s.status !== 'Batal');
    const total = Number(cls.totalSessions) || live.length;
    const next = ss.filter((s) => s.status === 'Terjadwal' && s.date >= todayISO())[0] || null;
    const lastPlanned = live.length ? live.map((s) => s.date).sort().pop() : '';
    // prediksi: tempo nyata dari sesi yang sudah selesai; bila belum cukup data pakai jadwal
    let predicted = lastPlanned;
    const remaining = Math.max(0, total - done.length);
    if (done.length >= 2 && remaining > 0) {
      const ds = done.map((s) => s.date).sort();
      const gap = diffDays(ds[0], ds[ds.length - 1]) / (ds.length - 1);
      predicted = addDays(ds[ds.length - 1] > todayISO() ? ds[ds.length - 1] : todayISO(), Math.round(gap * remaining));
    } else if (remaining > 0 && live.length < total) {
      const extra = this.buildDates(cls, addDays(lastPlanned || todayISO(), 1), total - live.length);
      predicted = extra.length ? extra[extra.length - 1] : lastPlanned;
    }
    if (remaining === 0 && done.length) predicted = done.map((s) => s.date).sort().pop();
    return { ss, done: done.length, total, next, predicted, pct: total ? done.length / total * 100 : 0, unpaid: ss.filter((s) => !s.paid && s.status !== 'Batal') };
  },

  form(id) {
    const r = id ? Store.get('TutorClasses', id) : null;
    UI.form({
      title: r ? `Ubah kelas ${r.name}` : 'Kelas bimbel / les baru', size: 'wide',
      values: r || { tutorType: 'IELTS', mode: 'Individu', participants: 1, totalSessions: 12, rateType: 'sesi', durationMin: 90, days: '2,4', startTime: '16:00', startDate: todayISO(), status: 'Aktif' },
      fields: [
        { t: 'section', l: 'Kelas & klien' },
        { k: 'name', l: 'Nama kelas', req: 1, ph: 'mis. IELTS Intensif — Nadia' },
        { k: 'tutorType', l: 'Jenis tutor', list: ['IELTS', 'TOEFL', 'English Conversation', 'English Academic', 'Workshop', 'Olimpiade', 'Lainnya'] },
        { k: 'mode', l: 'Tipe kelas', t: 'select', o: ['Individu', 'Kelompok'] },
        { k: 'participants', l: 'Jumlah peserta', t: 'number', min: 1 },
        { k: 'clientName', l: 'Nama klien / penanggung jawab', req: 1 },
        { k: 'institution', l: 'Lembaga (bila via lembaga)' },
        { k: 'clientEmail', l: 'Email klien', t: 'email', hint: 'Undangan Google Calendar & kwitansi' },
        { k: 'clientWa', l: 'WhatsApp', t: 'tel' },
        { t: 'section', l: 'Jadwal & tarif' },
        { k: 'totalSessions', l: 'Jumlah pertemuan', t: 'number', min: 1, req: 1 },
        { k: 'durationMin', l: 'Durasi per sesi (menit)', t: 'number', min: 15, step: 15 },
        { k: 'days', l: 'Hari rutin', t: 'days', full: 1 },
        { k: 'startTime', l: 'Jam mulai', t: 'time' },
        { k: 'startDate', l: 'Tanggal mulai', t: 'date', req: 1 },
        { k: 'rateType', l: 'Skema tarif', t: 'select', o: [['sesi', 'Per sesi'], ['jam', 'Per jam'], ['paket', 'Paket (total)']] },
        { k: 'rate', l: 'Tarif (Rp)', t: 'money', req: 1 },
        { k: 'status', l: 'Status', t: 'select', o: ['Aktif', 'Jeda', 'Selesai', 'Batal'] },
        { k: 'note', l: 'Catatan / target belajar', t: 'textarea', rows: 2 }
      ],
      note: r ? 'Mengubah hari/jam tidak menggeser sesi yang sudah ada. Gunakan "Susun ulang jadwal" di tab Sesi untuk menjadwalkan ulang sesi yang belum berjalan.' : 'Sesi dibuat otomatis sesuai hari rutin; tanggal selesai diprediksi dari jadwal dan tempo belajar.',
      extraFoot: r ? `<button class="btn danger left" data-act="tutDel" data-id="${r.id}">${ic('trash')}Hapus</button>` : '',
      onChange: (v, box) => {
        const hint = box.querySelector('[data-field="rate"] .hint') || (() => { const h = document.createElement('div'); h.className = 'hint'; box.querySelector('[data-field="rate"]').appendChild(h); return h; })();
        const tmp = Object.assign({}, v);
        hint.textContent = `Total tagihan: ${idr(Fin.tutorTotal(tmp))} — per sesi ${idr(Fin.sessionFee(tmp))}`;
      },
      onSubmit: async (v) => {
        if (v.clientEmail && !validEmail(v.clientEmail)) { UI.toast('Email klien tidak valid.', 'err'); return false; }
        if (!v.days) { UI.toast('Pilih minimal satu hari rutin.', 'err'); return false; }
        v.totalSessions = Math.max(1, Math.round(Number(v.totalSessions) || 1));
        if (r) { await Store.update('TutorClasses', r.id, v); return; }
        const cls = Object.assign({ id: uid() }, v);
        const ops = [{ op: 'create', sheet: 'TutorClasses', row: cls }, ...this.genOps(cls, 1, v.startDate, v.totalSessions)];
        await Store.commit(ops);
        UI.toast(`Kelas dibuat dengan ${ops.length - 1} sesi terjadwal`, 'ok');
        App.s('tutor').classId = cls.id;
      }
    });
  },

  sessionForm(id) {
    const s = Store.get('TutorSessions', id);
    if (!s) return;
    const cls = Store.get('TutorClasses', s.classId) || {};
    UI.form({
      title: `${cls.name || 'Kelas'} — sesi ${s.no}`, values: s,
      fields: [
        { k: 'date', l: 'Tanggal', t: 'date', req: 1 },
        { k: 'status', l: 'Status', t: 'select', o: ['Terjadwal', 'Selesai', 'Batal'] },
        { k: 'start', l: 'Mulai', t: 'time' },
        { k: 'end', l: 'Selesai', t: 'time' },
        { k: 'topic', l: 'Materi / progress log', t: 'textarea', rows: 3, full: 1 },
        { k: 'note', l: 'Catatan (PR, skor latihan, kendala)', t: 'textarea', rows: 2 }
      ],
      extraFoot: `<button class="btn danger left" data-act="delRow" data-sheet="TutorSessions" data-id="${s.id}">${ic('trash')}Hapus</button>`,
      onSubmit: (v) => Store.update('TutorSessions', s.id, v)
    });
  },

  addSession(classId) {
    const cls = Store.get('TutorClasses', classId);
    const ss = this.sessions(classId);
    const t = this.sessionTimes(cls);
    UI.form({
      title: 'Tambah sesi', values: { date: todayISO(), start: t.start, end: t.end },
      fields: [{ k: 'date', l: 'Tanggal', t: 'date', req: 1 }, { k: 'start', l: 'Mulai', t: 'time' }, { k: 'end', l: 'Selesai', t: 'time' }, { k: 'topic', l: 'Materi', full: 1 }],
      onSubmit: (v) => Store.create('TutorSessions', Object.assign(v, { classId, no: (ss.length ? Math.max(...ss.map((x) => x.no)) : 0) + 1, status: 'Terjadwal', paid: false }))
    });
  },

  async reschedule(classId) {
    const cls = Store.get('TutorClasses', classId);
    const ss = this.sessions(classId);
    const done = ss.filter((s) => s.status === 'Selesai');
    const pending = ss.filter((s) => s.status === 'Terjadwal' && !s.paid);
    const keep = ss.filter((s) => s.status !== 'Batal').length - pending.length;
    const count = Math.max(0, (Number(cls.totalSessions) || 0) - keep);
    const from = [todayISO(), addDays(done.map((s) => s.date).sort().pop() || cls.startDate, 1)].sort().pop();
    if (!(await UI.confirm(`${pending.length} sesi terjadwal akan diganti dengan ${count} sesi baru mulai ${fmtDate(from)} mengikuti hari rutin & jam terbaru. Sesi selesai/sudah dibayar tidak diubah.`, { ok: 'Susun ulang' }))) return;
    const maxNo = Math.max(0, ...ss.filter((s) => !pending.includes(s)).map((s) => s.no));
    await Store.commit([...pending.map((s) => ({ op: 'delete', sheet: 'TutorSessions', id: s.id })), ...this.genOps(cls, maxNo + 1, from, count)]);
    UI.toast('Jadwal sesi disusun ulang', 'ok');
  },

  doneForm(id) {
    const s = Store.get('TutorSessions', id);
    UI.form({
      title: `Tandai sesi ${s.no} selesai`, values: { topic: s.topic, note: s.note },
      fields: [{ k: 'topic', l: 'Materi yang dibahas', t: 'textarea', rows: 3, req: 1 }, { k: 'note', l: 'Catatan progres / PR', t: 'textarea', rows: 2 }],
      submit: 'Tandai selesai',
      onSubmit: (v) => Store.update('TutorSessions', s.id, Object.assign(v, { status: 'Selesai' }))
    });
  },

  payForm(classId) {
    const cls = Store.get('TutorClasses', classId);
    const st = this.stats(cls);
    const fee = Fin.sessionFee(cls);
    const rem = Fin.tutorRemaining(cls);
    const unpaid = st.unpaid;
    const isPkg = cls.rateType === 'paket';
    const listHTML = unpaid.length ? unpaid.map((s) => `<label class="checkline" style="padding:4px 0"><input type="checkbox" class="check" data-sid="${s.id}" ${s.status === 'Selesai' ? 'checked' : ''}> Sesi ${s.no} — ${fmtDate(s.date)} <span class="badge ${s.status === 'Selesai' ? 'b-jade' : ''}">${s.status}</span></label>`).join('') : '<p class="muted mini">Semua sesi sudah ditandai dibayar.</p>';
    const autoSend = Store.settings().autoSendReceipt === 'on' && !!cls.clientEmail;
    UI.form({
      title: `Pembayaran — ${cls.name}`,
      note: `Total tagihan ${idr(Fin.tutorTotal(cls))} — sudah dibayar ${idr(Fin.tutorPaid(cls))} — sisa <b>${idr(rem)}</b>. ${isPkg ? 'Skema paket: sesi yang dicentang ditandai lunas.' : `Tarif per sesi ${idr(fee)}.`}`,
      values: { date: todayISO(), method: 'Transfer', amount: isPkg ? rem : unpaid.filter((s) => s.status === 'Selesai').length * fee, send: autoSend },
      fields: [
        { t: 'html', full: 1, html: `<label style="font-size:12.5px;font-weight:700">Sesi yang dibayar</label><div id="pay-sessions" style="max-height:200px;overflow:auto">${listHTML}</div>` },
        { k: 'date', l: 'Tanggal bayar', t: 'date', req: 1 },
        { k: 'method', l: 'Metode', t: 'select', o: ['Transfer', 'Tunai', 'E-wallet', 'QRIS'] },
        { k: 'amount', l: 'Jumlah (Rp)', t: 'money', req: 1 },
        { k: 'send', l: cls.clientEmail ? `Kirim kwitansi ke ${cls.clientEmail}` : 'Kirim kwitansi (email klien kosong)', t: 'checkbox' }
      ],
      onMount: (box) => {
        if (isPkg) return;
        box.querySelector('#pay-sessions').addEventListener('change', () => UI.setField(box, 'amount', $$('#pay-sessions input:checked', box).length * fee));
      },
      onSubmit: async (v, box) => {
        const ids = $$('#pay-sessions input:checked', box).map((i) => i.dataset.sid);
        if (!ids.length && !isPkg) { UI.toast('Centang minimal satu sesi.', 'err'); return false; }
        const row = { id: uid(), date: v.date, type: 'income', category: 'Honor Tutor', amount: v.amount, description: `Honor ${cls.name}${ids.length ? ` — ${ids.length} sesi` : ''} (${cls.clientName})`, source: 'tutor', refId: cls.id, kind: isPkg ? 'Paket' : 'Per sesi', method: v.method, meta: JSON.stringify({ sessionIds: ids }) };
        await Store.commit([{ op: 'create', sheet: 'Transactions', row }, ...ids.map((id) => ({ op: 'update', sheet: 'TutorSessions', id, row: { paid: true } }))]);
        UI.toast('Honor tercatat di Personal Finance', 'ok');
        if (v.send && cls.clientEmail) await Docs.sendReceipt(row.id);
      }
    });
  }
};

      fields: [

        { k: 'date', l: 'Tanggal', t: 'date', req: 1 },
        { k: 'amount', l: 'Jumlah (Rp)', t: 'money', req: 1 },
        { k: 'category', l: 'Kategori', req: 1, list: () => Fin.categories() },
        { k: 'description', l: 'Keterangan', full: 1 },
        { k: 'method', l: 'Metode', t: 'select', o: ['Transfer', 'Tunai', 'E-wallet', 'QRIS', 'Paylater', 'Autodebet'] },
        { k: 'source', l: 'Sumber', t: 'select', o: Object.entries(SOURCE_LABEL).filter(([k]) => !r || !linked ? ['manual', 'school'].includes(k) : true), ro: linked }
      ],
      extraFoot: r ? `<button class="btn danger left" data-act="txnDel" data-id="${r.id}">${ic('trash')}Hapus</button>` : '',
      onSubmit: (v) => {
        if (linked) v.source = r.source;
        return r ? Store.update('Transactions', r.id, v) : Store.create('Transactions', v);
      }
    });
  },

  async deleteTxn(id) {
    const t = Store.get('Transactions', id);
    if (!t) return;
    const ops = [{ op: 'delete', sheet: 'Transactions', id }];
    let extra = '';
    if (t.source === 'loan' && t.kind === 'Cicilan' && Store.get('LoanInstallments', t.refId)) { ops.push({ op: 'update', sheet: 'LoanInstallments', id: t.refId, row: { status: 'Belum', paidDate: '' } }); extra = ' Status cicilan dikembalikan menjadi "Belum".'; }
    if (t.source === 'loan' && t.kind === 'Pencairan' && Store.get('Loans', t.refId)) { ops.push({ op: 'update', sheet: 'Loans', id: t.refId, row: { disbursed: false } }); extra = ' Pinjaman ditandai belum dicairkan.'; }
    if (t.source === 'tutor') {
      let ids = []; try { ids = JSON.parse(t.meta || '{}').sessionIds || []; } catch (e) { }
      ids.filter((sid) => Store.get('TutorSessions', sid)).forEach((sid) => ops.push({ op: 'update', sheet: 'TutorSessions', id: sid, row: { paid: false } }));
      if (ids.length) extra = ` ${ids.length} sesi kembali berstatus belum dibayar.`;
    }
    if (!(await UI.confirm(`Hapus transaksi ${idr(t.amount)} "${esc(t.description || t.category)}"?${extra}`, { ok: 'Hapus', danger: true }))) return;
    UI.closeAll();
    await Store.commit(ops);
    UI.toast('Transaksi dihapus');
  },

  txnTable(list, { running = false } = {}) {
    const inc = sum(list.filter((t) => t.type === 'income'), (t) => t.amount);
    const exp = sum(list.filter((t) => t.type === 'expense'), (t) => t.amount);
    return UI.table([
      { h: 'Tanggal', f: (t) => `<span class="nowrap">${fmtDate(t.date)}</span>` },
      { h: 'Keterangan', f: (t) => `<div class="t">${esc(t.description || t.category)}</div><div class="s">${esc(t.category)}${t.method ? ' — ' + esc(t.method) : ''}</div>` },
      { h: 'Sumber', f: (t) => UI.badge(SOURCE_LABEL[t.source] || 'Manual', SOURCE_COLOR[t.source] || '') },
      { h: 'Masuk', cls: 'r', f: (t) => t.type === 'income' ? `<b class="pos">${idr(t.amount)}</b>` : '' },
      { h: 'Keluar', cls: 'r', f: (t) => t.type === 'expense' ? `<b class="neg">${idr(t.amount)}</b>` : '' },
      { h: '', cls: 'act', f: (t) => `<button class="btn xs" data-act="txnEdit" data-id="${t.id}">${ic('edit')}</button>` }
    ], list, { emptyMsg: 'Belum ada transaksi.', foot: list.length ? `<tr><td colspan="3">Total (${list.length} transaksi) — selisih <span class="${inc - exp < 0 ? 'neg' : 'pos'}">${idr(inc - exp)}</span></td><td class="r pos">${idr(inc)}</td><td class="r neg">${idr(exp)}</td><td></td></tr>` : '' });
  },

  /* ---------- pinjaman ---------- */
  schedule(v) {
    const P = Number(v.principal) || 0, n = Math.max(1, Math.round(Number(v.tenor) || 1)), r = (Number(v.ratePct) || 0) / 100;
    const rows = [];
    let bal = P;
    for (let i = 1; i <= n; i++) {
      let pp, ip, amt;
      if (v.interestType === 'anuitas' && r > 0) {
        const A = P * r / (1 - Math.pow(1 + r, -n));
        ip = Math.round(bal * r); amt = Math.round(A); pp = amt - ip;
      } else if (v.interestType === 'tetap' && Number(v.installment) > 0) {
        amt = Math.round(Number(v.installment)); pp = Math.round(P / n); ip = amt - pp;
      } else {
        pp = Math.round(P / n); ip = Math.round(P * r); amt = pp + ip;
      }
      if (i === n) { const diff = bal - pp; pp += diff; amt += diff; }
      bal -= pp;
      rows.push({ no: i, dueDate: addMonths(v.firstDue, i - 1), amount: Math.max(0, amt), principalPart: pp, interestPart: Math.max(0, ip) });
    }
    return rows;
  },

  loanForm(id) {
    const r = id ? Store.get('Loans', id) : null;
    const st = r ? Fin.loanStats(r) : null;
    const locked = st && st.paidCount > 0;
    const firstDue = st && st.inst.length ? st.inst[0].dueDate : addMonths(todayISO(), 1);
    const fields = [
      { k: 'creditor', l: 'Kreditur / lembaga', req: 1, list: ['Bank', 'Koperasi', 'Shopee PayLater', 'SPinjam', 'Kredivo', 'KPR', 'Leasing Motor', 'Keluarga'] },
      { k: 'status', l: 'Status', t: 'select', o: ['Aktif', 'Lunas'] },
      { k: 'principal', l: 'Plafon / pokok (Rp)', t: 'money', req: 1, ro: locked },
      { k: 'ratePct', l: 'Bunga per bulan (%)', t: 'number', step: '0.01', min: 0, ro: locked },
      { k: 'tenor', l: 'Tenor (bulan)', t: 'number', min: 1, req: 1, ro: locked },
      { k: 'interestType', l: 'Perhitungan', t: 'select', o: [['flat', 'Flat (bunga tetap dari pokok)'], ['anuitas', 'Anuitas (angsuran sama, bunga menurun)'], ['tetap', 'Angsuran tetap sesuai tagihan']] },
      { k: 'installment', l: 'Angsuran per bulan (Rp)', t: 'money', allowZero: 1, hint: 'Terisi otomatis; isi manual bila memilih "Angsuran tetap".' },
      { k: 'startDate', l: 'Tanggal pencairan', t: 'date', req: 1 },
      { k: 'firstDue', l: 'Jatuh tempo pertama', t: 'date', req: 1, ro: locked },
      ...(r ? [] : [{ k: 'disbursed', l: 'Dana sudah cair — catat sebagai pemasukan kas (Loan Inflow)', t: 'checkbox', full: 1 }]),
      { k: 'note', l: 'Catatan (no. akad, tujuan pinjaman)', t: 'textarea', rows: 2 }
    ];
    const preview = (v, box) => {
      const sch = this.schedule(v);
      const el = box.querySelector('#loan-prev');
      if (v.interestType !== 'tetap' && sch.length) UI.setField(box, 'installment', sch[0].amount);
      if (el) el.innerHTML = sch.length && v.principal ? `Angsuran ${idr(sch[0].amount)}/bulan × ${sch.length} — total bayar ${idr(sum(sch, (x) => x.amount))} (bunga ${idr(sum(sch, (x) => x.interestPart))}). Lunas ${fmtDate(sch[sch.length - 1].dueDate)}.` : '';
    };
    UI.form({
      title: r ? `Ubah pinjaman ${r.creditor}` : 'Pinjaman baru', size: 'wide',
      values: r ? Object.assign({}, r, { firstDue }) : { startDate: todayISO(), firstDue: addMonths(todayISO(), 1), interestType: 'flat', ratePct: 0, tenor: 12, status: 'Aktif', disbursed: true },
      fields,
      note: `<span id="loan-prev"></span>${locked ? '<br>Sudah ada cicilan dibayar — pokok, bunga, dan tenor dikunci.' : ''}`,
      onMount: (box) => preview(UI.readForm(box, fields), box),
      onChange: (v, box, e) => { if (!e || !e.target || e.target.name !== 'installment' || v.interestType === 'tetap') preview(v, box); },
      extraFoot: r ? `<button class="btn danger left" data-act="loanDel" data-id="${r.id}">${ic('trash')}Hapus</button>` : '',
      onSubmit: async (v) => {
        if (v.interestType === 'tetap' && !(v.installment > 0)) { UI.toast('Isi nominal angsuran tetap.', 'err'); return false; }
        const sch = this.schedule(v);
        const firstDueV = v.firstDue, disb = v.disbursed;
        delete v.firstDue; delete v.disbursed;
        v.installment = sch.length ? sch[0].amount : 0;
        if (r) {
          const ops = [{ op: 'update', sheet: 'Loans', id: r.id, row: v }];
          if (!locked) {
            st.inst.forEach((i) => ops.push({ op: 'delete', sheet: 'LoanInstallments', id: i.id }));
            this.schedule(Object.assign({}, v, { firstDue: firstDueV })).forEach((x) => ops.push({ op: 'create', sheet: 'LoanInstallments', row: Object.assign(x, { loanId: r.id, status: 'Belum' }) }));
          }
          await Store.commit(ops); return;
        }
        const loan = Object.assign({ id: uid(), disbursed: !!disb }, v);
        const ops = [{ op: 'create', sheet: 'Loans', row: loan }];
        this.schedule(Object.assign({}, v, { firstDue: firstDueV })).forEach((x) => ops.push({ op: 'create', sheet: 'LoanInstallments', row: Object.assign(x, { loanId: loan.id, status: 'Belum' }) }));
        if (disb) ops.push({ op: 'create', sheet: 'Transactions', row: { date: v.startDate, type: 'income', category: 'Pencairan Pinjaman', amount: v.principal, description: `Pencairan pinjaman ${v.creditor}`, source: 'loan', refId: loan.id, kind: 'Pencairan', method: 'Transfer' } });
        await Store.commit(ops);
        UI.toast(`Pinjaman & ${sch.length} jadwal cicilan dibuat${disb ? '; pencairan tercatat sebagai pemasukan' : ''}`, 'ok');
      }
    });
  },

  payInst(id) {
    const i = Store.get('LoanInstallments', id);
    const loan = Store.get('Loans', i.loanId) || {};
    UI.form({
      title: `Bayar cicilan ${loan.creditor} ke-${i.no}`,
      values: { date: todayISO(), amount: i.amount, method: 'Transfer' },
      note: `Jatuh tempo ${fmtDate(i.dueDate)} — pokok ${idr(i.principalPart)}, bunga ${idr(i.interestPart)}. Dicatat sebagai pengeluaran (Loan Outflow) dan mengurangi sisa pokok utang.`,
      fields: [
        { k: 'date', l: 'Tanggal bayar', t: 'date', req: 1 },
        { k: 'amount', l: 'Jumlah dibayar (Rp)', t: 'money', req: 1, hint: 'Termasuk denda bila ada.' },
        { k: 'method', l: 'Metode', t: 'select', o: ['Transfer', 'Autodebet', 'Tunai', 'E-wallet'] }
      ],
      submit: 'Bayar',
      onSubmit: async (v) => {
        const ops = [
          { op: 'create', sheet: 'Transactions', row: { date: v.date, type: 'expense', category: 'Cicilan', amount: v.amount, description: `Cicilan ${loan.creditor} ke-${i.no}/${loan.tenor}`, source: 'loan', refId: i.id, kind: 'Cicilan', method: v.method } },
          { op: 'update', sheet: 'LoanInstallments', id: i.id, row: { status: 'Lunas', paidDate: v.date } }
        ];
        const left = Fin.loanInst(loan.id).filter((x) => x.status !== 'Lunas' && x.id !== i.id).length;
        if (!left) ops.push({ op: 'update', sheet: 'Loans', id: loan.id, row: { status: 'Lunas' } });
        await Store.commit(ops);
        UI.toast(left ? 'Cicilan dibayar & tercatat di Buku Kas' : 'Selamat — pinjaman lunas!', 'ok');
      }
    });
  },

  async disburse(loanId) {
    const l = Store.get('Loans', loanId);
    if (!(await UI.confirm(`Catat pencairan ${idr(l.principal)} dari ${esc(l.creditor)} sebagai pemasukan kas?`, { ok: 'Catat pencairan' }))) return;
    await Store.commit([
      { op: 'create', sheet: 'Transactions', row: { date: l.startDate || todayISO(), type: 'income', category: 'Pencairan Pinjaman', amount: l.principal, description: `Pencairan pinjaman ${l.creditor}`, source: 'loan', refId: l.id, kind: 'Pencairan', method: 'Transfer' } },
      { op: 'update', sheet: 'Loans', id: l.id, row: { disbursed: true } }
    ]);
  },

  recForm(id) {
    const r = id ? Store.get('Recurring', id) : null;
    UI.form({
      title: r ? 'Ubah pos rutin' : 'Pos pemasukan / pengeluaran rutin',
      values: r || { type: 'expense', active: true, dayOfMonth: 1 },
      fields: [
        { k: 'name', l: 'Nama', req: 1, ph: 'mis. Gaji sekolah, WiFi + listrik' },
        { k: 'type', l: 'Jenis', t: 'select', o: [['income', 'Pemasukan'], ['expense', 'Pengeluaran']] },
        { k: 'amount', l: 'Nominal per bulan (Rp)', t: 'money', req: 1 },
        { k: 'category', l: 'Kategori', list: () => Fin.categories() },
        { k: 'dayOfMonth', l: 'Tanggal biasa (1–31)', t: 'number', min: 1, max: 31 },
        { k: 'active', l: 'Aktif dihitung di proyeksi', t: 'checkbox' }
      ],
      extraFoot: r ? `<button class="btn danger left" data-act="delRow" data-sheet="Recurring" data-id="${r.id}">${ic('trash')}Hapus</button>` : '',
      onSubmit: (v) => r ? Store.update('Recurring', r.id, v) : Store.create('Recurring', v)
    });
  },

  async postRecurring(id) {
    const r = Store.get('Recurring', id);
    const mk = thisMonth();
    const day = clamp(Number(r.dayOfMonth) || 1, 1, new Date(+mk.slice(0, 4), +mk.slice(5), 0).getDate());
    await Store.create('Transactions', { date: `${mk}-${pad(day)}`, type: r.type, category: r.category || (r.type === 'income' ? 'Pemasukan Lain' : 'Pengeluaran Lain'), amount: r.amount, description: r.name, source: r.category === 'Gaji Sekolah' ? 'school' : 'manual', method: 'Transfer' });
    UI.toast(`"${r.name}" dicatat di Buku Kas`, 'ok');
  },

  projection(mk) {
    const s = App.s('finance');
    const off = s.projOff || {};
    const endOfMonth = addDays(addMonths(mk + '-01', 1), -1);
    const isCur = mk === thisMonth();
    const postedThisMonth = (r) => isCur && Store.all('Transactions').some((t) => monthKey(t.date) === mk && t.description === r.name && Number(t.amount) === Number(r.amount));
    const lines = [];
    const add = (key, label, amount, sign, note = '') => lines.push({ key, label, amount: Math.round(amount), sign, note, on: !off[key] });
    add('bal', `Saldo saat ini`, Fin.balance(), 1, 'dari Buku Kas');
    Store.where('Recurring', (r) => r.active !== false && r.type === 'income').forEach((r) => add('ri_' + r.id, r.name, postedThisMonth(r) ? 0 : r.amount, 1, postedThisMonth(r) ? 'sudah tercatat bulan ini' : 'pemasukan rutin'));
    const projs = Store.all('Projects').filter((p) => !['Batal'].includes(p.status) && Fin.projectRemaining(p) > 0 && (!p.deadline || p.deadline <= endOfMonth));
    add('proj', `Piutang project (${projs.length})`, sum(projs, (p) => Fin.projectRemaining(p)), 1, 'deadline ≤ akhir bulan');
    let tutor = 0;
    Store.all('TutorClasses').filter((c) => c.status === 'Aktif').forEach((c) => {
      if (c.rateType === 'paket') tutor += Fin.tutorRemaining(c);
      else tutor += Math.min(Fin.tutorRemaining(c), Tutor.sessions(c.id).filter((x) => !x.paid && x.status !== 'Batal' && x.date <= endOfMonth).length * Fin.sessionFee(c));
    });
    add('tutor', 'Sisa honor sesi bimbel', tutor, 1, 'sesi belum dibayar s.d. akhir bulan');
    add('loanPlan', 'Rencana pencairan pinjaman', Number(s.loanPlan) || 0, 1, 'isi manual');
    const due = Store.where('LoanInstallments', (i) => i.status !== 'Lunas' && i.dueDate <= endOfMonth);
    add('inst', `Cicilan jatuh tempo (${due.length})`, sum(due, (i) => i.amount), -1, 'termasuk yang terlambat');
    Store.where('Recurring', (r) => r.active !== false && r.type === 'expense').forEach((r) => add('re_' + r.id, r.name, postedThisMonth(r) ? 0 : r.amount, -1, postedThisMonth(r) ? 'sudah tercatat bulan ini' : 'pengeluaran rutin'));
    add('other', 'Pengeluaran lain', Number(s.otherExp) || 0, -1, 'isi manual');
    const total = sum(lines.filter((l) => l.on), (l) => l.amount * l.sign);
    return { lines, total };
  }
};

const MOODS = [[1, 'Berat', '--coral'], [2, 'Kurang', '--amber'], [3, 'Biasa', '--slate'], [4, 'Baik', '--sky'], [5, 'Hebat', '--jade']];
const HABIT_COLORS = ['rose', 'jade', 'sky', 'violet', 'amber', 'brand'];

const Journal = {
  newEntry() {
    const t = todayISO();
    const ex = Store.where('Journal', (j) => j.date === t)[0];
    const s = App.s('journal');
    s.current = ex ? ex.id : 'new';
    s.draftDate = t;
    App.sub.journal = 'jurnal';
    App.refresh();
  },
  async save() {
    const s = App.s('journal');
    const box = $('#j-editor');
    if (!box) return;
    const row = {
      date: $('#j-date').value || todayISO(),
      title: $('#j-title').value.trim(),
      tags: $('#j-tags').value.trim(),
      mood: Number(($('.mood.on') || {}).dataset ? $('.mood.on').dataset.m : 3) || 3,
      content: sanitizeHTML(box.innerHTML)
    };
    if (!stripHTML(row.content).trim() && !row.title) return UI.toast('Tulis sesuatu dulu sebelum menyimpan.', 'err');
    if (s.current && s.current !== 'new' && Store.get('Journal', s.current)) {
      await Store.update('Journal', s.current, row);
    } else {
      const r = await Store.create('Journal', row);
      s.current = r.id;
    }
    UI.toast('Jurnal disimpan', 'ok');
  },
  streak(habitId) {
    const days = new Set(Store.where('HabitLogs', (l) => l.habitId === habitId).map((l) => l.date));
    let d = todayISO();
    if (!days.has(d)) d = addDays(d, -1);
    let n = 0;
    while (days.has(d)) { n++; d = addDays(d, -1); }
    let best = 0, cur = 0;
    [...days].sort().forEach((x, i, arr) => { cur = i && diffDays(arr[i - 1], x) === 1 ? cur + 1 : 1; best = Math.max(best, cur); });
    const last30 = [...Array(30)].filter((_, i) => days.has(addDays(todayISO(), -i))).length;
    return { now: n, best, rate: Math.round(last30 / 30 * 100) };
  },
  habitForm(id) {
    const r = id ? Store.get('Habits', id) : null;
    UI.form({
      title: r ? 'Ubah habit' : 'Habit baru', values: r || { color: 'rose', active: true },
      fields: [
        { k: 'name', l: 'Nama kebiasaan', req: 1, ph: 'mis. Tilawah 1 juz, olahraga 20 menit', full: 1 },
        { k: 'color', l: 'Warna', t: 'select', o: HABIT_COLORS },
        { k: 'active', l: 'Aktif', t: 'checkbox' }
      ],
      extraFoot: r ? `<button class="btn danger left" data-act="habitDel" data-id="${r.id}">${ic('trash')}Hapus</button>` : '',
      onSubmit: (v) => r ? Store.update('Habits', r.id, v) : Store.create('Habits', v)
    });
  }
};

/* ---------------------------------------------------------------------
 * 24. FILE STORAGE (Google Drive / IndexedDB lokal)
 * ------------------------------------------------------------------- */
const FILE_MODULES = { school: 'Sekolah', project: 'Project', tutor: 'Tutor', finance: 'Keuangan', journal: 'Jurnal', umum: 'Umum' };
const Files = {
  MAX: 20 * 1024 * 1024,
  kind(f) {
    const n = String(f.name || '').toLowerCase(), m = String(f.mime || '');
    if (m === 'link') return ['URL', 'sky'];
    if (/\.pdf$/.test(n) || m.includes('pdf')) return ['PDF', 'coral'];
    if (/\.(docx?|odt|rtf)$/.test(n)) return ['DOC', 'brand'];
    if (/\.(xlsx?|csv|ods|sav)$/.test(n)) return ['XLS', 'jade'];
    if (/\.(pptx?)$/.test(n)) return ['PPT', 'amber'];
    if (/\.(zip|rar|7z)$/.test(n)) return ['ZIP', 'violet'];
    if (m.startsWith('image/') || /\.(png|jpe?g|gif|webp)$/.test(n)) return ['IMG', 'sky'];
    return ['FILE', 'slate'];
  },
  iconFor(f) { const [k, c] = this.kind(f); return `<span class="fico" style="background:var(--${c}-soft);color:var(--${c})">${k}</span>`; },
  refLabel(f) {
    if (!f.refId) return '';
    const p = Store.get('Projects', f.refId); if (p) return `${p.code} ${p.clientName}`;
    const c = Store.get('TutorClasses', f.refId); if (c) return c.name;
    const l = Store.get('Loans', f.refId); if (l) return l.creditor;
    return '';
  },

  pick(module, refId = '') {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.multiple = true;
    inp.addEventListener('change', () => this.upload([...inp.files], module, refId));
    inp.click();
  },

  async upload(files, module, refId = '') {
    if (!files.length) return;
    for (const file of files) {
      if (file.size > this.MAX) { UI.toast(`${file.name} melebihi 20 MB.`, 'err'); continue; }
      try {
        if (Store.isRemote()) {
          UI.toast(`Mengunggah ${file.name} ke Google Drive…`, '', 2500);
          const base64 = await fileToBase64(file);
          const j = await Api.call('upload', { file: { name: file.name, mime: file.type || 'application/octet-stream', base64, module, refId } });
          Store.data.Files.push(Store.normalizeRow('Files', j.row));
          Store.saveCache();
          App.refresh();
        } else {
          const id = uid();
          await IDB.put(id, file);
          await Store.create('Files', { id, module, refId, name: file.name, mime: file.type, size: file.size, url: 'idb:' + id });
        }
        UI.toast(`${file.name} tersimpan`, 'ok');
      } catch (e) { UI.toast(`Gagal mengunggah ${file.name}: ${e.message}`, 'err', 7000); }
    }
  },

  async openFile(id) {
    const f = Store.get('Files', id);
    if (!f) return;
    if (String(f.url).startsWith('idb:')) {
      try {
        const blob = await IDB.get(f.id);
        if (!blob) return UI.toast('File tidak ditemukan di browser ini (mungkin diunggah dari perangkat lain).', 'err');
        downloadBlob(blob, f.name);
      } catch (e) { UI.toast(e.message, 'err'); }
      return;
    }
    if (f.url) window.open(f.url, '_blank', 'noopener');
  },

  async del(id) {
    const f = Store.get('Files', id);
    if (!(await UI.confirm(`Hapus "${esc(f.name)}"? ${Store.isRemote() ? 'File dipindahkan ke Sampah Google Drive.' : ''}`, { ok: 'Hapus', danger: true }))) return;
    if (String(f.url).startsWith('idb:')) await IDB.del(f.id).catch(() => { });
    await Store.remove('Files', id);
  },

  panel(module) {
    const s = App.s('files');
    const key = 'q_' + module;
    const q = (s[key] || '').toLowerCase();
    let list = Store.all('Files').filter((f) => module === 'all' || f.module === module);
    if (module === 'all' && s.mod) list = list.filter((f) => f.module === s.mod);
    if (module === 'all' && s.kind) list = list.filter((f) => this.kind(f)[0] === s.kind);
    if (q) list = list.filter((f) => `${f.name} ${f.note} ${this.refLabel(f)}`.toLowerCase().includes(q));
    list.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    const upMod = module === 'all' ? 'umum' : module;
    const hint = { school: 'RPP / modul ajar, silabus, bank soal, rekap nilai', project: 'Draf dokumen, data SPSS/Excel, file final (.docx, .pdf, .zip)', tutor: 'Materi, lembar latihan, laporan sesi', finance: 'Bukti transfer, nota, kwitansi, berkas akad pinjaman', umum: 'Dokumen apa pun' }[upMod] || '';
    return `
      <div class="drop-zone" data-drop="${upMod}" data-act="filePick" data-mod="${upMod}">${ic('upload')}<div><b>Klik atau seret file ke sini</b></div><div class="mini">${esc(hint)} — maks. 20 MB — ${Store.isRemote() ? 'tersimpan di Google Drive' : 'tersimpan di browser ini'}</div></div>
      <div class="toolbar">
        <input class="input search" placeholder="Cari nama file…" data-chg="fileQ" data-key="${key}" data-live data-fk="${key}" value="${esc(s[key] || '')}">
        ${module === 'all' ? `<select class="select" data-chg="fileMod"><option value="">Semua modul</option>${Object.entries(FILE_MODULES).map(([k, l]) => `<option value="${k}" ${s.mod === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <select class="select" data-chg="fileKind"><option value="">Semua jenis</option>${['PDF', 'DOC', 'XLS', 'PPT', 'ZIP', 'IMG', 'URL', 'FILE'].map((k) => `<option ${s.kind === k ? 'selected' : ''}>${k}</option>`).join('')}</select>` : ''}
        <span class="mini muted">${list.length} file — ${fmtSize(sum(list, (f) => f.size))}</span>
      </div>
      ${UI.table([
        { h: 'Nama', f: (f) => `<div class="flex" style="flex-wrap:nowrap">${this.iconFor(f)}<div><div class="t">${esc(f.name)}</div><div class="s">${esc(this.refLabel(f) || f.note || '')}</div></div></div>` },
        ...(module === 'all' ? [{ h: 'Modul', f: (f) => UI.badge(FILE_MODULES[f.module] || f.module) }] : []),
        { h: 'Ukuran', cls: 'r', f: (f) => f.mime === 'link' ? 'Tautan' : fmtSize(f.size) },
        { h: 'Diunggah', f: (f) => `<span class="nowrap">${fmtDate(String(f.createdAt).slice(0, 10))}</span>` },
        { h: '', cls: 'act', f: (f) => `<button class="btn xs" data-act="fileOpen" data-id="${f.id}">${ic(String(f.url).startsWith('idb:') ? 'download' : 'eye')}Buka</button> <button class="btn xs danger" data-act="fileDel" data-id="${f.id}" aria-label="Hapus">${ic('trash')}</button>` }
      ], list, { emptyMsg: 'Belum ada file.' })}`;
  }
};

VIEWS.files = { semua: { actions: () => `<button class="btn mod" data-act="filePick" data-mod="umum">${ic('upload')}Upload file</button>`, render: () => Files.panel('all') } };

Object.assign(ACT, {

Object.assign(CHG, {

/* drag & drop ke drop-zone */
document.addEventListener('dragover', (e) => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) { e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', (e) => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) z.classList.remove('over'); });
document.addEventListener('drop', (e) => {
  const z = e.target.closest && e.target.closest('[data-drop]');
  if (!z) return;
  e.preventDefault(); z.classList.remove('over');
  if (e.dataTransfer.files.length) Files.upload([...e.dataTransfer.files], z.dataset.drop);
});
/* ---------------------------------------------------------------------
 * 25. DOKUMEN PDF (Invoice, Kwitansi, Laporan Sesi) + Gmail
 * ------------------------------------------------------------------- */
const Docs = {
  lib() {
    if (!window.jspdf || !window.jspdf.jsPDF) throw new Error('Library PDF (jsPDF) belum termuat. Periksa koneksi internet lalu muat ulang halaman.');
    return window.jspdf.jsPDF;
  },
  pdfText(s) { return String(s == null ? '' : s).replace(/[—–]/g, '-').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g, ''); },

  base(title, number, date) {
    const JsPDF = this.lib();
    const doc = new JsPDF({ unit: 'mm', format: 'a4' });
    const st = Store.settings();
    const T = (s) => this.pdfText(s);
    doc.setFillColor(47, 69, 197); doc.rect(0, 0, 210, 5, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(23, 32, 54);
    doc.text(T(st.businessName || st.ownerName || 'My Productivity Hub'), 15, 20);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(94, 106, 133);
    doc.text(T([st.ownerName, st.ownerEmail, st.ownerWa ? 'WA ' + st.ownerWa : ''].filter(Boolean).join('  |  ')), 15, 26);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.setTextColor(47, 69, 197);
    doc.text(T(title), 195, 20, { align: 'right' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(23, 32, 54);
    doc.text(T(`No. ${number}`), 195, 26, { align: 'right' });
    doc.text(T(`Tanggal ${fmtDate(date)}`), 195, 31, { align: 'right' });
    doc.setDrawColor(220, 226, 238); doc.line(15, 36, 195, 36);
    return doc;
  },

  table(doc, startY, head, body, colStyles = {}) {
    if (typeof doc.autoTable === 'function') {
      doc.autoTable({
        startY, head: [head.map((h) => this.pdfText(h))], body: body.map((r) => r.map((c) => this.pdfText(c))), theme: 'grid',
        styles: { font: 'helvetica', fontSize: 9.5, cellPadding: 2.4, textColor: [23, 32, 54], lineColor: [220, 226, 238] },
        headStyles: { fillColor: [245, 247, 251], textColor: [94, 106, 133], fontStyle: 'bold' },
        columnStyles: colStyles, margin: { left: 15, right: 15 }
      });
      return doc.lastAutoTable.finalY;
    }
    let y = startY + 6;
    doc.setFontSize(9.5); doc.setFont('helvetica', 'bold');
    head.forEach((h, i) => doc.text(this.pdfText(h), 15 + i * (180 / head.length), y));
    doc.setFont('helvetica', 'normal');
    body.forEach((r) => { y += 6; if (y > 280) { doc.addPage(); y = 20; } r.forEach((c, i) => doc.text(this.pdfText(String(c)).slice(0, 48), 15 + i * (180 / head.length), y)); });
    return y + 2;
  },

  footer(doc, y) {
    const st = Store.settings();
    const T = (s) => this.pdfText(s);
    doc.setFontSize(9); doc.setTextColor(94, 106, 133);
    if (st.bankInfo) { doc.setFont('helvetica', 'bold'); doc.text('Pembayaran ke:', 15, y); doc.setFont('helvetica', 'normal'); doc.text(doc.splitTextToSize(T(st.bankInfo), 110), 15, y + 5); y += 5 + 5 * doc.splitTextToSize(T(st.bankInfo), 110).length; }
    if (st.invoiceNote) doc.text(doc.splitTextToSize(T(st.invoiceNote), 180), 15, y + 3);
    doc.text(T(`Dibuat dengan My Productivity Hub - ${new Date().toLocaleString('id-ID')}`), 15, 290);
    return y;
  },

  invoiceDoc(p) {
    const total = Fin.projectTotal(p), paid = Fin.projectPaid(p), rem = Fin.projectRemaining(p);
    const d = new Date();
    const number = `INV/${d.getFullYear()}/${pad(d.getMonth() + 1)}/${p.code}`;
    const doc = this.base('INVOICE', number, todayISO());
    const T = (s) => this.pdfText(s);
    doc.setFontSize(9); doc.setTextColor(94, 106, 133); doc.text('Ditagihkan kepada', 15, 44);
    doc.setFontSize(11); doc.setTextColor(23, 32, 54); doc.setFont('helvetica', 'bold'); doc.text(T(p.clientName), 15, 50);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
    doc.text(T([p.campus, p.clientEmail, p.clientWa].filter(Boolean).join('  |  ')), 15, 55);
    doc.text(T(`Deadline pengerjaan: ${fmtDate(p.deadline)}   Status: ${p.status}   Progres: ${Math.round(p.progress || 0)}%`), 15, 61);
    const est = Project.estimate(p.category, p.service, p.speed, 50);
    let y = this.table(doc, 67, ['Layanan', 'Kategori', 'Kecepatan', 'Jumlah'], [
      [p.service, p.category, p.speed, idr(p.price)],
      ...(Number(p.discount) ? [['Diskon', '', '', '-' + idr(p.discount)]] : [])
    ], { 3: { halign: 'right' } });
    const pays = Store.where('Transactions', (t) => t.source === 'project' && t.refId === p.id).sort((a, b) => a.date.localeCompare(b.date));
    y += 6;
    const line = (l, v, bold) => { doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.text(T(l), 125, y); doc.text(T(v), 195, y, { align: 'right' }); y += 6; };
    doc.setFontSize(10);
    line('Total tagihan', idr(total), true);
    pays.forEach((t) => line(`${t.kind || 'Bayar'} ${fmtDateShort(t.date)}`, '-' + idr(t.amount)));
    doc.setTextColor(rem ? 214 : 19, rem ? 69 : 136, rem ? 69 : 106);
    line(rem ? 'SISA TAGIHAN' : 'LUNAS', idr(rem), true);
    doc.setTextColor(23, 32, 54);
    y += 4;
    if (est && rem > 0 && paid === 0) { doc.setFontSize(9); doc.text(T(`DP minimal ${Math.round(est.dp * 100)}% = ${idr(total * est.dp)} untuk memulai pengerjaan.`), 15, y); y += 6; }
    if (est) { doc.setFontSize(9); doc.text(T(`Garansi revisi minor ${est.warranty} hari setelah file dikirim. Perubahan judul/topik/metode dihitung revisi mayor.`), 15, y); y += 8; }
    this.footer(doc, y + 4);
    return { doc, number, name: `Invoice_${p.code}.pdf` };
  },

  async invoice(projectId, send) {
    const p = Store.get('Projects', projectId);
    const { doc, number, name } = this.invoiceDoc(p);
    if (!send) { doc.save(name); return; }
    const st = Store.settings();
    await this.mail(p.clientEmail, `Invoice ${number} - ${p.service}`,
      `<p>Yth. ${esc(p.clientName)},</p><p>Terlampir invoice <b>${esc(number)}</b> untuk layanan <b>${esc(p.service)}</b>.</p><p>Total: <b>${idr(Fin.projectTotal(p))}</b><br>Sudah dibayar: ${idr(Fin.projectPaid(p))}<br>Sisa tagihan: <b>${idr(Fin.projectRemaining(p))}</b></p>${st.bankInfo ? `<p>Pembayaran ke: ${esc(st.bankInfo)}</p>` : ''}<p>Pantau progres pengerjaan: <a href="${esc(Project.portalUrl(p))}">portal klien</a></p><p>Salam,<br>${esc(st.ownerName)}</p>`,
      doc, name);
  },

  receiptDoc(t) {
    const st = Store.settings();
    const T = (s) => this.pdfText(s);
    let payer = '', purpose = t.description;
    if (t.source === 'project') { const p = Store.get('Projects', t.refId); if (p) { payer = p.clientName; purpose = `${t.kind || 'Pembayaran'} ${p.service} (${p.code})`; } }
    if (t.source === 'tutor') { const c = Store.get('TutorClasses', t.refId); if (c) { payer = c.clientName; purpose = t.description; } }
    const d = parseISO(t.date) || new Date();
    const number = `KW/${d.getFullYear()}${pad(d.getMonth() + 1)}/${t.id.slice(0, 6).toUpperCase()}`;
    const doc = this.base('KWITANSI', number, t.date);
    let y = 50;
    const row = (l, v, bold) => {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(94, 106, 133); doc.text(T(l), 15, y);
      doc.setTextColor(23, 32, 54); doc.setFont('helvetica', bold ? 'bold' : 'normal');
      const lines = doc.splitTextToSize(T(v), 130); doc.text(lines, 65, y); y += 7 * lines.length + 2;
    };
    row('Telah terima dari', payer || '-', true);
    row('Uang sejumlah', terbilang(t.amount), true);
    row('Untuk pembayaran', purpose || '-');
    row('Metode', t.method || '-');
    y += 4;
    doc.setFillColor(229, 233, 255); doc.roundedRect(15, y, 80, 16, 3, 3, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.setTextColor(47, 69, 197); doc.text(T(idr(t.amount)), 20, y + 10.5);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(23, 32, 54);
    doc.text(T(`Pekanbaru, ${fmtDate(t.date)}`), 195, y + 4, { align: 'right' });
    doc.text('Penerima,', 195, y + 10, { align: 'right' });
    doc.setFont('helvetica', 'bold'); doc.text(T(st.ownerName || ''), 195, y + 34, { align: 'right' });
    this.footer(doc, y + 48);
    return { doc, number, name: `Kwitansi_${number.replace(/\//g, '-')}.pdf`, payer, purpose };
  },

  receiptPDF(txnId, download) {
    const t = Store.get('Transactions', txnId);
    if (!t) return UI.toast('Transaksi tidak ditemukan', 'err');
    const r = this.receiptDoc(t);
    if (download) r.doc.save(r.name);
    return r;
  },

  async sendReceipt(txnId) {
    const t = Store.get('Transactions', txnId);
    if (!t) return;
    let email = '';
    if (t.source === 'project') email = (Store.get('Projects', t.refId) || {}).clientEmail;
    if (t.source === 'tutor') email = (Store.get('TutorClasses', t.refId) || {}).clientEmail;
    if (!email) return UI.toast('Email klien belum diisi.', 'err');
    const r = this.receiptDoc(t);
    const st = Store.settings();
    await this.mail(email, `Kwitansi ${r.number} - ${idr(t.amount)}`,
      `<p>Yth. ${esc(r.payer)},</p><p>Terima kasih, pembayaran Anda sebesar <b>${idr(t.amount)}</b> untuk <b>${esc(r.purpose)}</b> telah kami terima pada ${fmtDate(t.date)}.</p><p>Kwitansi resmi terlampir.</p><p>Salam,<br>${esc(st.ownerName)}</p>`,
      r.doc, r.name);
  },

  async sessionReport(classId) {
    const c = Store.get('TutorClasses', classId);
    const st = Tutor.stats(c);
    const doc = this.base('LAPORAN SESI', c.name.slice(0, 40), todayISO());
    const T = (s) => this.pdfText(s);
    doc.setFontSize(10); doc.setTextColor(23, 32, 54);
    doc.text(T(`Klien: ${c.clientName}${c.institution ? ' (' + c.institution + ')' : ''}   Jenis: ${c.tutorType} - ${c.mode}`), 15, 44);
    doc.text(T(`Progres: ${st.done}/${st.total} sesi (${Math.round(st.pct)}%)   Prediksi selesai: ${st.predicted ? fmtDate(st.predicted) : '-'}`), 15, 50);
    doc.text(T(`Tagihan ${idr(Fin.tutorTotal(c))}   Dibayar ${idr(Fin.tutorPaid(c))}   Sisa ${idr(Fin.tutorRemaining(c))}`), 15, 56);
    const y = this.table(doc, 62, ['#', 'Tanggal', 'Waktu', 'Materi / catatan', 'Status', 'Bayar'],
      st.ss.map((s) => [s.no, fmtDate(s.date), `${s.start || ''}${s.end ? '-' + s.end : ''}`, [s.topic, s.note].filter(Boolean).join(' | ') || '-', s.status, s.paid ? 'Lunas' : '-']),
      { 0: { cellWidth: 8 }, 3: { cellWidth: 70 } });
    this.footer(doc, y + 8);
    const name = `Laporan_${c.name.replace(/[^\w]+/g, '_')}.pdf`;
    if (c.clientEmail && Store.isRemote() && await UI.confirm(`Kirim laporan ke ${esc(c.clientEmail)}? Pilih "Batal" untuk hanya mengunduh.`, { ok: 'Kirim email' })) {
      await this.mail(c.clientEmail, `Laporan progres ${c.name}`, `<p>Yth. ${esc(c.clientName)},</p><p>Terlampir laporan progres kelas <b>${esc(c.name)}</b>: ${st.done} dari ${st.total} sesi selesai.</p><p>Salam,<br>${esc(Store.settings().ownerName)}</p>`, doc, name);
    } else doc.save(name);
  },

  async mail(to, subject, html, doc, filename) {
    if (!Store.isRemote()) {
      doc.save(filename);
      UI.toast('Mode lokal: PDF diunduh. Hubungkan Google Sheets untuk mengirim lewat Gmail.', '', 6000);
      return;
    }
    if (!validEmail(to)) throw new Error('Email penerima tidak valid.');
    const base64 = doc.output('datauristring').split(',')[1];
    UI.toast(`Mengirim ke ${to}…`, '', 2000);
    const j = await Api.call('sendMail', { mail: { to, subject, html, attachments: [{ name: filename, mime: 'application/pdf', base64 }] } });
    if (Store.services) Store.services.mailQuota = j.quota;
    UI.toast(`Email terkirim ke ${to}`, 'ok');
  }
};

  TutorClasses: { name: ['nama kelas', 'kelas', 'class', 'name'], clientName: ['nama klien', 'klien', 'client'], tutorType: ['jenis', 'tutortype'], totalSessions: ['jumlah sesi', 'sesi', 'pertemuan'], rate: ['tarif', 'fee', 'harga', 'rate'] },
