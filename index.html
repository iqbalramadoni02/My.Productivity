<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Productivity Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
/* =========================================================
   MY PRODUCTIVITY HUB — Design tokens
   Indigo tinta + permukaan dingin, satu warna per modul.
   ========================================================= */
:root {
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --bg: #eef1f6;
  --surface: #ffffff;
  --surface-2: #f5f7fb;
  --surface-3: #e9edf5;
  --ink: #172036;
  --ink-2: #33405e;
  --muted: #5e6a85;
  --line: #dce2ee;
  --brand: #2f45c5;
  --brand-soft: #e5e9ff;
  --jade: #13886a;
  --jade-soft: #dcf3ea;
  --coral: #d64545;
  --coral-soft: #fbe3e3;
  --amber: #b87a05;
  --amber-soft: #fbefd3;
  --violet: #7446c0;
  --violet-soft: #eee6fb;
  --sky: #1580ab;
  --sky-soft: #dcf0f8;
  --rose: #c23d74;
  --rose-soft: #f9e1ec;
  --slate: #4b5a78;
  --slate-soft: #e6eaf2;
  --glass: rgba(255, 255, 255, .72);
  --shadow-lg: 0 18px 48px -18px rgba(23, 32, 54, .35);
  --shadow-sm: 0 1px 2px rgba(23, 32, 54, .06), 0 2px 8px -4px rgba(23, 32, 54, .12);
  --r-lg: 18px;
  --r-md: 12px;
  --r-sm: 8px;
  --sidebar: 244px;
  --top: 60px;
  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #0c111e;
  --surface: #141b2c;
  --surface-2: #19223a;
  --surface-3: #212c47;
  --ink: #e7ebf5;
  --ink-2: #c3cbe0;
  --muted: #8e9bb8;
  --line: #27324c;
  --brand: #8193ff;
  --brand-soft: #232d5c;
  --jade: #3ccf9f;
  --jade-soft: #123a31;
  --coral: #ff7a72;
  --coral-soft: #43201f;
  --amber: #f0b94a;
  --amber-soft: #3f3016;
  --violet: #b596ff;
  --violet-soft: #2e2450;
  --sky: #5cc4ec;
  --sky-soft: #123547;
  --rose: #ff7fb0;
  --rose-soft: #43203a;
  --slate: #a9b6d3;
  --slate-soft: #232d44;
  --glass: rgba(20, 27, 44, .72);
  --shadow-lg: 0 18px 48px -18px rgba(0, 0, 0, .7);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 14.5px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand); }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.num, .money, td.r { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- boot ---------- */
.boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; color: var(--muted); }
.boot-mark { width: 46px; height: 46px; border-radius: 14px; background: conic-gradient(var(--brand) 0 25%, var(--jade) 0 50%, var(--amber) 0 75%, var(--violet) 0); animation: spin 1.4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- layout ---------- */
.app { min-height: 100vh; }
.shell { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; transition: grid-template-columns .2s ease; }
.shell.collapsed { grid-template-columns: 72px 1fr; }

.sidebar {
  position: sticky; top: 0; height: 100vh;
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 14px 12px; gap: 6px; overflow-y: auto; z-index: 30;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; font-weight: 800; font-size: 15.5px; letter-spacing: -.01em; white-space: nowrap; }
.brand-mark { width: 32px; height: 32px; flex: none; border-radius: 10px; background: var(--brand); display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 7px; }
.brand-mark i { background: #fff; border-radius: 2px; }
.brand-mark i:nth-child(2) { opacity: .7; } .brand-mark i:nth-child(3) { opacity: .55; } .brand-mark i:nth-child(4) { opacity: .85; }
.nav-sep { font-size: 12px; color: var(--muted); padding: 12px 10px 4px; white-space: nowrap; }
.nav-btn {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 9px 10px; border: 0; border-radius: 10px; background: transparent; cursor: pointer;
  color: var(--ink-2); font-weight: 600; text-align: left; white-space: nowrap;
}
.nav-btn:hover { background: var(--surface-2); }
.nav-btn.on { background: var(--brand-soft); color: var(--brand); }
.nav-btn .dot { width: 8px; height: 8px; border-radius: 50%; margin-left: auto; flex: none; }
.nav-btn .count { margin-left: auto; font-size: 11.5px; background: var(--coral); color: #fff; border-radius: 99px; padding: 0 7px; line-height: 18px; }
.sidebar-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); display: grid; gap: 4px; }
.collapsed .nav-btn span.lbl, .collapsed .brand span, .collapsed .nav-sep, .collapsed .nav-btn .count, .collapsed .nav-btn .dot { display: none; }
.collapsed .nav-btn { justify-content: center; }
.collapsed .brand { justify-content: center; padding-left: 0; padding-right: 0; }

.main { min-width: 0; overflow-x: clip; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20; height: var(--top);
  display: flex; align-items: center; gap: 10px; padding: 0 18px;
  background: var(--glass); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
  border-bottom: 1px solid var(--line);
}
.search-btn {
  display: flex; align-items: center; gap: 10px; flex: 1; max-width: 460px;
  height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--muted); cursor: pointer; text-align: left;
}
.search-btn kbd { margin-left: auto; flex: none; }
.search-btn .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
kbd { font-family: var(--font); font-size: 11.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 0 6px; background: var(--surface-2); color: var(--muted); }
.top-spacer { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px;
  border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap;
}
.chip .led { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.led.ok { background: var(--jade); box-shadow: 0 0 0 3px var(--jade-soft); }
.led.busy { background: var(--amber); animation: pulse 1s ease-in-out infinite; }
.led.err { background: var(--coral); }
.led.local { background: var(--slate); }
@keyframes pulse { 50% { opacity: .35; } }
.icon-btn {
  position: relative; display: inline-grid; place-items: center; width: 38px; height: 38px; flex: none;
  border-radius: 10px; border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--ink-2);
}
.icon-btn:hover { background: var(--surface-2); border-color: var(--line); }
.icon-btn .badge-dot { position: absolute; top: 4px; right: 3px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px; background: var(--coral); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; }
.clock { font-size: 12.5px; color: var(--muted); text-align: right; line-height: 1.25; white-space: nowrap; }
.clock b { display: block; color: var(--ink); font-size: 14px; }

/* ---------- tabs (multi-window) ---------- */
.tabbar { display: flex; gap: 6px; padding: 10px 18px 0; overflow-x: auto; scrollbar-width: thin; }
.wtab {
  display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px 0 12px; flex: none;
  border-radius: 10px 10px 0 0; border: 1px solid var(--line); border-bottom: 0;
  background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: 13px; cursor: pointer;
}
.wtab.on { background: var(--surface); color: var(--ink); box-shadow: inset 0 3px 0 var(--mc, var(--brand)); }
.wtab .x { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; border: 0; background: transparent; cursor: pointer; color: var(--muted); }
.wtab .x:hover { background: var(--surface-3); color: var(--coral); }
.wtab .x svg.i { width: 14px; height: 14px; }

.workspace { flex: 1; background: var(--surface); margin: 0 18px 18px; border: 1px solid var(--line); border-radius: 0 var(--r-lg) var(--r-lg) var(--r-lg); min-height: 70vh; }
.win-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 18px 22px 0; }
.win-title { display: flex; align-items: center; gap: 12px; }
.win-title h1 { margin: 0; font-size: 21px; letter-spacing: -.02em; }
.win-title p { margin: 0; color: var(--muted); font-size: 13px; }
.mod-ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--mcs, var(--brand-soft)); color: var(--mc, var(--brand)); flex: none; }
.win-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.subtabs { display: flex; gap: 4px; padding: 14px 22px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.subtab { border: 0; background: none; padding: 9px 12px 11px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2.5px solid transparent; white-space: nowrap; }
.subtab.on { color: var(--mc, var(--brand)); border-color: var(--mc, var(--brand)); }
.win-body { padding: 20px 22px 26px; }

/* module colors */
.m-school { --mc: var(--sky); --mcs: var(--sky-soft); }
.m-project { --mc: var(--violet); --mcs: var(--violet-soft); }
.m-tutor { --mc: var(--amber); --mcs: var(--amber-soft); }
.m-finance { --mc: var(--jade); --mcs: var(--jade-soft); }
.m-journal { --mc: var(--rose); --mcs: var(--rose-soft); }
.m-files { --mc: var(--slate); --mcs: var(--slate-soft); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 13.5px; cursor: pointer; white-space: nowrap; text-decoration: none;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0c111e; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.mod { background: var(--mc); border-color: var(--mc); color: #fff; }
:root[data-theme="dark"] .btn.mod { color: #0c111e; }
.btn.danger { color: var(--coral); }
.btn.danger.solid { background: var(--coral); border-color: var(--coral); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; }
.btn.xs { height: 26px; padding: 0 8px; font-size: 12px; border-radius: 7px; gap: 5px; }
.btn.xs svg.i, .btn.sm svg.i { width: 15px; height: 15px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- home hub ---------- */
.home { padding: 22px; }
.hello { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.hello h1 { margin: 0; font-size: clamp(22px, 2.6vw, 30px); letter-spacing: -.03em; line-height: 1.15; }
.hello p { margin: 4px 0 0; color: var(--muted); }
.hub { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.hub-card {
  position: relative; display: flex; flex-direction: column; gap: 12px; text-align: left; cursor: pointer;
  padding: 18px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface);
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; min-height: 172px; overflow: hidden;
}
.hub-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--mc); }
.hub-card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--mc); }
.hub-card .hc-top { display: flex; align-items: center; gap: 10px; }
.hub-card h3 { margin: 0; font-size: 15px; letter-spacing: -.01em; }
.hub-card .hc-open { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 600; }
.hub-card .hc-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: auto; }
.hc-stat small { display: block; color: var(--muted); font-size: 12px; }
.hc-stat b { font-size: 17px; letter-spacing: -.02em; }
.hub-card.wide { grid-column: span 2; }
.hub-card.finance .big { font-size: clamp(26px, 3.2vw, 38px); font-weight: 800; letter-spacing: -.035em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.hub-card.finance .big-label { color: var(--muted); font-size: 12.5px; }
.spark { width: 100%; height: 54px; display: block; }
.hub-card .hc-note { font-size: 12.5px; color: var(--muted); }
.panels { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; }

/* ---------- cards & panels ---------- */
.card { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); padding: 16px; }
.card.soft { background: var(--surface-2); }
.card h3, .card h4 { margin: 0 0 10px; font-size: 14.5px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.card h3 .btn, .card h4 .btn { margin-left: auto; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
.stat { border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; background: var(--surface); }
.stat small { display: block; color: var(--muted); font-size: 12.5px; }
.stat b { display: block; font-size: 21px; letter-spacing: -.025em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .sub { font-size: 12px; color: var(--muted); }
.stat.accent { border-left: 4px solid var(--mc, var(--brand)); }
.pos { color: var(--jade); } .neg { color: var(--coral); } .warn { color: var(--amber); } .muted { color: var(--muted); }
.list { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; gap: 10px; align-items: center; padding: 8px 6px; border-radius: 8px; }
.list li:hover { background: var(--surface-2); }
.list li .grow { flex: 1; min-width: 0; }
.list li .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list li .s { font-size: 12px; color: var(--muted); }
.list li.link { cursor: pointer; }
.empty { text-align: center; color: var(--muted); padding: 26px 12px; border: 1.5px dashed var(--line); border-radius: var(--r-md); }
.empty b { display: block; color: var(--ink-2); margin-bottom: 4px; }
.empty .btn { margin-top: 12px; }

/* ---------- badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 99px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--slate-soft); color: var(--slate); }
.b-jade { background: var(--jade-soft); color: var(--jade); }
.b-coral { background: var(--coral-soft); color: var(--coral); }
.b-amber { background: var(--amber-soft); color: var(--amber); }
.b-violet { background: var(--violet-soft); color: var(--violet); }
.b-sky { background: var(--sky-soft); color: var(--sky); }
.b-brand { background: var(--brand-soft); color: var(--brand); }
.b-rose { background: var(--rose-soft); color: var(--rose); }
.dotc { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

/* ---------- toolbar / filters ---------- */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar .grow { flex: 1; }
.input, .select, textarea.input {
  height: 36px; padding: 0 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); min-width: 0; width: 100%;
}
textarea.input { height: auto; min-height: 84px; padding: 9px 11px; resize: vertical; }
.input:focus, .select:focus { outline: 2px solid var(--brand); outline-offset: 0; border-color: transparent; }
.toolbar .input, .toolbar .select { width: auto; }
.toolbar .search { min-width: 220px; flex: 1; max-width: 340px; }

/* ---------- table ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-weight: 700; color: var(--muted); font-size: 12.5px; padding: 10px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl td.act { white-space: nowrap; text-align: right; }
.tbl .t { font-weight: 600; }
.tbl .s { font-size: 12px; color: var(--muted); }
.tbl tfoot td { font-weight: 700; background: var(--surface-2); }
.tbl select.inline { height: 28px; padding: 0 6px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; }

.progress { height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; min-width: 70px; }
.progress > i { display: block; height: 100%; border-radius: 99px; background: var(--mc, var(--brand)); }
.progress.lg { height: 11px; }

/* ---------- timetable ---------- */
.tt { display: grid; grid-template-columns: repeat(6, minmax(140px, 1fr)); gap: 10px; overflow-x: auto; }
.tt-col { background: var(--surface-2); border-radius: var(--r-md); padding: 10px; min-height: 120px; }
.tt-col.today { outline: 2px solid var(--sky); }
.tt-col h5 { margin: 0 0 8px; font-size: 13px; display: flex; justify-content: space-between; }
.tt-item { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--sky); border-radius: 9px; padding: 7px 9px; margin-bottom: 7px; cursor: pointer; }
.tt-item.duty { border-left-color: var(--slate); opacity: .85; }
.tt-item b { display: block; font-size: 13px; }
.tt-item small { color: var(--muted); font-size: 12px; }

/* ---------- month calendar ---------- */
.cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.cal-head h4 { margin: 0 8px 0 0; font-size: 16px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.cal .dh { padding: 7px; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line); }
.cal .dc { min-height: 92px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 12px; cursor: pointer; }
.cal .dc:nth-child(7n) { border-right: 0; }
.cal .dc.out { background: var(--surface-2); color: var(--muted); }
.cal .dc.today .dn { background: var(--brand); color: #fff; border-radius: 99px; padding: 0 6px; }
.cal .dn { font-weight: 700; display: inline-block; margin-bottom: 3px; }
.cal .ev { display: block; border-radius: 5px; padding: 1px 5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; font-size: 11.5px; }

/* ---------- kanban ---------- */
.kanban { display: grid; grid-template-columns: repeat(5, minmax(210px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.kcol { background: var(--surface-2); border-radius: var(--r-md); padding: 10px; min-height: 280px; }
.kcol.drop { outline: 2px dashed var(--violet); }
.kcol h5 { margin: 2px 2px 10px; font-size: 13px; display: flex; justify-content: space-between; }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; cursor: grab; }
.kcard:active { cursor: grabbing; }
.kcard .t { font-weight: 700; font-size: 13.5px; }
.kcard .s { font-size: 12px; color: var(--muted); margin: 2px 0 8px; }

/* ---------- tutor / loan cards ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.ocard { border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
.ocard .hd { display: flex; align-items: flex-start; gap: 10px; }
.ocard .hd h4 { margin: 0; font-size: 15px; }
.ocard .hd p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.ocard .hd .badge { margin-left: auto; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 13px; }
.kv small { display: block; color: var(--muted); font-size: 11.5px; }
.kv b { font-variant-numeric: tabular-nums; }
.ocard .foot { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }

/* ---------- habit ---------- */
.habit-grid { display: grid; gap: 6px; }
.habit-row { display: grid; grid-template-columns: minmax(150px, 220px) repeat(14, 30px) auto; gap: 5px; align-items: center; }
.habit-row .hn { font-weight: 600; display: flex; align-items: center; gap: 8px; overflow: hidden; }
.habit-row .hn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.hcell.on { background: var(--hc, var(--rose)); border-color: transparent; color: #fff; }
.hcell.today { outline: 2px solid var(--ink-2); outline-offset: 1px; }
.habit-head .hcell { border: 0; background: none; cursor: default; font-weight: 700; }
.streak { font-size: 12.5px; color: var(--muted); white-space: nowrap; padding-left: 6px; }
.habit-wrap { overflow-x: auto; }

/* ---------- journal ---------- */
.journal { display: grid; grid-template-columns: 290px 1fr; gap: 16px; }
.jlist { display: grid; gap: 6px; align-content: start; max-height: 70vh; overflow: auto; }
.jitem { text-align: left; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); cursor: pointer; }
.jitem.on { border-color: var(--rose); box-shadow: inset 3px 0 0 var(--rose); }
.jitem .t { font-weight: 700; }
.jitem .s { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }

.editor { min-height: 280px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 0 0 10px 10px; background: var(--surface); line-height: 1.7; }
.editor:focus { outline: 2px solid var(--rose); outline-offset: -1px; }
.editor:empty::before { content: attr(data-ph); color: var(--muted); }
.moods { display: flex; gap: 6px; flex-wrap: wrap; }
.mood { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; height: 32px; padding: 0 12px; cursor: pointer; font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.mood.on { border-color: var(--mood); background: color-mix(in srgb, var(--mood) 16%, var(--surface)); }

/* ---------- todo ---------- */
.todo-add { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.todo-add .input { flex: 1; min-width: 200px; }

.check { width: 20px; height: 20px; accent-color: var(--brand); cursor: pointer; flex: none; }

/* ---------- files ---------- */
.drop-zone { border: 1.5px dashed var(--line); border-radius: var(--r-md); padding: 18px; text-align: center; color: var(--muted); margin-bottom: 14px; cursor: pointer; }

.fico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 10.5px; font-weight: 800; flex: none; }

/* ---------- modal ---------- */
.overlay { position: fixed; inset: 0; background: rgba(12, 17, 30, .5); z-index: 100; display: grid; place-items: center; padding: 16px; animation: fade .15s ease; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(680px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--line); animation: rise .18s ease; }
.modal.wide { width: min(980px, 100%); }
.modal.narrow { width: min(460px, 100%); }
@keyframes rise { from { transform: translateY(10px); opacity: .6; } }

.mt { margin-top: 14px; } .mb { margin-bottom: 14px; }
.flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.nowrap { white-space: nowrap; }
.mini { font-size: 12px; }
.tasks .todo { cursor: default; }
.w-input { width: 70px !important; }
.portal { max-width: 720px; margin: 0 auto; padding: 32px 18px; }

  .workspace { border: 0; margin: 0; }

const $ = (sel, root = document) => root.querySelector(sel);

  if (a >= 1e9) return s + 'Rp' + (a / 1e9).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' M';
  if (a >= 1e6) return s + 'Rp' + (a / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' jt';
  if (a >= 1e3) return s + 'Rp' + (a / 1e3).toLocaleString('id-ID', { maximumFractionDigits: 0 }) + ' rb';
  return idr(n);
};
const fmtSize = (b) => { b = Number(b) || 0; if (b < 1024) return b + ' B'; if (b < 1048576) return (b / 1024).toFixed(0) + ' KB'; return (b / 1048576).toFixed(1) + ' MB'; };
const timeToMin = (t) => { const m = String(t || '').match(/(\d{1,2})[:.](\d{2})/); return m ? (+m[1]) * 60 + (+m[2]) : null; };
const minToTime = (m) => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;

/** Terbilang bahasa Indonesia untuk kwitansi */
function terbilang(n) {
  n = Math.floor(Math.abs(Number(n) || 0));
  const s = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
  const f = (x) => {
    if (x < 12) return s[x];
    if (x < 20) return f(x - 10) + ' belas';
    if (x < 100) return f(Math.floor(x / 10)) + ' puluh' + (x % 10 ? ' ' + f(x % 10) : '');
    if (x < 200) return 'seratus' + (x - 100 ? ' ' + f(x - 100) : '');
    if (x < 1000) return f(Math.floor(x / 100)) + ' ratus' + (x % 100 ? ' ' + f(x % 100) : '');
    if (x < 2000) return 'seribu' + (x - 1000 ? ' ' + f(x - 1000) : '');
    if (x < 1e6) return f(Math.floor(x / 1000)) + ' ribu' + (x % 1000 ? ' ' + f(x % 1000) : '');
    if (x < 1e9) return f(Math.floor(x / 1e6)) + ' juta' + (x % 1e6 ? ' ' + f(x % 1e6) : '');
    if (x < 1e12) return f(Math.floor(x / 1e9)) + ' miliar' + (x % 1e9 ? ' ' + f(x % 1e9) : '');
    return f(Math.floor(x / 1e12)) + ' triliun' + (x % 1e12 ? ' ' + f(x % 1e12) : '');
  };
  const out = n === 0 ? 'nol' : f(n);
  return (out.charAt(0).toUpperCase() + out.slice(1) + ' rupiah').replace(/\s+/g, ' ');
}

/** Tambah hari kerja (lewati Sabtu & Minggu) */
function addWorkDays(start, n) {
  const d = parseISO(start) || new Date();
  let left = Math.max(0, Math.round(n));
  while (left > 0) {
    d.setDate(d.getDate() + 1);
    const w = d.getDay();
    if (w !== 0 && w !== 6) left--;
  }
  return ymd(d);
}

/** Sanitasi HTML jurnal (whitelist tag sederhana) */
function sanitizeHTML(html) {
  const allowed = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'P', 'BR', 'UL', 'OL', 'LI', 'H3', 'H4', 'BLOCKQUOTE', 'DIV', 'SPAN', 'A']);
  const doc = new DOMParser().parseFromString('<div>' + String(html || '') + '</div>', 'text/html');
  const walk = (node) => {
    Array.from(node.childNodes).forEach((ch) => {
      if (ch.nodeType === 1) {
        if (!allowed.has(ch.tagName)) {
          if (['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT'].includes(ch.tagName)) { ch.remove(); return; }
          const frag = document.createDocumentFragment();
          while (ch.firstChild) frag.appendChild(ch.firstChild);
          ch.replaceWith(frag);
          walk(node);
          return;
        }
        Array.from(ch.attributes).forEach((a) => {
          const keep = ch.tagName === 'A' && a.name === 'href' && /^https?:\/\//i.test(a.value);
          if (!keep) ch.removeAttribute(a.name);
        });
        if (ch.tagName === 'A') { ch.setAttribute('target', '_blank'); ch.setAttribute('rel', 'noopener'); }
        walk(ch);
      } else if (ch.nodeType !== 3) {
        ch.remove();
      }
    });
  };
  walk(doc.body.firstChild);
  return doc.body.firstChild.innerHTML;
}
const stripHTML = (h) => { const d = document.createElement('div'); d.innerHTML = sanitizeHTML(h); return d.textContent || ''; };

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

  r.onload = () => res(String(r.result).split(',')[1] || '');

});

/* ---------------------------------------------------------------------
 * 5. INDEXEDDB (file untuk mode lokal)
 * ------------------------------------------------------------------- */
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('Browser tidak mendukung IndexedDB'));
      const r = indexedDB.open('mph_files', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('files');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async put(id, blob) {
    const db = await this.open();
    return new Promise((res, rej) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').put(blob, id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  },
  async get(id) {
    const db = await this.open();
    return new Promise((res, rej) => { const r = db.transaction('files').objectStore('files').get(id); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  },
  async del(id) {
    const db = await this.open();
    return new Promise((res) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').delete(id); tx.oncomplete = res; tx.onerror = res; });
  }
};

/* ---------------------------------------------------------------------
 * 6. API (Google Apps Script)
 * ------------------------------------------------------------------- */
const Api = {
  /** Jalur HtmlService: google.script.run.apiCall(json) */
  gsr(body) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler((s) => { try { resolve(typeof s === 'string' ? JSON.parse(s) : s); } catch (e) { reject(new Error('Respons server tidak valid.')); } })
        .withFailureHandler((e) => reject(new Error((e && e.message) || String(e))))
        .apiCall(JSON.stringify(body));
    });
  },

  async call(action, payload = {}, opts = {}) {
    const key = opts.key != null ? opts.key : Config.data.key;
    if (EMBEDDED) {
      const j = await this.gsr(Object.assign({ action, key }, payload));
      if (!j || !j.ok) throw new Error((j && j.error) || 'Permintaan gagal.');
      return j;
    }
    const url = opts.url || Config.data.url;
    if (!url) throw new Error('URL Web App belum diisi. Buka Pengaturan > Koneksi.');
    let res;
    try {
      res = await fetch(url, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action, key }, payload))
      });
    } catch (e) {
      throw new Error('Tidak dapat menghubungi server. Periksa internet dan URL Web App (harus berakhiran /exec).');
    }
    const text = await res.text();
    let j;
    try { j = JSON.parse(text); } catch (e) {
      throw new Error('Respons server bukan JSON. Pastikan deploy Web App dengan akses "Anyone" dan gunakan URL /exec terbaru.');
    }
    if (!j.ok) throw new Error(j.error || 'Permintaan gagal.');
    return j;
  },
  async get(url, params) {
    if (EMBEDDED) return this.gsr(params);
    const q = new URLSearchParams(params).toString();
    const res = await fetch(url + (url.includes('?') ? '&' : '?') + q, { redirect: 'follow' });
    return res.json();
  }
};

/* ---------------------------------------------------------------------
 * 7. STORE — satu pintu untuk semua data (lokal / Google Sheets)
 * ------------------------------------------------------------------- */
const Store = {
  LOCAL_KEY: 'mph_data_v1',
  CACHE_KEY: 'mph_cache_v1',
  data: {},
  meta: {},
  services: {},
  status: 'local',      // local | busy | ok | err
  lastSync: null,
  lastError: '',
  queue: Promise.resolve(),
  pending: 0,

  emptyData() { const d = {}; Object.keys(SCHEMA).forEach((k) => { d[k] = []; }); return d; },
  isRemote() { return Config.data.mode === 'gas' && !!Config.data.url; },
  needsKey() { return this.isRemote() && !Config.data.key && !(EMBEDDED && BOOT.owner); },
  bound(name) { return !!(this.meta.bound && this.meta.bound[name]); },

  coerce(h, v) {
    if (NUMERIC.has(h)) return (v === '' || v == null) ? '' : toNum(v);
    if (BOOLEAN.has(h)) return toBool(v);
    return v == null ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
  },
  normalizeRow(sheet, r) {
    const o = {};
    SCHEMA[sheet].forEach((h) => { o[h] = this.coerce(h, r[h]); });
    o.id = String(r.id || uid());
    return o;
  },
  setAll(raw) {
    const d = this.emptyData();
    Object.keys(SCHEMA).forEach((k) => { d[k] = (raw && Array.isArray(raw[k]) ? raw[k] : []).map((r) => this.normalizeRow(k, r)); });
    this.data = d;
  },

  async init() {
    if (this.needsKey()) {
      this.setAll({}); this.status = 'err'; this.lastError = 'API key belum diisi.';
      return;
    }
    if (this.isRemote()) {
      try { const c = JSON.parse(localStorage.getItem(this.CACHE_KEY) || 'null'); if (c && c.data) { this.setAll(c.data); this.services = c.services || {}; this.meta = c.meta || {}; } else this.setAll({}); } catch (e) { this.setAll({}); }
      await this.pull();
    } else {
      try { this.setAll(JSON.parse(localStorage.getItem(this.LOCAL_KEY) || '{}')); } catch (e) { this.setAll({}); }
      this.status = 'local';
    }
  },

  async pull() {
    if (!this.isRemote()) { this.status = 'local'; return; }
    this.status = 'busy'; UI.syncChip();
    try {
      const j = await Api.call('bootstrap');
      this.setAll(j.data);
      this.services = j.services || {};
      this.meta = j.meta || {};
      this.status = 'ok'; this.lastSync = new Date(); this.lastError = '';
      this.saveCache();
    } catch (e) {
      this.status = 'err'; this.lastError = e.message;
      UI.toast('Gagal memuat dari Google Sheets: ' + e.message, 'err', 7000);
    }
    UI.syncChip();
  },

  saveLocal() {
    try { localStorage.setItem(this.LOCAL_KEY, JSON.stringify(this.data)); } catch (e) { UI.toast('Penyimpanan browser penuh. Ekspor cadangan lalu kurangi data.', 'err'); }
  },
  saveCache() {
    try { localStorage.setItem(this.CACHE_KEY, JSON.stringify({ data: this.data, services: this.services, meta: this.meta, at: Date.now() })); } catch (e) { /* cache opsional */ }
  },

  all(sheet) { return this.data[sheet] || []; },
  get(sheet, id) { return this.all(sheet).find((r) => r.id === String(id)) || null; },
  where(sheet, f) { return this.all(sheet).filter(f); },

  settings() {
    const o = Object.assign({}, DEFAULT_SETTINGS);
    this.all('Settings').forEach((r) => { o[r.id] = r.value; });
    return o;
  },

  /** Menerapkan op ke data di memori. */
  applyLocal(ops) {
    const now = new Date().toISOString().slice(0, 19);
    ops.forEach((op) => {
      const list = this.data[op.sheet];
      if (!list) throw new Error('Tabel tidak dikenal: ' + op.sheet);
      if (op.op === 'create') {
        const row = this.normalizeRow(op.sheet, Object.assign({}, op.row, { createdAt: op.row.createdAt || now, updatedAt: now }));
        op.row.id = row.id;
        list.push(row);
      } else if (op.op === 'update' || op.op === 'upsert') {
        const id = String(op.id || op.row.id);
        const r = list.find((x) => x.id === id);
        if (r) {
          Object.keys(op.row || {}).forEach((k) => { if (k !== 'id' && SCHEMA[op.sheet].includes(k)) r[k] = this.coerce(k, op.row[k]); });
          r.updatedAt = now;
        } else if (op.op === 'upsert') {
          list.push(this.normalizeRow(op.sheet, Object.assign({}, op.row, { id, createdAt: now, updatedAt: now })));
        }
      } else if (op.op === 'delete') {
        const i = list.findIndex((x) => x.id === String(op.id));
        if (i >= 0) list.splice(i, 1);
      }
    });
  },

  /**
   * Simpan perubahan. ops: [{op, sheet, id?, row?}]
   * Optimistic: UI langsung berubah; di mode Google Sheets permintaan dikirim berurutan.
   */
  commit(ops, { silent = false } = {}) {
    ops = ops.filter(Boolean);
    if (ops.some((op) => op.op === 'delete' && PROTECTED.has(op.sheet))) {
      UI.toast('Data dasar tidak boleh dihapus. Nonaktifkan saja bila tidak dipakai.', 'err');
      return Promise.resolve({ ok: false, error: 'protected' });
    }
    if (!ops.length) return Promise.resolve({ ok: true });
    ops.forEach((op) => {
      if (op.op === 'create') { op.row = Object.assign({}, op.row); if (!op.row.id) op.row.id = uid(); }
      if (op.op === 'update' || op.op === 'upsert') op.row = Object.assign({}, op.row || {});
    });
    this.applyLocal(ops);
    if (!this.isRemote()) {
      this.saveLocal();
      App.refresh();
      return Promise.resolve({ ok: true });
    }
    this.saveCache();
    App.refresh();
    this.pending++;
    this.status = 'busy'; UI.syncChip();
    const payload = ops.map((op) => ({ op: op.op, sheet: op.sheet, id: op.id, row: op.row, noCal: !!op.noCal }));
    const p = this.queue.then(() => Api.call('batch', { ops: payload })).then((j) => {
      (j.patches || []).forEach((pt) => { const r = this.get(pt.sheet, pt.id); if (r) r.gcalId = pt.gcalId; });
      if (ops.some((op) => op.sheet === 'Schedule')) return this.pull().then(() => { App.refresh(); return j; });
      if (j.warnings && j.warnings.length) UI.toast('Tersimpan. Catatan kalender: ' + j.warnings[0], '', 6000);
      else if (!silent) UI.flashSaved();
      this.lastSync = new Date(); this.lastError = '';
      this.saveCache();
      return j;
    }).catch(async (e) => {
      this.lastError = e.message;
      UI.toast('Gagal menyimpan ke Google Sheets: ' + e.message + ' — data dimuat ulang.', 'err', 8000);
      await this.pull();
      App.refresh();
      return { ok: false, error: e.message };
    }).finally(() => {
      this.pending--;
      if (this.pending <= 0) { this.pending = 0; if (this.status === 'busy') this.status = this.lastError ? 'err' : 'ok'; }
      UI.syncChip();
    });
    this.queue = p;
    return p;
  },

  /* helper ringkas */
  create(sheet, row, opt) { const r = Object.assign({ id: uid() }, row); return this.commit([{ op: 'create', sheet, row: r }], opt).then(() => r); },
  update(sheet, id, row, opt) { return this.commit([{ op: 'update', sheet, id, row }], opt); },
  remove(sheet, id, opt) { return this.commit([{ op: 'delete', sheet, id }], opt); },
  saveSettings(obj) {
    return this.commit(Object.keys(obj).map((k) => ({ op: 'upsert', sheet: 'Settings', id: k, row: { id: k, value: String(obj[k] == null ? '' : obj[k]) } })));
  }
};

/* ---------------------------------------------------------------------
 * 9. UI HELPERS
 * ------------------------------------------------------------------- */
const UI = {
  modals: [],

  toast(msg, type = '', ms = 3200) {
    const root = $('#toast-root');
    if (!root) return;
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.setAttribute('role', type === 'err' ? 'alert' : 'status');
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }, ms);
  },
  flashSaved: debounce(() => UI.toast('Tersinkron ke Google Sheets', 'ok', 1600), 400),

  syncChip() {
    const el = $('#sync-chip');
    if (!el) return;
    const st = Config.data.mode === 'gas' ? Store.status : 'local';
    const label = { local: 'Mode lokal', busy: 'Menyinkronkan…', ok: 'Tersinkron', err: 'Gagal sinkron' }[st] || 'Mode lokal';
    el.innerHTML = `<span class="led ${st === 'ok' ? 'ok' : st === 'busy' ? 'busy' : st === 'err' ? 'err' : 'local'}"></span><span class="lbl">${label}</span>`;
    el.title = st === 'err' ? Store.lastError : (Store.lastSync ? 'Sinkron terakhir ' + Store.lastSync.toLocaleTimeString('id-ID') : 'Data tersimpan di browser ini');
  },

  modal({ title = '', body = '', foot = '', size = '', onMount = null, onClose = null, cls = '' }) {
    const root = $('#modal-root');
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = `<div class="modal ${size} ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="Tutup">${ic('x')}</button></div>
      <div class="modal-body">${body}</div>
      ${foot ? `<div class="modal-foot">${foot}</div>` : ''}</div>`;
    root.appendChild(ov);
    const m = { el: ov, box: ov.firstElementChild, onClose, close: () => UI.closeModal(m) };
    this.modals.push(m);
    ov.addEventListener('mousedown', (e) => { if (e.target === ov) m.close(); });
    ov.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) m.close(); });
    if (onMount) onMount(m.box, m);
    const f = ov.querySelector('input:not([type=hidden]):not([type=checkbox]), select, textarea, [contenteditable]');
    if (f && !('ontouchstart' in window)) setTimeout(() => f.focus(), 30);
    return m;
  },
  closeModal(m) {
    const i = this.modals.indexOf(m);
    if (i < 0) return;
    this.modals.splice(i, 1);
    m.el.remove();
    if (m.onClose) m.onClose();
  },
  closeAll() { [...this.modals].forEach((m) => m.close()); },

  confirm(message, { ok = 'Ya, lanjutkan', danger = false, title = 'Konfirmasi' } = {}) {
    return new Promise((resolve) => {
      let done = false;
      const m = UI.modal({
        title, size: 'narrow',
        body: `<p style="margin:0">${message}</p>`,
        foot: `<button class="btn" data-close>Batal</button><button class="btn ${danger ? 'danger solid' : 'primary'}" data-ok>${esc(ok)}</button>`,
        onClose: () => { if (!done) resolve(false); },
        onMount: (box) => { box.querySelector('[data-ok]').addEventListener('click', () => { done = true; resolve(true); m.close(); }); }
      });
    });
  },

  /* -------- FORM BUILDER -------- */
  fieldHTML(f, v) {
    if (f.t === 'section') return `<div class="section-t">${esc(f.l)}</div>`;
    if (f.t === 'html') return `<div class="field ${f.full ? 'full' : ''}">${f.html || ''}</div>`;
    const id = 'f_' + f.k;
    const req = f.req ? ' <span class="req">*</span>' : '';
    const full = f.full || f.t === 'textarea' ? 'full' : '';
    const hint = f.hint ? `<div class="hint">${f.hint}</div>` : '';
    const val = v == null ? '' : v;
    const common = `id="${id}" name="${f.k}" ${f.req ? 'required' : ''} ${f.ro ? 'readonly' : ''}`;
    let input = '';
    switch (f.t) {
      case 'select': {
        const opts = (typeof f.o === 'function' ? f.o() : f.o || []).map((o) => {
          const [ov, ol] = Array.isArray(o) ? o : [o, o];
          return `<option value="${esc(ov)}" ${String(ov) === String(val) ? 'selected' : ''}>${esc(ol)}</option>`;
        }).join('');
        input = `<select class="select" ${common}>${f.empty ? `<option value="">${esc(f.empty)}</option>` : ''}${opts}</select>`;
        break;
      }
      case 'textarea': input = `<textarea class="input" ${common} rows="${f.rows || 3}" placeholder="${esc(f.ph || '')}">${esc(val)}</textarea>`; break;
      case 'checkbox': return `<div class="field ${f.full ? 'full' : ''}"><label class="checkline"><input type="checkbox" class="check" ${common} ${toBool(val) ? 'checked' : ''}> ${esc(f.l)}</label>${hint}</div>`;
      case 'money': input = `<input class="input num" inputmode="numeric" data-money ${common} value="${val === '' ? '' : Number(val).toLocaleString('id-ID')}" placeholder="0">`; break;
      case 'days': {
        const sel = String(val || '').split(',').filter(Boolean);
        input = `<div class="days-pick" id="${id}" data-days="${f.k}">${[1, 2, 3, 4, 5, 6, 7].map((d) => `<label><input type="checkbox" value="${d}" ${sel.includes(String(d)) ? 'checked' : ''}>${HARI[d % 7].slice(0, 3)}</label>`).join('')}</div>`;
        break;
      }
      default: {
        const type = { number: 'number', date: 'date', time: 'time', email: 'email', tel: 'tel', url: 'url' }[f.t] || 'text';
        const list = f.list ? `list="dl_${f.k}"` : '';
        const dl = f.list ? `<datalist id="dl_${f.k}">${(typeof f.list === 'function' ? f.list() : f.list).map((x) => `<option value="${esc(x)}">`).join('')}</datalist>` : '';
        input = `<input class="input" type="${type}" ${common} ${list} value="${esc(val)}" ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} ${f.step ? `step="${f.step}"` : ''} placeholder="${esc(f.ph || '')}">${dl}`;
      }
    }
    return `<div class="field ${full}" data-field="${f.k}"><label for="${id}">${esc(f.l)}${req}</label>${input}${hint}</div>`;
  },

  readForm(box, fields) {
    const out = {};
    fields.forEach((f) => {
      if (!f.k || f.t === 'section' || f.t === 'html') return;
      if (f.t === 'days') {
        out[f.k] = $$(`[data-days="${f.k}"] input:checked`, box).map((i) => i.value).join(',');
        return;
      }
      const el = box.querySelector(`[name="${f.k}"]`);
      if (!el) return;
      if (f.t === 'checkbox') out[f.k] = el.checked;
      else if (f.t === 'money') out[f.k] = el.value.trim() === '' ? 0 : toNum(el.value.replace(/\./g, '').replace(/,/g, '.'));
      else if (f.t === 'number') out[f.k] = el.value === '' ? '' : Number(el.value);
      else out[f.k] = el.value.trim();
    });
    return out;
  },

  form({ title, fields, values = {}, submit = 'Simpan', onSubmit, size = '', extraFoot = '', onChange = null, onMount = null, note = '' }) {
    const body = `${note ? `<div class="note mb">${note}</div>` : ''}<form class="form" novalidate>${fields.map((f) => this.fieldHTML(f, values[f.k] !== undefined ? values[f.k] : f.def)).join('')}<button type="submit" hidden></button></form>`;
    let busy = false;
    const m = this.modal({
      title, size, body,
      foot: `${extraFoot}<button class="btn" data-close>Batal</button><button class="btn primary" data-submit>${esc(submit)}</button>`,
      onMount: (box, mm) => {
        const form = box.querySelector('form');
        const doSubmit = async () => {
          if (busy) return;
          let bad = null;
          $$('.field.err', form).forEach((x) => x.classList.remove('err'));
          fields.forEach((f) => {
            if (!f.req || !f.k) return;
            const vals = this.readForm(box, [f]);
            const v = vals[f.k];
            if (v === '' || v == null || (f.t === 'money' && !(v > 0) && !f.allowZero)) {
              const fe = box.querySelector(`[data-field="${f.k}"]`);
              if (fe) fe.classList.add('err');
              bad = bad || f;
            }
          });
          if (bad) { UI.toast(`Kolom "${bad.l}" wajib diisi.`, 'err'); return; }
          const vals = this.readForm(box, fields);
          busy = true;
          const btn = box.querySelector('[data-submit]');
          if (btn) btn.disabled = true;
          try {
            const r = await onSubmit(vals, box, mm);
            if (r !== false) mm.close();
          } catch (e) {
            UI.toast(e.message || String(e), 'err', 6000);
          } finally {
            busy = false;
            if (btn) btn.disabled = false;
          }
        };
        box.querySelector('[data-submit]').addEventListener('click', doSubmit);
        form.addEventListener('submit', (e) => { e.preventDefault(); doSubmit(); });
        box.addEventListener('input', (e) => {
          if (e.target.matches('[data-money]')) {
            const raw = e.target.value.replace(/\D/g, '');
            e.target.value = raw ? Number(raw).toLocaleString('id-ID') : '';
          }
        });
        if (onChange) {
          const h = (e) => onChange(this.readForm(box, fields), box, e);
          box.addEventListener('change', h);
          box.addEventListener('input', debounce(h, 200));
        }
        if (onMount) onMount(box, mm);
      }
    });
    return m;
  },

  setField(box, k, v) {
    const el = box.querySelector(`[name="${k}"]`);
    if (!el) return;
    if (el.type === 'checkbox') el.checked = !!v;
    else if (el.hasAttribute('data-money')) el.value = v ? Number(v).toLocaleString('id-ID') : '';
    else el.value = v == null ? '' : v;
  },

  badge(text, color = '') { return `<span class="badge ${color ? 'b-' + color : ''}">${esc(text)}</span>`; },

  dueBadge(date, doneLabel) {
    if (doneLabel) return UI.badge(doneLabel, 'jade');
    if (!date) return '<span class="muted">—</span>';
    const d = diffDays(todayISO(), date);
    if (d < 0) return UI.badge(`Lewat ${-d} hari`, 'coral');
    if (d === 0) return UI.badge('Hari ini', 'coral');
    if (d === 1) return UI.badge('Besok (H-1)', 'amber');
    if (d <= 3) return UI.badge(`H-${d}`, 'amber');
    if (d <= 7) return UI.badge(`${d} hari lagi`, 'sky');
    return UI.badge(`${d} hari lagi`);
  },

  progress(p, cls = '') { return `<div class="progress ${cls}" title="${Math.round(p)}%"><i style="width:${clamp(p, 0, 100)}%"></i></div>`; },

  empty(title, text = '', btn = '') { return `<div class="empty"><b>${esc(title)}</b>${esc(text)}${btn ? `<div>${btn}</div>` : ''}</div>`; },

  table(cols, rows, { foot = '', emptyMsg = 'Belum ada data.' } = {}) {
    if (!rows.length) return UI.empty(emptyMsg);
    return `<div class="table-wrap"><table class="tbl"><thead><tr>${cols.map((c) => `<th class="${c.cls || ''}">${esc(c.h)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map((r) => `<tr>${cols.map((c) => `<td class="${c.cls || ''}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody>${foot ? `<tfoot>${foot}</tfoot>` : ''}</table></div>`;
  }
};

  tick() {

  open(mod, sub) {
    if (mod !== 'home' && !MODULES[mod]) return;
    if (!this.tabs.includes(mod)) this.tabs.push(mod);
    this.active = mod;
    if (sub) this.sub[mod] = sub;
    $('#shell') && $('#shell').classList.remove('mobile-open');
    this.refresh();
    const ws = $('#workspace');
    if (ws) ws.scrollIntoView({ block: 'start', behavior: 'instant' in window ? 'instant' : 'auto' });
    window.scrollTo(0, 0);
  },

  closeTab(mod) {
    if (mod === 'home') return;
    const i = this.tabs.indexOf(mod);
    if (i < 0) return;
    this.tabs.splice(i, 1);
    if (this.active === mod) this.active = this.tabs[Math.max(0, i - 1)] || 'home';
    this.refresh();
  },

  destroyCharts() { this.charts.forEach((c) => { try { c.destroy(); } catch (e) { } }); this.charts = []; },

  refresh() {
    if (!this.mounted) return;
    // simpan fokus input agar pencarian tidak kehilangan kursor
    const ae = document.activeElement;
    const focusKey = ae && ae.dataset ? ae.dataset.fk : null;
    const caret = focusKey && typeof ae.selectionStart === 'number' ? ae.selectionStart : null;

    this.destroyCharts();
    this.renderTabs();
    this.renderNav();
    const ws = $('#workspace');
    try {
      if (this.active === 'home') {
        ws.className = 'workspace';
        ws.innerHTML = Home.render();
        Home.after && Home.after();
      } else {
        const mod = this.active, M = MODULES[mod];
        const sub = this.sub[mod] && M.subs.some((s) => s[0] === this.sub[mod]) ? this.sub[mod] : M.subs[0][0];

        const view = (VIEWS[mod] || {})[sub];
        ws.className = 'workspace m-' + mod;
        ws.innerHTML = `
          <div class="win-head">
            <div class="win-title"><div class="mod-ico">${ic(M.icon)}</div><div><h1>${esc(M.title)}</h1><p>${esc(M.desc)}</p></div></div>

        if (view && view.after) view.after();
      }
    } catch (e) {
      console.error(e);
      ws.innerHTML = `<div class="win-body"><div class="note warn">Terjadi kesalahan saat menampilkan halaman: ${esc(e.message)}</div></div>`;

    this.renderBell();
    this.renderGwChip();
    const tb = $('#theme-btn');
    if (tb) tb.innerHTML = ic(document.documentElement.dataset.theme === 'dark' ? 'sun' : 'moon');
    if (focusKey) {
      const el = document.querySelector(`[data-fk="${focusKey}"]`);
      if (el) { el.focus(); if (caret != null && el.setSelectionRange) try { el.setSelectionRange(caret, caret); } catch (e) { } }
    }
  },

  renderTabs() {
    const tb = $('#tabbar');
    if (!tb) return;
    tb.innerHTML = this.tabs.map((t) => {
      const on = t === this.active ? 'on' : '';

      return `<div class="wtab m-${t} ${on}" data-act="open" data-mod="${t}" role="tab">${ic(MODULES[t].icon)}${esc(MODULES[t].short)}<button class="x" data-act="closeTab" data-mod="${t}" aria-label="Tutup jendela ${esc(MODULES[t].short)}">${ic('x')}</button></div>`;
    }).join('');

  renderNav() {

  },

  renderBell() {
    const b = $('#bell');
    if (!b) return;
    const n = Alerts.compute().filter((a) => a.level !== 'info').length;
    b.innerHTML = ic('bell') + (n ? `<span class="badge-dot">${n > 99 ? '99+' : n}</span>` : '');

  renderGwChip() {

/* ---------------------------------------------------------------------
 * 11. NOTIFIKASI / ALERT (deadline, cicilan, sesi hari ini)
 * ------------------------------------------------------------------- */
const Alerts = {
  compute() {
    const t = todayISO();
    const out = [];
    const push = (level, text, sub, mod, subTab, order) => out.push({ level, text, sub, mod, subTab, order });
    Store.all('Projects').forEach((p) => {
      if (!p.deadline || ['Selesai', 'Batal'].includes(p.status)) return;
      const d = diffDays(t, p.deadline);
      if (d < 0) push('danger', `Project ${p.code || ''} ${p.clientName} terlambat ${-d} hari`, `${p.service} — progres ${Math.round(p.progress || 0)}%`, 'project', 'daftar', d);
      else if (d <= 3) push('warn', `Deadline project ${p.clientName} ${d === 0 ? 'hari ini' : 'H-' + d}`, `${p.service} — progres ${Math.round(p.progress || 0)}%`, 'project', 'daftar', d);
    });
    const loans = Object.fromEntries(Store.all('Loans').map((l) => [l.id, l]));
    Store.all('LoanInstallments').forEach((i) => {
      if (i.status === 'Lunas' || !i.dueDate) return;
      const d = diffDays(t, i.dueDate);
      const name = (loans[i.loanId] || {}).creditor || 'Pinjaman';
      if (d < 0) push('danger', `Cicilan ${name} ke-${i.no} lewat ${-d} hari`, idr(i.amount), 'finance', 'pinjaman', d);
      else if (d <= 5) push('warn', `Cicilan ${name} ke-${i.no} ${d === 0 ? 'jatuh tempo hari ini' : 'H-' + d}`, idr(i.amount) + ' — ' + fmtDate(i.dueDate), 'finance', 'pinjaman', d);
    });
    Store.all('Deadlines').forEach((d) => {
      if (!d.deadline || d.status === 'Done') return;
      const n = diffDays(t, d.deadline);
      if (n < 0) push('danger', `Deadline dinas "${d.title}" lewat ${-n} hari`, d.type || '', 'school', 'deadline', n);
      else if (n <= 3) push('warn', `Deadline dinas "${d.title}" ${n === 0 ? 'hari ini' : 'H-' + n}`, d.type || '', 'school', 'deadline', n);
    });
    Store.all('Assignments').forEach((a) => {
      if (!a.deadline || ['Selesai', 'Dinilai'].includes(a.status)) return;
      const d = diffDays(t, a.deadline);
      if (d < 0) push('danger', `Tugas "${a.title}" lewat ${-d} hari`, `${a.className || ''} ${a.subject || ''}`, 'school', 'tugas', d);
      else if (d <= 3) push('warn', `Deadline "${a.title}" ${d === 0 ? 'hari ini' : 'H-' + d}`, `${a.className || ''} ${a.subject || ''}`, 'school', 'tugas', d);
    });
    const cls = Object.fromEntries(Store.all('TutorClasses').map((c) => [c.id, c]));
    Store.all('TutorSessions').forEach((s) => {
      if (s.date === t && s.status === 'Terjadwal') push('info', `Sesi ${(cls[s.classId] || {}).name || 'kelas'} ke-${s.no} hari ini`, `${s.start || ''}${s.end ? '–' + s.end : ''}`, 'tutor', 'sesi', 0);
    });
    Store.all('Agenda').forEach((a) => {
      if (a.date === t && a.status !== 'Batal' && a.status !== 'Selesai') push('info', `Agenda: ${a.title}`, `${a.start || 'Sepanjang hari'}${a.end ? '–' + a.end : ''}`, 'school', 'jadwal', 0);
    });
    Store.all('Projects').forEach((p) => {
      if (p.status !== 'Selesai') return;
      const rem = Fin.projectRemaining(p);
      if (rem > 0) push('warn', `Piutang ${p.clientName} belum lunas`, `Sisa ${idr(rem)} — ${p.code || ''}`, 'project', 'bayar', 50);
    });
    const rank = { danger: 0, warn: 1, info: 2 };
    return out.sort((a, b) => rank[a.level] - rank[b.level] || a.order - b.order);
  },

  show() {
    const old = $('#notif-pop');
    if (old) { old.remove(); return; }
    const list = this.compute();
    const el = document.createElement('div');
    el.className = 'pop'; el.id = 'notif-pop';
    el.innerHTML = `<h4>Perlu perhatian (${list.length})</h4>` + (list.length ? list.map((a) =>
      `<div class="alert ${a.level}" data-act="open" data-mod="${a.mod}" data-sub="${a.subTab}"><span class="bar"></span><div><div class="t">${esc(a.text)}</div><div class="s">${esc(a.sub || '')}</div></div></div>`).join('')
      : `<div class="empty" style="margin:6px"><b>Semua aman</b>Tidak ada deadline atau tagihan mendesak.</div>`);
    document.body.appendChild(el);
    setTimeout(() => {
      const off = (e) => { if (!el.contains(e.target) && !e.target.closest('#bell')) { el.remove(); document.removeEventListener('mousedown', off); } };
      document.addEventListener('mousedown', off);
      el.addEventListener('click', () => el.remove());
    }, 0);
  }
};

/* ---------------------------------------------------------------------
 * 12. COMMAND PALETTE (Ctrl+K)
 * ------------------------------------------------------------------- */
const Palette = {
  open() {
    if ($('#palette')) return;
    const ov = document.createElement('div');
    ov.className = 'overlay'; ov.id = 'palette';
    ov.innerHTML = `<div class="palette" role="dialog" aria-label="Pencarian cepat"><input placeholder="Cari data atau ketik perintah… (mis. transaksi, project, cicilan)" aria-label="Kata kunci"><div class="pal-list"></div>
      <div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> pilih</span><span><kbd>Enter</kbd> buka</span><span><kbd>Esc</kbd> tutup</span></div></div>`;
    document.body.appendChild(ov);
    const input = ov.querySelector('input');
    const listEl = ov.querySelector('.pal-list');
    let items = [], sel = 0;
    const close = () => ov.remove();
    const render = () => {
      items = this.search(input.value);
      sel = Math.min(sel, Math.max(0, items.length - 1));
      let g = '';
      listEl.innerHTML = items.length ? items.map((it, i) => {
        const head = it.g !== g ? `<div class="pal-group">${esc(it.g)}</div>` : '';
        g = it.g;
        return `${head}<div class="pal-item ${i === sel ? 'sel' : ''}" data-i="${i}">${ic(it.icon || 'search')}<span>${esc(it.t)}</span><span class="s">${esc(it.s || '')}</span></div>`;
      }).join('') : `<div class="empty" style="margin:8px"><b>Tidak ditemukan</b>Coba kata lain: nama klien, kategori, kreditur, nama file.</div>`;
      const s = listEl.querySelector('.pal-item.sel');
      if (s) s.scrollIntoView({ block: 'nearest' });
    };
    const run = (i) => { const it = items[i]; if (!it) return; close(); it.run(); };
    input.addEventListener('input', () => { sel = 0; render(); });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(items.length - 1, sel + 1); render(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); render(); }
      else if (e.key === 'Enter') { e.preventDefault(); run(sel); }
      else if (e.key === 'Escape') { close(); }
    });
    listEl.addEventListener('click', (e) => { const it = e.target.closest('.pal-item'); if (it) run(+it.dataset.i); });
    ov.addEventListener('mousedown', (e) => { if (e.target === ov) close(); });
    render();
    input.focus();
  },

  search(q) {
    q = q.trim().toLowerCase();
    const out = [];
    const match = (...xs) => !q || xs.some((x) => String(x || '').toLowerCase().includes(q));
    const cmds = [
      ['Buka Beranda', 'home', () => App.open('home')],
      ...Object.keys(MODULES).map((k) => [`Buka ${MODULES[k].title}`, MODULES[k].icon, () => App.open(k)]),
      ['Tambah transaksi', 'plus', () => { App.open('finance', 'kas'); Finance.txnForm(); }],
      ['Tambah project baru', 'plus', () => { App.open('project', 'daftar'); Project.form(); }],
      ['Tambah kelas bimbel / les', 'plus', () => { App.open('tutor', 'kelas'); Tutor.form(); }],
      ['Tambah pinjaman', 'plus', () => { App.open('finance', 'pinjaman'); Finance.loanForm(); }],
      ['Tambah tugas / ujian', 'plus', () => { App.open('school', 'tugas'); School.assignForm(); }],
      ['Tambah agenda', 'plus', () => { App.open('school', 'jadwal'); School.agendaForm(); }],
      ['Tulis jurnal hari ini', 'journal', () => { App.open('journal', 'jurnal'); Journal.newEntry(); }],
      ['Upload file', 'upload', () => { App.open('files'); Files.pick('umum'); }],
      ['Impor dari Excel', 'upload', () => Excel.importDialog()],
      ['Ekspor semua data (Excel)', 'download', () => Excel.exportAll()],
      ['Pengaturan & koneksi Google', 'settings', () => Settings.open()],
      ['Ganti tema terang / gelap', 'moon', () => ACT.theme()]
    ];
    cmds.forEach(([t, icon, run]) => { if (match(t)) out.push({ g: 'Perintah', t, icon, run }); });
    if (q.length >= 2) {
      const add = (g, icon, list, fT, fS, fRun, fields) => {
        list.filter((r) => match(...fields(r))).slice(0, 6).forEach((r) => out.push({ g, icon, t: fT(r), s: fS(r), run: () => fRun(r) }));
      };
      add('Project', 'project', Store.all('Projects'), (p) => `${p.code || ''} ${p.clientName}`, (p) => `${p.service} — ${p.status}`, (p) => { App.open('project', 'daftar'); Project.detail(p.id); }, (p) => [p.code, p.clientName, p.campus, p.service, p.clientEmail]);
      add('Transaksi', 'finance', Store.all('Transactions').slice().sort((a, b) => b.date.localeCompare(a.date)), (t) => `${t.description || t.category}`, (t) => `${fmtDate(t.date)} ${t.type === 'income' ? '+' : '−'}${idr(t.amount)}`, (t) => { App.open('finance', 'kas'); Finance.txnForm(t.id); }, (t) => [t.description, t.category, String(t.amount)]);
      add('Pinjaman', 'wallet', Store.all('Loans'), (l) => l.creditor, (l) => `Plafon ${idr(l.principal)} — ${l.status}`, () => App.open('finance', 'pinjaman'), (l) => [l.creditor, l.note]);
      add('Kelas tutor', 'tutor', Store.all('TutorClasses'), (c) => c.name, (c) => `${c.tutorType} — ${c.clientName}`, (c) => { App.s('tutor').classId = c.id; App.open('tutor', 'sesi'); }, (c) => [c.name, c.clientName, c.institution, c.tutorType]);
      add('Tugas & ujian', 'school', Store.all('Assignments'), (a) => a.title, (a) => `${a.className} — ${fmtDate(a.deadline)}`, (a) => { App.open('school', 'tugas'); School.assignForm(a.id); }, (a) => [a.title, a.className, a.subject]);
      add('Agenda', 'calendar', Store.all('Agenda'), (a) => a.title, (a) => fmtDate(a.date), (a) => { App.open('school', 'jadwal'); School.agendaForm(a.id); }, (a) => [a.title, a.type, a.location]);
      add('File', 'file', Store.all('Files'), (f) => f.name, (f) => `${f.module} — ${fmtSize(f.size)}`, (f) => Files.openFile(f.id), (f) => [f.name, f.module, f.note]);
      add('Jurnal', 'journal', Store.all('Journal'), (j) => j.title || fmtDate(j.date), (j) => fmtDate(j.date), (j) => { App.s('journal').current = j.id; App.open('journal', 'jurnal'); }, (j) => [j.title, j.tags, stripHTML(j.content)]);
    }
    return out.slice(0, 40);
  }
};

  async handle(act, box, m) {
    const remote = Store.isRemote();
    const msg = box.querySelector('#s_conn_msg');
    switch (act) {
      case 'test': {
        const url = EMBEDDED ? Config.data.url : box.querySelector('#s_url').value.trim(), key = box.querySelector('#s_key').value.trim();
        msg.className = 'note mt'; msg.textContent = 'Menghubungi server…';
        const j = await Api.call('bootstrap', {}, { url, key });
        const n = Object.values(j.data || {}).reduce((s, a) => s + a.length, 0);
        msg.className = 'note ok mt'; msg.textContent = `Berhasil. Server versi ${j.version}, ${n} baris data, akun ${j.services && j.services.owner ? j.services.owner : '-'}.`;
        break;
      }
      case 'saveConn': {
        const mode = EMBEDDED ? 'gas' : box.querySelector('#s_mode').value;
        const url = EMBEDDED ? Config.data.url : box.querySelector('#s_url').value.trim(), key = box.querySelector('#s_key').value.trim();
        if (mode === 'gas') {
          if (!EMBEDDED && !/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) throw new Error('URL harus diawali https://script.google.com/…');
          if (!key && !(EMBEDDED && BOOT.owner)) throw new Error('API key wajib diisi.');
          await Api.call('bootstrap', {}, { url, key });
        }
        Object.assign(Config.data, { mode, url, key });
        Config.save();
        m.close();
        UI.toast(mode === 'gas' ? 'Menghubungkan ke Google Sheets…' : 'Beralih ke mode lokal');
        await Store.init();
        App.refresh();
        break;
      }
      case 'saveProfile': {
        const v = this.read(box, ['ownerName', 'ownerEmail', 'ownerWa', 'businessName', 'bankInfo', 'invoiceNote', 'schoolName', 'jpMinutes', 'semesterStart', 'semesterEnd', 'jpTarget']);
        if (v.ownerEmail && !validEmail(v.ownerEmail)) throw new Error('Format email tidak valid.');
        await Store.saveSettings(v);
        UI.toast('Profil disimpan', 'ok');
        break;
      }
      case 'saveGoogle': {
        const v = this.read(box, ['calendarSync', 'inviteClients', 'autoSendReceipt', 'digestHour']);
        v.digestHour = String(clamp(parseInt(v.digestHour, 10) || 6, 0, 23));
        await Store.saveSettings(v);
        UI.toast('Pengaturan Google disimpan', 'ok');
        break;
      }
      case 'trigger': { const j = await Api.call('setupTriggers'); Store.services.digest = true; UI.toast(`Ringkasan harian aktif setiap pukul ${j.hour}.00`, 'ok'); m.close(); this.open('google'); break; }
      case 'untrigger': { await Api.call('removeTriggers'); Store.services.digest = false; UI.toast('Ringkasan harian dimatikan'); m.close(); this.open('google'); break; }
      case 'digest': { const j = await Api.call('digestNow'); UI.toast(`Ringkasan dikirim ke ${j.to}`, 'ok'); break; }
      case 'resync': {
        UI.toast('Menyinkronkan kalender… (bisa sampai 1–2 menit)');
        const j = await Api.call('resyncCalendar');
        (j.patches || []).forEach((p) => { const r = Store.get(p.sheet, p.id); if (r) r.gcalId = p.gcalId; });
        Store.saveCache();
        UI.toast(`${j.synced} item diperiksa, ${j.patches.length} event diperbarui${j.warnings.length ? '. Catatan: ' + j.warnings[0] : ''}`, j.warnings.length ? '' : 'ok', 6000);
        break;
      }
      case 'export': Excel.exportAll(); break;
      case 'import': m.close(); Excel.importDialog(); break;
      case 'importFull': m.close(); Excel.importFull(); break;
      case 'demo': {
        if (!(await UI.confirm('Tambahkan data contoh ke database saat ini?', { ok: 'Tambahkan' }))) return;
        m.close(); await Demo.load(); break;
      }
      case 'migrate': {
        let local;
        try { local = JSON.parse(localStorage.getItem(Store.LOCAL_KEY) || '{}'); } catch (e) { local = {}; }
        const ops = [];
        Object.keys(SCHEMA).forEach((sh) => (local[sh] || []).forEach((r) => { if (!Store.get(sh, r.id)) ops.push({ op: 'create', sheet: sh, row: r }); }));
        if (!ops.length) { UI.toast('Tidak ada data lokal baru untuk dikirim.'); return; }
        if (!(await UI.confirm(`Kirim ${ops.length} baris data lokal ke Google Sheets?`, { ok: 'Kirim' }))) return;
        for (let i = 0; i < ops.length; i += 300) await Store.commit(ops.slice(i, i + 300), { silent: true });
        UI.toast(`${ops.length} baris dikirim`, 'ok');
        break;
      }
      case 'wipe': {
        if (!(await UI.confirm('Semua data lokal di browser ini akan dihapus permanen. Lanjutkan?', { ok: 'Hapus semua', danger: true }))) return;
        localStorage.removeItem(Store.LOCAL_KEY);
        Store.setAll({});
        m.close(); App.refresh(); UI.toast('Data lokal dihapus');
        break;
      }
      default: break;
    }
  }
};

function bindGlobalEvents() {
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const fn = ACT[el.dataset.act];
    if (!fn) return;
    if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
    try {
      const r = fn(el.dataset, el, e);
      if (r && typeof r.catch === 'function') r.catch((err) => UI.toast(err.message || String(err), 'err', 6000));
    } catch (err) { console.error(err); UI.toast(err.message || String(err), 'err', 6000); }
  });
  const onChg = (e) => {
    const el = e.target.closest('[data-chg]');
    if (!el) return;
    const fn = CHG[el.dataset.chg];
    if (!fn) return;
    try {
      const r = fn(el.type === 'checkbox' ? el.checked : el.value, el, e);
      if (r && typeof r.catch === 'function') r.catch((err) => UI.toast(err.message || String(err), 'err', 6000));
    } catch (err) { console.error(err); UI.toast(err.message || String(err), 'err'); }
  };
  document.addEventListener('change', (e) => { if (!e.target.matches('[data-live]')) onChg(e); });
  const liveInput = debounce(onChg, 220);
  document.addEventListener('input', (e) => { if (e.target.matches('[data-live]')) liveInput(e); });
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); Palette.open(); return; }
    if (e.key === 'Escape') {
      const pop = $('#notif-pop'); if (pop) { pop.remove(); return; }
      if (UI.modals.length) UI.modals[UI.modals.length - 1].close();
    }
  });
  window.addEventListener('beforeunload', (e) => { if (Store.pending > 0) { e.preventDefault(); e.returnValue = ''; } });
}

const SOURCE_LABEL = { manual: 'Manual', school: 'Sekolah', project: 'Project', tutor: 'Tutor', loan: 'Pinjaman' };
const SOURCE_COLOR = { manual: 'slate', school: 'sky', project: 'violet', tutor: 'amber', loan: 'coral' };

const DEFAULT_CATEGORIES = {
  income: ['Gaji Sekolah', 'Honor', 'Tunjangan', 'Fee Project', 'Honor Tutor', 'Pencairan Pinjaman', 'Pemasukan Lain'],
  expense: ['Kebutuhan Harian', 'Operasional', 'Cicilan', 'Tagihan & Utilitas', 'Keluarga', 'Pendidikan', 'Transportasi', 'Bahan Ajar', 'Tabungan', 'Kesehatan', 'Hiburan', 'Saldo Awal', 'Pengeluaran Lain']
};

const Fin = {
  txns() { return Store.all('Transactions'); },
  signed(t) { return (t.type === 'income' ? 1 : -1) * (Number(t.amount) || 0); },
  balance(upTo) { return sum(this.txns().filter((t) => !upTo || t.date <= upTo), (t) => this.signed(t)); },
  month(mk) {
    const list = this.txns().filter((t) => monthKey(t.date) === mk);
    const inc = list.filter((t) => t.type === 'income');
    const exp = list.filter((t) => t.type === 'expense');
    const loanIn = sum(inc.filter((t) => t.source === 'loan'), (t) => t.amount);
    const income = sum(inc, (t) => t.amount);
    const expense = sum(exp, (t) => t.amount);
    return { list, income, expense, loanIn, incomeOps: income - loanIn, net: income - expense, installments: sum(exp.filter((t) => t.source === 'loan'), (t) => t.amount) };
  },
  projectTotal(p) { return Math.max(0, (Number(p.price) || 0) - (Number(p.discount) || 0)); },
  projectPaid(p) { return sum(this.txns().filter((t) => t.source === 'project' && t.refId === p.id && t.type === 'income'), (t) => t.amount); },
  projectRemaining(p) { return p.status === 'Batal' ? 0 : Math.max(0, this.projectTotal(p) - this.projectPaid(p)); },
  sessionFee(c) {
    const rate = Number(c.rate) || 0;
    if (c.rateType === 'jam') return rate * ((Number(c.durationMin) || 60) / 60);
    if (c.rateType === 'paket') return (Number(c.totalSessions) || 0) ? rate / Number(c.totalSessions) : 0;
    return rate;
  },
  tutorTotal(c) { return c.rateType === 'paket' ? (Number(c.rate) || 0) : this.sessionFee(c) * (Number(c.totalSessions) || 0); },
  tutorPaid(c) { return sum(this.txns().filter((t) => t.source === 'tutor' && t.refId === c.id && t.type === 'income'), (t) => t.amount); },
  tutorRemaining(c) { return c.status === 'Batal' ? 0 : Math.max(0, this.tutorTotal(c) - this.tutorPaid(c)); },
  loanInst(loanId) { return Store.where('LoanInstallments', (i) => i.loanId === loanId).sort((a, b) => a.no - b.no); },
  loanStats(l) {
    const inst = this.loanInst(l.id);
    const paid = inst.filter((i) => i.status === 'Lunas');
    const unpaid = inst.filter((i) => i.status !== 'Lunas');
    return {
      inst, paidCount: paid.length, count: inst.length,
      principalLeft: Math.max(0, (Number(l.principal) || 0) - sum(paid, (i) => i.principalPart)),
      totalLeft: sum(unpaid, (i) => i.amount),
      totalPaid: sum(paid, (i) => i.amount),
      next: unpaid.sort((a, b) => a.dueDate.localeCompare(b.dueDate))[0] || null
    };
  },
  debtLeft() { return sum(Store.all('Loans').filter((l) => l.status !== 'Lunas'), (l) => this.loanStats(l).principalLeft); },
  dueInMonth(mk) { return Store.where('LoanInstallments', (i) => monthKey(i.dueDate) === mk); },
  recurringIncome() { return sum(Store.where('Recurring', (r) => r.active !== false && r.type === 'income'), (r) => r.amount); },
  recurringExpense() { return sum(Store.where('Recurring', (r) => r.active !== false && r.type === 'expense'), (r) => r.amount); },
  debtRatio(mk) {
    const due = sum(this.dueInMonth(mk), (i) => i.amount);
    const m = this.month(mk);
    const base = Math.max(m.incomeOps, this.recurringIncome());
    return { due, base, ratio: base > 0 ? due / base : (due > 0 ? 1 : 0) };
  },
  ratioLabel(r) {
    if (r <= 0.3) return ['Sehat', 'jade'];
    if (r <= 0.4) return ['Waspada', 'amber'];
    return ['Berisiko', 'coral'];
  },
  balanceSeries(days = 30) {
    const t = todayISO();
    let bal = this.balance(addDays(t, -days));
    const byDay = groupBy(this.txns().filter((x) => x.date > addDays(t, -days) && x.date <= t), (x) => x.date);
    const out = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = addDays(t, -i);
      bal += sum(byDay[d] || [], (x) => this.signed(x));
      out.push(bal);
    }
    return out;
  },
  categories(type) {
    const master = Store.where('Categories', (c) => c.active !== false && (!type || c.type === type)).map((c) => c.name);
    const def = [...(type !== 'expense' ? DEFAULT_CATEGORIES.income : []), ...(type !== 'income' ? DEFAULT_CATEGORIES.expense : [])];
    const base = master.length ? master : def;
    const used = this.txns().filter((t) => !type || t.type === type).map((t) => t.category).filter(Boolean);
    return [...new Set([...base, ...used])];
  }
};

function collectEvents(from, to, mods = ['school', 'project', 'tutor', 'finance']) {
  const out = [];
  const inR = (d) => d && d >= from && d <= to;
  if (mods.includes('school')) {
    Store.all('Agenda').forEach((a) => { if (inR(a.date) && a.status !== 'Batal') out.push({ date: a.date, time: a.start, title: a.title, color: 'sky', mod: 'school', sub: 'jadwal', kind: 'Agenda', id: a.id, sheet: 'Agenda' }); });
    Store.all('Deadlines').forEach((d) => { if (inR(d.deadline) && d.status !== 'Done') out.push({ date: d.deadline, time: '', title: `Deadline dinas: ${d.title}`, color: 'coral', mod: 'school', sub: 'deadline', kind: d.type || 'Dinas', id: d.id, sheet: 'Deadlines' }); });
    Store.all('Assignments').forEach((a) => { if (inR(a.deadline) && !['Selesai', 'Dinilai'].includes(a.status)) out.push({ date: a.deadline, time: '', title: `Deadline: ${a.title}`, color: 'amber', mod: 'school', sub: 'tugas', kind: a.type || 'Tugas', id: a.id, sheet: 'Assignments' }); });
  }
  if (mods.includes('project')) {
    Store.all('Projects').forEach((p) => { if (inR(p.deadline) && !['Selesai', 'Batal'].includes(p.status)) out.push({ date: p.deadline, time: '', title: `Deadline ${p.clientName}`, color: 'violet', mod: 'project', sub: 'daftar', kind: 'Project', id: p.id, sheet: 'Projects' }); });
  }
  if (mods.includes('tutor')) {
    const cls = Object.fromEntries(Store.all('TutorClasses').map((c) => [c.id, c]));
    Store.all('TutorSessions').forEach((s) => { if (inR(s.date) && s.status !== 'Batal') out.push({ date: s.date, time: s.start, title: `${(cls[s.classId] || {}).name || 'Kelas'} #${s.no}`, color: 'rose', mod: 'tutor', sub: 'sesi', kind: 'Sesi', id: s.id, sheet: 'TutorSessions', done: s.status === 'Selesai' }); });
  }
  if (mods.includes('finance')) {
    const loans = Object.fromEntries(Store.all('Loans').map((l) => [l.id, l]));
    Store.all('LoanInstallments').forEach((i) => { if (inR(i.dueDate) && i.status !== 'Lunas') out.push({ date: i.dueDate, time: '', title: `Cicilan ${(loans[i.loanId] || {}).creditor || ''}`, color: 'coral', mod: 'finance', sub: 'pinjaman', kind: 'Cicilan', id: i.id, sheet: 'LoanInstallments' }); });
  }
  return out.sort((a, b) => (a.date + (a.time || '99')).localeCompare(b.date + (b.time || '99')));
}

function sparkline(values, color = 'var(--jade)') {
  if (!values.length) return '';
  const w = 300, h = 54, min = Math.min(...values), max = Math.max(...values);
  const span = max - min || 1;
  const pts = values.map((v, i) => [(i / Math.max(1, values.length - 1)) * w, h - 4 - ((v - min) / span) * (h - 10)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d} L${w} ${h} L0 ${h}Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" vector-effect="non-scaling-stroke"/></svg>`;
}
